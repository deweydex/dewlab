# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# event is not repeated here: sets-as-sorted-lists introduces it, and
# complement comes from venn-diagrams, both earlier in this series.
entries:
  - term: simulate
    kind: concept
    definition: >
      To simulate a random event is to write code that makes it happen
      many times, at random, and to count the results.
  - term: trial
    kind: concept
    definition: >
      A trial is one run of a random event, such as one roll of two dice
      in a simulation.
  - term: outcome
    kind: concept
    definition: >
      An outcome is one possible result of a random event, such as (3, 4)
      on two dice.
  - term: probability
    kind: concept
    definition: >
      Probability is a number from 0 to 1 that measures how likely an
      event is. 0 means impossible, and 1 means certain.
  - term: "P(A), when outcomes are equally likely"
    kind: formula
    definition: >
      When every outcome is equally likely, the probability of an event A
      is the number of outcomes in A divided by the number of all
      outcomes.
    example: "P(total is 7) = 6 / 36 = 1 / 6"
  - term: law of large numbers
    kind: concept
    definition: >
      The law of large numbers says that the more trials we run, the
      closer the share we see usually comes to the probability. It comes
      slowly: ten times closer needs about a hundred times the trials.
  - term: compound event
    kind: concept
    definition: >
      A compound event is an event made from others with "and", "or" and
      "not": the intersection, union and complement of their sets.
  - term: "P(A or B)"
    kind: formula
    definition: >
      The chance that A or B happens is P(A) + P(B) - P(A and B): the
      overlap is taken away once, since adding counts it twice. It is
      inclusion-exclusion with probabilities.
    example: "P(double or high) = 1/6 + 1/6 - 1/18 = 5/18"
  - term: mutually exclusive
    kind: concept
    definition: >
      Two events are mutually exclusive when they cannot both happen,
      such as a total of 2 and a total of 12. For them, P(A or B) is
      P(A) + P(B).
  - term: independent
    kind: concept
    definition: >
      Two events are independent when knowing that one happened does not
      change the chance of the other. Then, and only then, P(A and B) is
      P(A) x P(B), which is how to check it.
    example: "first die is 6, and total is 7: 1/36 = 1/6 * 1/6"
  - term: without replacement
    kind: concept
    definition: >
      Drawing without replacement means an item drawn is not put back, so
      the first draw changes what the second can be.
    example: "P(two aces) = 4/52 * 3/51"
  - term: conditional probability, P(B | A)
    kind: formula
    definition: >
      The chance of B when we know A happened, read "B given A". It counts
      inside the smaller group where A happened: P(A and B) / P(A).
      P(B | A) and P(A | B) can be very different.
    example: "P(sick | positive) = 99 / 10,098"
  - term: natural frequencies
    kind: concept
    definition: >
      Natural frequencies give a chance as a count of people or cases,
      such as 99 of 10,098 positive tests, rather than as a percentage.
      They make conditional probabilities much easier to follow.
  - term: Bayes' theorem
    kind: formula
    definition: >
      The rule that turns P(A | B) into P(B | A). Counting a million
      people through a medical test, as a table, is the rule written as a
      count.
  - term: "random.randint()"
    python: random.randint
    kind: function
    definition: Picks a whole number at random between two numbers, including both.
    example: "random.randint(1, 6)  # one roll of a die"
  - term: "random.random()"
    python: random.random
    kind: function
    definition: >
      Gives a random number from 0 up to, but not including, 1. It is
      below 0.99 on 99% of calls.
    example: "random.random() < 0.99"
  - term: "random.sample()"
    python: random.sample
    kind: function
    definition: >
      Draws several different items from a list at random, without
      replacement.
    example: "random.sample(deck, 2)"
  - term: Fraction
    python: fractions.Fraction
    kind: function
    definition: >
      Keeps a number as an exact fraction, so 1/6 stays 1/6 rather than
      0.16666666666666666.
    example: "Fraction(6, 36)  # 1/6"
