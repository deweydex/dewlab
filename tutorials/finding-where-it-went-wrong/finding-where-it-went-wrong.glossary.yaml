# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# The Problem Solving series has one tutorial. Checked against every other
# glossary file in computational-methods. "index", ".split()", "max()",
# "aliasing", "seed", "random.seed()" and "random.randint()" are taught
# earlier in the course and are used here without a new entry. The five
# habits (initiative and the rest) are the syllabus's names for CMPS-LO12,
# named on the page after the reader has used each one.
entries:
  - term: log
    kind: concept
    definition: >
      A log is a written record of how you look for a bug. For each idea
      it has three lines: your guess about the cause, the test you ran,
      and what happened.

  - term: symptom, cause
    kind: concept
    definition: >
      A symptom is what you can see going wrong, such as a crash or a
      wrong answer. The cause is the mistake in the code that makes it
      happen. A fix for the symptom can hide the cause, and the cause
      stays in the code.

  - term: bisection
    kind: concept
    definition: >
      Bisection finds a bug by checking the middle of a program first.
      You keep the half that still goes wrong, and check the middle of
      that half. Each check cuts the search in two.

  - term: minimal reproduction
    kind: concept
    definition: >
      A minimal reproduction is the smallest program, or the smallest
      input, that still shows a bug. You find it by making the example
      shorter for as long as the bug is still there.

  - term: pragmatic problem-solving, semantic analysis
    kind: concept
    definition: >
      These are the course description's names for two ways to respond to
      a bug. Pragmatic problem-solving treats the symptom. Semantic
      analysis finds the cause.

  - term: initiative, a methodical approach, logical reasoning, persistence, lateral thinking
    kind: concept
    definition: >
      These are five habits that help to find a bug. Initiative starts a
      test nobody asked for. A methodical approach asks the same questions
      each time, in order. Logical reasoning uses what one check showed to
      choose the next. Persistence continues after the symptom has gone.
      Lateral thinking chooses a test that nothing in the problem
      suggested.

  - term: "repr()"
    kind: function
    python: repr
    definition: >
      Returns a value written the way it looks in code. Text keeps its
      quotes, so empty text shows as '' and does not disappear.
    example: "print(repr(''))"

  - term: "round()"
    kind: function
    python: round
    definition: >
      Returns a number rounded to the number of decimal places you give.
      With no places given, it rounds to a whole number.
    example: "round(2.500000000000001, 1)"
