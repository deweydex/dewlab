<svg baseProfile="full" fill="currentColor" font-family="'Helvetica Neue', Inter, system-ui, sans-serif" height="387px" version="1.1" viewBox="0 0 640 387" width="640px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><circle cx="141.0" cy="256.0" fill="var(--dl-highlight-blue)" r="105.0" stroke="currentColor" stroke-width="1.6" /><circle cx="267.0" cy="88.0" fill="var(--dl-highlight-bg)" r="42.0" stroke="currentColor" stroke-width="1.6" /><text fill="currentColor" font-size="14px" text-anchor="middle" x="123.0" y="288.0">player</text><text fill="currentColor" font-size="14px" text-anchor="middle" x="271.0" y="36.0">ball</text><circle cx="141.0" cy="256.0" fill="currentColor" r="3.2" /><circle cx="267.0" cy="88.0" fill="currentColor" r="3.2" /><line stroke="currentColor" stroke-linecap="round" stroke-width="2.4" x1="141.0" x2="204.0" y1="256.0" y2="172.0" /><line stroke="currentColor" stroke-dasharray="5,4" stroke-linecap="round" stroke-width="2" x1="204.0" x2="241.8" y1="172.0" y2="121.6" /><line stroke="currentColor" stroke-linecap="round" stroke-width="2.4" x1="241.8" x2="267.0" y1="121.6" y2="88.0" /><text fill="currentColor" font-size="14px" text-anchor="start" x="185.3" y="227.6">25</text><text fill="currentColor" font-size="14px" text-anchor="start" x="235.7" y="160.4">gap 15</text><text fill="currentColor" font-size="14px" text-anchor="start" x="267.2" y="118.4">10</text><text fill="currentColor" font-size="13px" text-anchor="start" x="374" y="261.0">between the centres: 50</text><text fill="currentColor" font-size="13px" text-anchor="start" x="374" y="283.0">the two radii: 25 + 10 = 35</text><text fill="var(--dl-muted)" font-size="13px" text-anchor="start" x="374" y="305.0">50 − 35 = 15, a gap between</text><text fill="var(--dl-muted)" font-size="13px" text-anchor="start" x="374" y="327.0">the edges, so they do not touch.</text></svg>