# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: unit circle
    kind: concept
    definition: >
      The unit circle is a circle of radius 1 with its center at the
      origin. Every point on it is at distance 1 from the center. Sine and
      cosine are built on that one fact.
  - term: cosine, sine
    kind: concept
    definition: >
      Cosine and sine are the coordinates of a point on the unit circle,
      for an angle measured from the positive x-axis. Cosine is the across
      (x) value and sine is the up (y) value. The coordinates came first,
      and cosine and sine are their names.
    example: "math.cos(angle), math.sin(angle)"
  - term: "sin^2(theta) + cos^2(theta) = 1"
    kind: formula
    definition: >
      This identity is Pythagoras on the unit circle. Every point is at
      distance 1 from the center, so x^2 + y^2 = 1, and x and y are
      cos(theta) and sin(theta).
  - term: radian
    kind: concept
    definition: >
      A radian is the angle you turn through when the arc you walk along
      the edge equals the radius. A full turn is 2*pi radians, because
      2*pi is the distance round a circle of radius 1.
  - term: degrees, radians conversion
    kind: formula
    definition: >
      360 degrees equals 2*pi radians, so we convert by proportion. One
      radian is about 57.3 degrees.
    example: "radians = degrees * math.pi / 180"
  - term: hypotenuse
    kind: concept
    definition: >
      The hypotenuse of a right-angled triangle is its longest side. It is
      the side opposite the right angle.
  - term: exact trig values (0, 30, 45, 60, 90 degrees)
    kind: formula
    definition: >
      These are the cos and sin pairs we can work out exactly with
      Pythagoras: 0 -> (1, 0); 30 -> (sqrt(3)/2, 1/2); 45 -> (sqrt(2)/2,
      sqrt(2)/2); 60 -> (1/2, sqrt(3)/2); 90 -> (0, 1). A decimal version
      is a slightly different number, so the exact form matters.
  - term: surd form
    kind: concept
    definition: >
      Surd form is a way of writing a number with a root left as a root,
      such as sqrt(2)/2. It is exact. A decimal such as 0.7071 is close,
      but it is a different number.
  - term: tangent
    kind: concept
    definition: >
      The tangent of an angle is the up value divided by the across value
      (sin/cos). It is the slope of the line from the origin to that point
      on the circle. It has no value at 90 degrees, for the same reason a
      vertical line has no slope.
