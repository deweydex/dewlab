# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: function (exactly one output)
    kind: concept
    definition: >
      In mathematics, a function is a rule that gives exactly one output
      for each input, and the same output every time. A Python function
      that can return different results for the same input, like one using
      random, is not a function in this sense. It has no graph, because
      there is no single height above a given x.
  - term: domain, range (of a function)
    kind: concept
    definition: >
      The domain is the set of inputs a function can accept. The range is
      the set of outputs it can give. reciprocal(0) and sqrt(-1) fail
      because 0 and -1 are outside those functions' domains.
  - term: graph (of a function)
    kind: concept
    definition: >
      The graph of a function is its outputs, drawn as points above its
      inputs. It is a long list of (x, y) pairs seen from far away.
  - term: closure (a function returning a function)
    kind: concept
    definition: >
      A closure is a function that builds and returns another function.
      The new function remembers the values it was given. It is useful when
      you want a whole family of similar functions.
    example: "def line(m, c):\n    def f(x):\n        return m * x + c\n    return f"
  - term: slope (m), intercept (c)
    kind: concept
    definition: >
      These are the two numbers that describe a straight line y = mx + c.
      The slope m tilts the line, and the intercept c slides it up or down.
      Changing one does not change what the other does.
    example: "y = m*x + c"
  - term: highest power sets the number of turns
    kind: concept
    definition: >
      A curve can turn at most one time fewer than its highest power. A
      line (x^1) does not turn. A quadratic (x^2) turns once. A cubic (x^3)
      turns at most twice.
  - term: inverse function
    kind: concept
    definition: >
      An inverse function undoes what a function did: if f turns 3 into 6,
      its inverse turns 6 back into 3. Its graph is the original reflected
      across y = x. An inverse exists only when the function never sends
      two different inputs to the same output.
