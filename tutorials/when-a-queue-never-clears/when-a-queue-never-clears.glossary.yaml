# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# Fourth tutorial of the Simulation series. Checked against the earlier
# three tutorials' cumulative glossary -- no overlap. leaving-it-to-chance
# foreshadows this tutorial by name, and links to it, as a simulation
# that gives a strange result: a queue that never clears.
entries:
  - term: server (queue)
    kind: concept
    definition: >
      The server is the part of a queue that deals with what has arrived.
      Its capacity is the most items it can clear in one step.

  - term: stable (queue)
    kind: concept
    definition: >
      A queue is stable when it keeps coming back to empty and has a
      typical length it hovers around. Average arrivals per step stay
      below what the server can clear, so after a run of bad luck the
      queue drains away again, and its average length settles.

  - term: unstable (queue)
    kind: concept
    definition: >
      A queue is unstable when average arrivals per step are at or above
      what the server can clear. It has no typical length: the longer it
      runs, the longer its average length gets. It does not have to grow
      fast to be unstable.

  - term: utilisation
    kind: concept
    definition: >
      The share of a server's capacity that the arrivals use, on average:
      the average arrivals per step, divided by what the server can clear
      in a step. Below 1 the queue is stable; at 1 or more it is not.

  - term: hockey stick (queues)
    kind: concept
    definition: >
      The shape of the average wait, drawn against the utilisation. It
      stays nearly flat while the server has plenty of idle time, then
      turns sharply up as the utilisation nears 1, because a burst of
      arrivals has almost no spare time to be cleared in.

  - term: "min()"
    python: min
    kind: function
    definition: >
      Gives back the smallest of the values it is given.
    example: "served = min(queue, service_capacity)"
