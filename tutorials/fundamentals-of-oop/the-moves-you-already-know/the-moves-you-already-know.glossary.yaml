# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# First tutorial of its series (Programming with objects) and its module
# (Fundamentals of Object Oriented Programming), so there is no cumulative
# glossary to check against yet. sequence/selection/iteration are all
# emphasised in the PDP module's own tutorials too (repeating-yourself,
# making-decisions), but fundamentals-of-oop has no series.yaml pulling
# that module's vocabulary forward — same as objects-and-classes'
# class/object, these are taught fresh here as this module's own terms.
entries:
  - term: sequence
    kind: concept
    definition: >
      A sequence is a program's lines running in the order they are
      written, one after another.

  - term: selection
    kind: concept
    definition: >
      A selection is a program choosing between two or more paths,
      usually with an if statement.

  - term: iteration
    kind: concept
    definition: >
      An iteration is a program repeating one step more than once,
      usually with a loop.
