# Hand-written, not skill-generated — the first two glossaries in the series
# exist to prove out the schema and the judgment rules in
# .claude/skills/tutorial-glossary/SKILL.md before trusting the skill to run
# unattended over the rest of the curriculum. See planning/REFERENCE_PANEL.md.
#
# "variables" is emphasized in this tutorial's own closing paragraph
# ("we will learn about *variables*") but is left out here on purpose: that
# sentence describes what storing-and-computing.md teaches, not something
# this tutorial itself defines. A term only belongs to the tutorial that
# actually introduces it.
entries:
  - term: program
    kind: concept
    definition: >
      A program is a set of clear steps, written carefully enough for a
      computer to follow.
  - term: cell
    kind: concept
    definition: >
      A cell is a small box of Python code inside a tutorial page. You can
      change the code and run it, and the result appears underneath.
      Nothing you type leaves your browser.
  - term: function
    kind: concept
    definition: >
      A function is a named tool that does one job. You use it by writing
      its name followed by brackets, like print(). What a function is made
      of comes later.
  - term: "print()"
    kind: function
    definition: Displays whatever is inside its brackets.
    example: 'print("Hello, world!")'
  - term: comment
    kind: concept
    definition: >
      A comment is a note for the people who read the code. In Python it
      starts with #, and Python ignores it.
  - term: algorithm
    kind: concept
    definition: >
      An algorithm is a list of clear steps that complete a task. Each step
      has only one meaning, and the steps are followed exactly, in order.
  - term: loop
    kind: concept
    definition: >
      A loop is a step, or a group of steps, that repeats until a condition
      is met. "While the water has not boiled, wait" is a loop.
  - term: pseudocode
    kind: concept
    definition: >
      Pseudocode is a plan for a program, written in plain English before
      the Python. It can include a little code-like structure, but no
      computer runs it.
  - term: "+"
    kind: operator
    definition: Adds two numbers.
  - term: "-"
    kind: operator
    definition: Subtracts the right number from the left.
  - term: "*"
    kind: operator
    definition: Multiplies two numbers.
  - term: "/"
    kind: operator
    definition: "Divides. The result is always a decimal number: 17 / 5 is 3.4, and 6 / 3 is 2.0."
  - term: "//"
    kind: operator
    definition: "Divides, then rounds down to a whole number. This is floor division: 17 // 5 is 3."
  - term: "%"
    kind: operator
    definition: "Gives the remainder after division. This is modulo: 17 % 5 is 2."
  - term: "**"
    kind: operator
    definition: "Raises a number to a power: 2 ** 3 is 8."
  - term: "#"
    kind: keyword
    definition: Starts a comment. Python ignores everything after it on the same line.
  - term: order of operations
    kind: concept
    definition: >
      The order of operations is the order Python works through a
      calculation: brackets first, then powers, then multiplication and
      division, then addition and subtraction. It is the same rule as
      BODMAS or PEMDAS in school maths.
