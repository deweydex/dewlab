# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: expression, equation
    kind: concept
    definition: >
      An expression is a piece of mathematics that has a value, such as
      3x + 7. An equation is a statement that two expressions are equal,
      such as 3x + 7 = 22, and it can be true or false depending on x.
      You evaluate an expression; you solve an equation.
  - term: evaluate
    kind: concept
    definition: >
      To evaluate an expression is to work out its value for one chosen
      value of x. At x = 4, 3x^2 + 5x - 2 evaluates to 66.
  - term: polynomial, term, coefficient
    kind: concept
    definition: >
      A polynomial is an expression made by adding up terms. Each term is
      a number times a whole-number power of x, such as 3x^2. The number
      in front, here 3, is the term's coefficient.
  - term: constant term
    kind: concept
    definition: >
      The constant term is the term of a polynomial with no x in it. In
      3x^2 + 5x - 2 it is -2, which we can think of as -2 * x^0.
  - term: degree (linear, quadratic, cubic)
    kind: concept
    definition: >
      The degree of a polynomial is the highest power of x in it. Degree 1
      is called linear, degree 2 quadratic, and degree 3 cubic. So
      3x^2 + 5x - 2 is a quadratic.
  - term: polynomial (as a coefficient list)
    kind: concept
    definition: >
      We store a polynomial as a Python list of its coefficients. Index i
      holds the coefficient of x^i, so the list index matches the
      exponent.
    example: "3x^2 + 5x - 2  <->  [-2, 5, 3]"
  - term: expanding the brackets, FOIL method
    kind: concept
    definition: >
      To expand brackets, multiply each term of the first polynomial by
      every term of the second, then add the results. For two two-term
      brackets, the FOIL method gives the order: First, Outer, Inner,
      Last.
    example: "(2x + 3)(x + 4) = 2x^2 + 8x + 3x + 12"
  - term: scaling (a polynomial)
    kind: concept
    definition: >
      Scaling a polynomial means multiplying every coefficient by the
      same number. Scaling 3x^2 + 5x - 2 by 2 gives 6x^2 + 10x - 4.
  - term: representation
    kind: concept
    definition: >
      A representation is the way we choose to store something as data.
      Storing a polynomial as a coefficient list turns adding polynomials
      into adding list items.
  - term: identity
    kind: concept
    definition: >
      An identity is an equation that is true for every value of x, such
      as (x + 1)^2 = x^2 + 2x + 1. A correct expansion is always an
      identity. An equation such as 3x + 7 = 22 is true for only one x.
  - term: "(a + b)^2"
    kind: formula
    definition: >
      (a + b)^2 = a^2 + 2ab + b^2. It is not a^2 + b^2: the middle term
      2ab comes from multiplying a by b twice, once each way.
    example: "(3 + 4) ** 2  # 49, and 3 ** 2 + 4 ** 2 is only 25"
