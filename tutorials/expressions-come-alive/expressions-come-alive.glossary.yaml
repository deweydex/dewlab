# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: expression, equation
    kind: concept
    definition: >
      An expression is a mathematical phrase with a value (3x + 7) — it
      asserts nothing. An equation states two expressions are equal
      (3x + 7 = 22) and can be true or false depending on x. You evaluate
      an expression; you solve an equation.
  - term: polynomial (as a coefficient list)
    kind: concept
    definition: >
      A polynomial like 3x^2 + 5x - 2 stored as a list of coefficients.
      Index i holds the coefficient of x^i, so the list index matches the
      exponent.
    example: "3x^2 + 5x - 2  <->  [-2, 5, 3]"
  - term: FOIL method
    kind: concept
    definition: >
      When multiplying two polynomials, distribute each term of the first
      across every term of the second. For two two-term expressions the
      order is First, Outer, Inner, Last.
    example: "(2x + 3)(x + 4) = 2x^2 + 8x + 3x + 12"
