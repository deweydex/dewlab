# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# "tangent line" is deliberately not just "tangent" — that name is
# already taken, for the trig ratio, in the-unit-circle.glossary.yaml.
# Same word, unrelated meaning; keeping them as distinct terms avoids
# one silently shadowing the other.
entries:
  - term: chord
    kind: concept
    definition: >
      A chord is a straight line that joins two points on a curve. As the
      two points move closer together, the chord's slope heads for the
      derivative.
  - term: derivative
    kind: concept
    definition: >
      The derivative of a function at a point is the slope of its curve at
      that one point. We find it as a limit: the slope of a chord, as the
      gap between its two points shrinks. The same number is also the
      slope of the tangent line and the rate of change.
  - term: tangent line
    kind: concept
    definition: >
      The tangent line at a point is the straight line that touches a curve
      at that point and has the same steepness as the curve there. Its
      slope is the derivative at that point.
  - term: derivative is a function
    kind: concept
    definition: >
      The derivative is a rule that gives the slope at any x, and not a
      single number. For example, the derivative of x^2 is the function
      2x.
  - term: "f' (f prime)"
    kind: formula
    definition: >
      This notation, said "f prime", means the derivative of f. If
      f(x) = x^2, then f'(x) = 2x.
  - term: differentiate
    kind: concept
    definition: >
      To differentiate a function means to find its derivative.
  - term: "power rule: d/dx(x^n) = n*x^(n-1)"
    kind: formula
    definition: >
      The power rule gives the derivative of x^n. Bring the power down to
      the front, and reduce the power by one.
    example: "power_rule(3) is the function lambda x: 3 * x ** 2"
  - term: "sum rule: d/dx(f + g) = f' + g'"
    kind: formula
    definition: >
      The derivative of a sum is the sum of the derivatives. That is why a
      polynomial can be differentiated one term at a time.
  - term: "product rule: d/dx(f * g) = f'*g + f*g'"
    kind: formula
    definition: >
      The derivative of a product is not the product of the derivatives.
      Differentiate each factor in turn, leaving the other alone, and add
      the two results.
  - term: "chain rule: d/dx(f(g(x))) = f'(g(x)) * g'(x)"
    kind: formula
    definition: >
      The chain rule is for one function inside another. Differentiate the
      outside and leave the inside alone, then multiply by the derivative
      of the inside. Rates multiply: if u changes three times as fast as x,
      and y twice as fast as u, then y changes six times as fast as x.
  - term: turning point is where the derivative is zero
    kind: concept
    definition: >
      A curve is flat for a moment at a turning point, so its derivative is
      zero there. This gives the same vertex as completing the square in
      Parabolas. A zero slope does not always mean a turning point: x^3 is
      flat at 0 but keeps climbing.
