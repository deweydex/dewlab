# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: transformation matrix
    kind: concept
    definition: >
      A transformation matrix is a matrix that we read as an instruction
      for moving every point of a picture. Multiplying the matrix by a set
      of points carries out the instruction.
  - term: reading a matrix's columns
    kind: concept
    definition: >
      For any 2×2 matrix, the first column is where (1,0) lands and the
      second column is where (0,1) lands. Those two columns are enough to
      work out what happens to every other point.
  - term: stretch, squash, rotate, shear, reflect
    kind: concept
    definition: >
      Five effects that a 2×2 matrix can have on a picture. A stretch makes
      it wider or taller, a squash makes it narrower or shorter, a rotation
      turns it, a shear slides one edge sideways while the opposite edge
      stays, and a reflection flips it like a mirror. Try to recognise
      them from a matrix's numbers before you run it, and from the
      picture afterwards.
