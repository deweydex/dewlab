entries:
  - term: development environment
    kind: concept
    definition: >
      A development environment is the set of tools sitting around your
      code: an editor to write it in, a way to run it and see what
      happened, and help finding out why it broke.

  - term: autocomplete
    kind: concept
    definition: >
      Autocomplete is the editor offering to finish a name while you type
      it. It lists the names that exist in your code right now.

  - term: integrated development environment
    kind: concept
    definition: >
      An integrated development environment is an editor that also reads
      your code as you write it. It can finish names for you, show what a
      name is, and point to the line where an error happened.
