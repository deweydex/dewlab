#
# Third tutorial of the Programming with objects series since 2026.09.26,
# after objects-and-classes and the-moves-you-already-know. Checked
# against their glossaries: no overlap. traceback and debugging are
# emphasised in the Programming Foundations pages too (reading-an-error-message,
# when-it-goes-wrong), but that is another series, so they are named here
# as this series' own terms. "docstring" is explained in one plain
# sentence here but left to documenting-a-class, which teaches it.
entries:
  - term: traceback
    kind: concept
    definition: >
      A traceback is Python's list of the calls that were running when an
      error stopped the program. Read it from the bottom: the last line
      names the error, and the lines above it lead back to the call you
      made.

  - term: debugging
    kind: concept
    definition: >
      Debugging is finding the mistake that makes a program go wrong, and
      fixing it. When nothing fails, a print() inside a method can show
      what its fields hold as it runs.

  - term: development environment
    kind: concept
    definition: >
      A development environment is the set of tools around your code: an
      editor to write it in, a way to run it and see what happened, and
      help finding out why it broke.

  - term: autocomplete
    kind: concept
    definition: >
      Autocomplete is the editor offering to finish a name while you type
      it. It lists the names that exist in your code right now.

  - term: integrated development environment
    kind: concept
    definition: >
      An integrated development environment is an editor that also reads
      your code as you write it. It can finish names for you, show what a
      name is, and point to the line where an error happened.
