<svg baseProfile="full" fill="currentColor" font-family="'Helvetica Neue', Inter, system-ui, sans-serif" height="283px" version="1.1" viewBox="0 0 620 283" width="620px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs class="dl-pattern-defs"><pattern id="dlp-rules-with-letters-in-them-the-square-forgotten-dots" width="7" height="7" patternUnits="userSpaceOnUse" ><circle cx="3.5" cy="3.5" r="1.3" fill="currentColor"/></pattern><pattern id="dlp-rules-with-letters-in-them-the-square-forgotten-stripes" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="currentColor" stroke-width="1.6"/></pattern></defs><defs /><rect fill="var(--dl-cell-bg)" height="170" rx="0" stroke="currentColor" stroke-width="1.6" width="170" x="44" y="40" /><text fill="currentColor" font-size="15px" text-anchor="middle" x="129.0" y="128.0">x²</text><text fill="var(--dl-muted)" font-size="11.5px" text-anchor="middle" x="129.0" y="144.0">photo</text><rect fill="var(--dl-highlight-pink)" height="170" rx="0" stroke="currentColor" stroke-dasharray="6,3" stroke-width="1.6" width="51" x="214" y="40" /><rect height="170" rx="0" width="51" x="214" y="40"  fill="url(#dlp-rules-with-letters-in-them-the-square-forgotten-dots)" stroke="none" class="dl-pattern" aria-hidden="true"/><text fill="currentColor" font-size="15px" text-anchor="middle" x="239.5" y="128.0">3x</text><text fill="var(--dl-muted)" font-size="11.5px" text-anchor="middle" x="239.5" y="144.0">strip</text><text fill="var(--dl-muted)" font-size="11.5px" text-anchor="middle" x="239.5" y="158.0">left out</text><rect fill="var(--dl-highlight-pink)" height="51" rx="0" stroke="currentColor" stroke-dasharray="6,3" stroke-width="1.6" width="170" x="44" y="210" /><rect height="51" rx="0" width="170" x="44" y="210"  fill="url(#dlp-rules-with-letters-in-them-the-square-forgotten-dots)" stroke="none" class="dl-pattern" aria-hidden="true"/><text fill="currentColor" font-size="15px" text-anchor="middle" x="129.0" y="238.5">3x</text><text fill="var(--dl-muted)" font-size="11.5px" text-anchor="middle" x="129.0" y="254.5">bar, left out</text><rect fill="var(--dl-highlight-bg)" height="51" rx="0" stroke="currentColor" stroke-width="1.6" width="51" x="214" y="210" /><rect height="51" rx="0" width="51" x="214" y="210"  fill="url(#dlp-rules-with-letters-in-them-the-square-forgotten-stripes)" stroke="none" class="dl-pattern" aria-hidden="true"/><text fill="currentColor" font-size="15px" text-anchor="middle" x="239.5" y="238.5">9</text><text fill="var(--dl-muted)" font-size="11.5px" text-anchor="middle" x="239.5" y="254.5">corner</text><text fill="currentColor" font-size="15px" text-anchor="middle" x="129.0" y="32">x</text><text fill="currentColor" font-size="15px" text-anchor="middle" x="239.5" y="32">3</text><text fill="currentColor" font-size="15px" text-anchor="end" x="34" y="130.0">x</text><text fill="currentColor" font-size="15px" text-anchor="end" x="34" y="240.5">3</text><text fill="currentColor" font-size="15px" text-anchor="start" x="299" y="80">(x + 3)²</text><text fill="currentColor" font-size="15px" text-anchor="start" x="299" y="104">= x² + 3x + 3x + 9</text><text fill="currentColor" font-size="15px" text-anchor="start" x="299" y="128">= x² + 6x + 9</text><text fill="currentColor" font-size="15px" text-anchor="start" x="299" y="152" /><text fill="var(--dl-muted)" font-size="15px" text-anchor="start" x="299" y="176">x² + 9 keeps the photo</text><text fill="var(--dl-muted)" font-size="15px" text-anchor="start" x="299" y="200">and the corner, and leaves</text><text fill="var(--dl-muted)" font-size="15px" text-anchor="start" x="299" y="224">out the two 3x pieces.</text></svg>