.5px" x="26" y="170">basis 90px</text><rect fill="var(--dl-highlight-bg)" height="44" stroke="none" width="81.33333333333333" x="140.0" y="135" /><rect fill="none" height="46" rx="4" stroke="currentColor" stroke-width="1.2" width="205.33333333333331" x="16" y="134" /><text font-size="10.5px" text-anchor="middle" x="180.66666666666666" y="162">+ share</text><rect fill="var(--dl-cell-bg)" height="46" rx="4" stroke="currentColor" stroke-width="1.2" width="124.0" x="233.33333333333331" y="134" /><text font-size="12px" x="243.33333333333331" y="153">Two</text><text fill="var(--dl-muted)" font-size="10.5px" x="243.33333333333331" y="170">basis 90px</text><rect fill="var(--dl-highlight-bg)" height="44" stroke="none" width="81.33333333333333" x="357.3333333333333" y="135" /><rect fill="none" height="46" rx="4" stroke="currentColor" stroke-width="1.2" width="205.33333333333331" x="233.33333333333331" y="134" /><text font-size="10.5px" text-anchor="middle" x="398.0" y="162">+ share</text><rect fill="var(--dl-cell-bg)" height="46" rx="4" stroke="currentColor" stroke-width="1.2" width="124.0" x="450.66666666666663" y="134" /><text font-size="12px" x="460.66666666666663" y="153">Three</text><text fill="var(--dl-muted)" font-size="10.5px" x="460.66666666666663" y="170">basis 90px</text><rect fill="var(--dl-highlight-bg)" height="44" stroke="none" width="81.33333333333333" x="574.6666666666666" y="135" /><rect fill="none" height="46" rx="4" stroke="currentColor" stroke-width="1.2" width="205.33333333333331" x="450.66666666666663" y="134" /><text font-size="10.5px" text-anchor="middle" x="615.3333333333333" y="162">+ share</text><text fill="currentColor" font-family="'Helvetica Neue', Inter, system-ui, sans-serif" font-size="12px" text-anchor="middle" x="336.0" y="208">Each card starts at its basis, then grows by an equal share</text><text fill="var(--dl-muted)" font-family="'Helvetica Neue', Inter, system-ui, sans-serif" font-size="10.5px" text-anchor="middle" x="336.0" y="224">of