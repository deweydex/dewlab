# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: list, element
    kind: concept
    definition: >
      A list is a row of values kept in order, written inside square
      brackets with commas between them. Each value in it is an element.
    example: '["MEET", "ME", "AT", "NOON"]'
  - term: index, zero-based indexing
    kind: concept
    definition: >
      An index is an element's position in a list. Python starts counting
      at 0, so the first element is at index 0. A negative index counts
      from the end: -1 is the last element.
    example: "words[0], words[-1]"
  - term: slice
    kind: concept
    definition: >
      A slice is a part of a list or a string, taken with [start:end]. The
      two numbers are cuts between elements, so the element at end is not
      included.
    example: 'letters[2:5]  # 3 elements'
  - term: mutable, immutable
    kind: concept
    definition: >
      A mutable value can be changed after it is made: a list can have
      elements replaced or added. An immutable value cannot: a string
      stays as it was, and a changed one is built new.
  - term: "append()"
    python: list.append
    kind: function
    definition: Adds one element to the end of a list, changing that list.
    example: "row.append(0)"
  - term: "enumerate()"
    python: enumerate
    kind: function
    definition: Gives both the index and the element each time a loop goes round a list.
    example: "for index, word in enumerate(words):"
  - term: ".split()"
    python: str.split
    kind: function
    definition: Cuts a string into a list of words, wherever there are spaces.
    example: "\"MEET ME AT NOON\".split()  # ['MEET', 'ME', 'AT', 'NOON']"
