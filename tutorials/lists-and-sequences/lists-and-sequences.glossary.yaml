# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: list
    kind: concept
    definition: A list is an ordered sequence of values, written inside square brackets.
    example: "[42, 38, 35]"
  - term: index, zero-based indexing
    kind: concept
    definition: >
      An index is a value's position in a list. Python starts counting at
      0, so the first element is at index 0. A negative index counts from
      the end: -1 is the last element.
  - term: slice
    kind: concept
    definition: A slice is a part of a list, taken with [start:end]. The element at end is left out.
    example: "scores[2:5]"
  - term: mutable
    kind: concept
    definition: A mutable value is one that can be changed after it is created. A list is mutable, so you can replace, add or remove its elements.
  - term: "append()"
    kind: function
    definition: Adds one element to the end of a list, changing that list.
    example: "scores.append(50)"
  - term: "len()"
    kind: function
    definition: Gives the number of elements in a list, or the number of characters in a string.
    example: "len(scores)"
  - term: "enumerate()"
    kind: function
    definition: Gives both the index and the value of each element as a loop goes through a list.
    example: "for index, name in enumerate(names):"
  - term: function, def
    kind: keyword
    definition: >
      A function is a named block of code that you can use again and
      again. You define it with def and a name. You call it by writing
      that name followed by parentheses.
    example: "def greet(name):\n    print(\"Hello, \" + name)"
  - term: function body
    kind: concept
    definition: The function body is the indented code under def. It runs each time the function is called.
  - term: parameter, argument, return
    kind: concept
    definition: >
      A parameter is a function's own placeholder name for a value it
      expects. An argument is the actual value you pass in when you call
      the function. return sends a value back to the code that called the
      function, so that the value can be stored or used in more
      calculations.
  - term: sequence
    kind: concept
    definition: In mathematics, a sequence is a list of numbers made by a rule. The rule takes a position n and gives the value at that position.
    example: "1, 4, 9, 16, 25, ... from f(n) = n²"
  - term: dot product
    kind: formula
    definition: >
      The dot product of two lists is the sum you get when you multiply
      each pair of matching elements and add the results. It is used
      everywhere in machine learning and physics.
    example: "[1, 2, 3] . [4, 5, 6] = 1*4 + 2*5 + 3*6 = 32"
  - term: modular programming
    kind: concept
    definition: Modular programming is building a large program out of small pieces, each one tested on its own. Functions are the first tool for it.
