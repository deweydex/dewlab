# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# histogram, plt.hist(), matplotlib and the logarithmic scale are not
# repeated here: making-sense-of-data introduces them, earlier in this
# series.
entries:
  - term: Anscombe's quartet
    kind: concept
    definition: >
      Four small datasets, made by Francis Anscombe in 1973, with nearly
      the same means, standard deviations and correlation, which look
      nothing alike when drawn. The classic argument for drawing data
      before summing it up.
  - term: correlation
    kind: concept
    definition: >
      A number from -1 to 1 that measures how closely pairs of values
      follow a straight line. Near 0, there is no straight-line pattern,
      though there may be another kind.
  - term: "bar chart, line chart, scatter plot, pie chart"
    kind: concept
    definition: >
      A bar chart compares amounts across categories. A line chart shows a
      trend along something ordered, often time. A scatter plot shows how
      two sets of numbers relate, one point for each pair. A pie chart
      shows the parts of a whole, and is best used rarely, because bars
      are easier to compare than slices.
  - term: axes
    kind: concept
    definition: >
      In matplotlib, one chart inside a figure. plt.subplots makes a grid
      of them, so several charts can sit side by side.
    example: "fig, (left, right) = plt.subplots(1, 2)"
  - term: hot Jupiters
    kind: concept
    definition: >
      Giant planets, the size of Jupiter, that orbit their stars in a few
      days: closer than Mercury is to the Sun. They are among the easiest
      planets to find.
  - term: confounder
    kind: concept
    definition: >
      A third thing that makes two others move together, such as hot
      weather behind both ice cream sales and drownings. It is why
      correlation alone does not show cause.
  - term: chart junk
    kind: concept
    definition: >
      Anything on a chart that is decoration and carries no information.
  - term: central limit theorem
    kind: concept
    definition: >
      Anything added up from many independent random parts has a
      bell-shaped histogram, whatever shape each part has. So the means of
      many random samples make a bell around the population's mean.
  - term: normal distribution
    kind: concept
    definition: >
      The bell shape: highest in the middle, falling away evenly on both
      sides.
  - term: 68–95–99.7 rule
    kind: concept
    definition: >
      For data close to a normal distribution, about 68% of values are
      within one standard deviation of the mean, 95% within two, and 99.7%
      within three. It does not hold for skewed data.
  - term: "plt.bar(), plt.barh()"
    python: matplotlib.pyplot.bar
    kind: function
    definition: >
      Draw a bar chart from labels and their values: bar with upright bars,
      barh with horizontal ones, which suit long labels.
    example: "plt.barh(top.index, top.values)"
  - term: "plt.plot()"
    python: matplotlib.pyplot.plot
    kind: function
    definition: Draws a line chart through a sequence of points, in order.
    example: 'plt.plot(per_year.index, per_year.values, marker="o")'
  - term: "plt.scatter()"
    python: matplotlib.pyplot.scatter
    kind: function
    definition: Draws a scatter plot, one point for each (x, y) pair.
    example: "plt.scatter(planets.orbit_days, planets.radius_earths)"
  - term: "plt.subplots()"
    python: matplotlib.pyplot.subplots
    kind: function
    definition: >
      Makes a figure holding a grid of charts, and gives back the figure and
      its axes, one for each chart.
    example: "fig, axes = plt.subplots(2, 2)"
  - term: ".value_counts()"
    kind: function
    definition: >
      A pandas method that counts how often each value appears in a column,
      largest count first.
    example: "planets.method.value_counts()"
