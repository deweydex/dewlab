entries:
  - term: "Monte Carlo method"
    kind: concept
    definition: >
      The Monte Carlo method answers a question by making many random
      cases and counting how many of them meet some condition. It is named
      after the casino in Monte Carlo, and it is used where there is no
      formula, or the formula is too hard to work out.

  - term: "Monte Carlo simulation"
    kind: concept
    definition: >
      A Monte Carlo simulation is the Monte Carlo method run on a
      computer, with pseudo-random numbers as the random cases.

  - term: "Monte Carlo integration"
    kind: concept
    definition: >
      Monte Carlo integration is the Monte Carlo method used to measure an
      area or a volume. You throw points at a region whose size you
      already know. The fraction that lands inside the part you want
      gives you its size.
    example: "area = hits / n * area_of_the_region_you_threw_at"

  - term: "estimate"
    kind: concept
    definition: >
      An estimate is a number that is roughly right, but not exactly right.
      The answers earlier in this module were exact. An estimate carries an
      error that you can describe, but cannot remove.

  - term: "1/sqrt(n) error"
    kind: formula
    definition: >
      This rule says how a Monte Carlo estimate improves. The typical
      error falls in proportion to one over the square root of the number
      of samples. A hundred times the work buys one more correct decimal
      place.

  - term: "x^2 + y^2 <= 1"
    kind: formula
    definition: >
      This is the test for whether a point lies inside a circle of radius
      1 centred on the origin. It is Pythagoras' theorem, used to ask
      whether a point is inside, and not to find a distance.
    example: "if x * x + y * y <= 1:"

  - term: "running estimate"
    kind: concept
    definition: >
      A running estimate is the answer worked out again after every new
      sample, and kept in a list. Then you can plot the path it takes as
      it settles, and not only read its final value.

  - term: "accuracy"
    kind: concept
    definition: >
      Accuracy is how close an estimate is to the true answer. A model can
      be accurate on one run and less accurate on the next, because each
      run of a Monte Carlo method uses different random numbers.

  - term: "precision"
    kind: concept
    definition: >
      Precision is how much of an estimate stays the same when the whole
      thing is run again. A number can be precise without being accurate,
      accurate without being precise, or neither.
