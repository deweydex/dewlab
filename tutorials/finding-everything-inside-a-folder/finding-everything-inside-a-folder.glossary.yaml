# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# Algorithms series. Checked against every other glossary file in
# computational-methods (python-fundamentals, matrices, simulation,
# algorithms, problem-solving) -- no overlap. "iterative" is used in prose
# but not glossaried here: it is already taught, as a named term, in
# mit-pdp-maths-prog-integration's repeating-yourself.glossary.yaml.
entries:
  - term: tree
    kind: concept
    definition: >
      A tree is a structure where each value can lead to several others,
      and following it never leads back to where you started. A folder
      holding files and other folders is a tree. So is a family tree, or
      a table of contents with sections and subsections.

  - term: recursion
    kind: concept
    definition: >
      Recursion is a function calling itself, on a smaller version of the
      same problem. It needs a base case, or it never stops.

  - term: base case
    kind: concept
    definition: >
      The base case is the case a recursive function can answer without
      calling itself. For counting files, it is a folder with no
      subfolders.

  - term: call stack
    kind: concept
    definition: >
      The call stack is Python's own list of the function calls that have
      started but not yet finished. A recursive function uses it to
      remember what is left to do.

  - term: "pop()"
    python: list.pop
    kind: function
    definition: >
      Removes an item from a list and returns it. With nothing in the
      brackets, it removes the last item. pop(0) removes the first.
    example: "current = to_visit.pop()"

  - term: "extend()"
    python: list.extend
    kind: function
    definition: >
      Adds every item from another list to the end of a list.
    example: "to_visit.extend(current['subfolders'])"

  - term: depth-first
    kind: concept
    definition: >
      A way to walk a tree or a graph that goes as deep as it can down one
      branch, and finishes it, before it starts the next. Taking the last
      item from the list of places to visit, with pop(), walks this way.

  - term: breadth-first
    kind: concept
    definition: >
      A way to walk a tree or a graph level by level: every place one step
      from the start, then every place two steps away, and so on. Taking
      the first item from the list of places to visit, with pop(0), walks
      this way.

  - term: "os.walk()"
    python: os.walk
    kind: function
    definition: >
      Walks a real folder tree on a disk. For each folder it gives three
      things: the folder's path, the names of its subfolders, and the
      names of its files.
    example: "for here, subfolders, files in os.walk(root):"
