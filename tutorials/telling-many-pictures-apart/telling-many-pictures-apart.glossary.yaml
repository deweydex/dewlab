# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# Machine learning, Learning from pictures. Perceptron, weight, bias,
# epoch, training and test examples are defined in
# a-model-that-corrects-itself's glossary, the page before this one.
entries:
  - term: averaged perceptron
    kind: concept
    definition: >
      A perceptron that keeps the average of its weights over the whole of
      training, not the weights it has at the end. A few bad corrections
      near the end then change it only a little.

  - term: class
    kind: concept
    definition: >
      One kind of thing a classifier can name. On a page of digits, each
      digit is a class. Every picture belongs to exactly one class.

  - term: classifier
    kind: concept
    definition: >
      A model that sorts things into classes. One perceptron is a
      classifier with two classes. One perceptron for each class, with
      the highest total winning, is a classifier with as many classes as
      you like.

  - term: confusion matrix
    kind: concept
    definition: >
      A table with a row for each true class and a column for each answer
      a classifier gave. The right answers are on the diagonal. Every
      number off the diagonal counts one kind of mistake, such as a 1
      read as a 7.

  - term: MNIST
    kind: concept
    definition: >
      A collection of 70,000 handwritten digits, each on a grid of 28 by
      28 pixels: 60,000 for training and 10,000 for testing. It is the
      best-known test for classifiers of handwriting.
