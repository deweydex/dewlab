# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# Fourteenth tutorial of first-site. Checked against the cumulative
# glossary so far -- no overlap. `margin-top: auto` used to be defined
# here too; it moved with the footer to footer-at-the-bottom, the page
# that now teaches it.
entries:
  - term: "position: sticky"
    kind: keyword
    definition: >
      `position: sticky` keeps an element in place once scrolling would
      otherwise carry it past a given point, such as the top of the
      screen. Until then, it scrolls with everything else.
  - term: "position: fixed"
    kind: keyword
    definition: >
      `position: fixed` keeps an element in the same place in the
      window all the time. It no longer takes up space on the page, so
      the content after it can end up hidden behind it.
  - term: "position: static"
    kind: keyword
    definition: >
      `position: static` is the default value of `position`. The
      element scrolls with the page.
  - term: "position: relative"
    kind: keyword
    definition: >
      On its own, `position: relative` looks the same as `static`. With
      `top` or `left`, it moves the element a little from where it
      would normally sit.
