# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# Twentieth tutorial of first-site. Checked against the cumulative
# glossary so far -- no overlap.
#
# `order` and `auto-fill` used to sit here, in a section of their own
# with no live cell. `order` is now taught in order-on-screen, the
# tutorial after this one, and has its entry there. `auto-fill` only
# means something inside `repeat()`, which a-grid-gallery teaches beside
# `auto-fit`, so its entry belongs to that tutorial now.
entries:
  - term: grid-template-areas
    kind: keyword
    definition: >
      `grid-template-areas` names each area of a grid as a small map,
      one quoted line per row of the grid.
  - term: grid-area
    kind: keyword
    definition: "Assigns an element to one of the named areas set by `grid-template-areas`."
  - term: fr
    kind: keyword
    definition: >
      `fr` is a unit for grid columns and rows. It means a share of the
      space left over, so `150px 1fr` gives the second column all the
      width the first one does not use.
