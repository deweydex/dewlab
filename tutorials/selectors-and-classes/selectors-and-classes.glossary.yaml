# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# Twelfth tutorial of first-site. Checked against the cumulative
# glossary so far (rule, selector, declaration, plus everything
# earlier) -- no overlap; this tutorial names two specific kinds of
# selector, not the general term itself.
entries:
  - term: class selector
    kind: concept
    definition: >
      A class selector is a dot and a class name, such as `.highlight`.
      It matches every element carrying that class, wherever it sits on
      the page.
  - term: descendant selector
    kind: concept
    definition: >
      A descendant selector is two selectors joined by a space, such as
      `.highlight p`. It matches an element nested inside another at any
      depth, not only as a direct child.
