# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: parabola
    kind: concept
    definition: >
      A parabola is the curve that a quadratic makes. Every quadratic with
      the same leading coefficient a is the same parabola, slid sideways
      and up or down.
  - term: vertex
    kind: concept
    definition: >
      The vertex of a parabola is its turning point. It is the lowest point
      if the parabola opens upwards, and the highest point if it opens
      downwards.
  - term: completing the square
    kind: concept
    definition: >
      Completing the square is rewriting x^2 + bx + c as (x + h)^2 + k. It
      is the same function, written so that its vertex shows. Halve b to
      get h, then k = c - h^2.
  - term: "vertex form: (x + h)^2 + k"
    kind: formula
    definition: >
      This form of a quadratic shows its vertex, at (-h, k). The vertex can
      be read from the expression because a square is never negative.
    example: "x^2 + 6x + 5 = (x + 3)^2 - 4, vertex at (-3, -4)"
