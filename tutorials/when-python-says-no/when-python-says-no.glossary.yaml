# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: traceback
    kind: concept
    definition: >
      A traceback is Python's report of an error. Read it from the last
      line up: the last line gives the kind of error and what happened,
      and the lines above say where.
  - term: NameError
    python: NameError
    kind: keyword
    definition: >
      A NameError means Python met a name that points at nothing. Usually
      the name is misspelled, or it has not been given a value yet.
    example: "print(totl)"
  - term: TypeError
    python: TypeError
    kind: keyword
    definition: >
      A TypeError means a move was used on the wrong kind of value, such
      as joining a string and a number with +.
    example: '"Each person pays €" + 28.2'
  - term: ZeroDivisionError
    python: ZeroDivisionError
    kind: keyword
    definition: >
      A ZeroDivisionError means the code tried to divide by zero, which has
      no answer in any number family.
    example: "60 / 0"
  - term: syntax, SyntaxError
    python: SyntaxError
    kind: keyword
    definition: >
      Syntax is the grammar of a language: which words and marks may go
      where. A SyntaxError means the code is not valid Python, so none of
      the cell runs.
    example: 'print("Your score:", score'
  - term: indent, IndentationError
    python: IndentationError
    kind: keyword
    definition: >
      To indent a line is to push it in from the left, to show it belongs
      to the line above, such as the steps of a function. An
      IndentationError means the spaces at the start of a line are not
      what Python expected.
  - term: "str()"
    python: str
    kind: function
    definition: Turns a value, such as a number, into a string.
    example: 'str(28.2) gives "28.2"'
  - term: compiler
    kind: concept
    definition: >
      A compiler is a tool that translates a whole program into
      instructions for the machine before it runs. It reports grammar
      mistakes, the way Python reports a SyntaxError.
  - term: linker
    kind: concept
    definition: >
      A linker is a tool that joins a compiled program to the other code it
      uses. It reports a name that nothing defines, the way Python reports
      a NameError.
