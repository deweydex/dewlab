# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# Deliberately short — this tutorial's own point is that it introduces no
# new set operations, only a picture of ones already covered in
# sets-as-sorted-lists.glossary.yaml and logic-and-truth.glossary.yaml.
entries:
  - term: Venn diagram
    kind: concept
    definition: >
      Overlapping circles, one per set, where each region shows what belongs
      to exactly that combination of sets. Draw it from the actual set
      operations rather than placing the regions by hand. It is most useful
      at three sets, where the expressions stop fitting in your head. It
      stops working at four: no arrangement of four circles produces all
      fifteen regions.
  - term: "2^n - 1 regions"
    kind: formula
    definition: How many distinct regions n overlapping sets divide a picture into.
