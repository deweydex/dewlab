# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: bottom number, denominator
    kind: concept
    definition: >
      The bottom number of a fraction is called the denominator. It says
      how many equal slices the whole was cut into. In 3/8, the
      denominator is 8.
  - term: top number, numerator
    kind: concept
    definition: >
      The top number of a fraction is called the numerator. It says how
      many of the slices we have. In 3/8, the numerator is 3.
  - term: common denominator
    kind: concept
    definition: >
      A common denominator is a bottom number that two fractions share.
      Common here means shared by both. For 1/2 + 1/3, 6 is a common
      denominator: 3/6 + 2/6 = 5/6.
