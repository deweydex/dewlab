# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# First tutorial of the Computer graphics series, after the whole of
# Matrices. Checked against that series' cumulative glossary -- no
# overlap. The camera, the orbit and the animation terms moved with
# their sections to a-ball-in-orbit when this page was split.
entries:
  - term: perspective divide
    kind: formula
    definition: >
      A point's position on the screen is its x and its y each divided
      by its depth. Written x' = x / z and y' = y / z. This one division
      is what makes far things small.
  - term: projection
    kind: concept
    definition: >
      Projecting a point turns a point that has a depth into a point on
      a flat screen. The perspective divide is the projection a camera
      does.
  - term: depth
    kind: concept
    definition: >
      A point's depth is how far it is in front of the camera, along z.
      A point behind the camera has a negative depth and cannot be drawn.
  - term: similar triangles
    kind: concept
    definition: >
      Two triangles are similar when one is a scaled copy of the other.
      Their matching sides are then in the same ratio, which is where the
      perspective divide comes from.
