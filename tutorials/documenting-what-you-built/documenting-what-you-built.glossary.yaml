#
# Eighth tutorial of several-pages, the last before
# conclusions-and-next-steps (already glossaried). Checked against the
# cumulative glossary so far -- no overlap.
entries:
  - term: readme.md
    kind: concept
    definition: >
      A `readme.md` documents a finished site: what it covers, how its
      pages connect, the choices made and why, and how it was tested.
      It is written after building, unlike a planning document.
  - term: maintenance.md
    kind: concept
    definition: >
      A `maintenance.md` is a short plan for keeping a site current
      after it is submitted: how a page would be added later, what
      would be checked periodically, and what would come next.
  - term: README
    kind: concept
    definition: >
      A README is a document that explains a project to someone opening
      it for the first time. GitHub shows a repository's `README.md` on
      its front page.
  - term: maintenance plan
    kind: concept
    definition: >
      A maintenance plan says how a site would be kept current: how a
      page would be added later, what would be checked every so often,
      and what would be built next.
