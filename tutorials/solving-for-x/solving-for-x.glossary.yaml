# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: linear equation
    kind: concept
    definition: >
      A linear equation is an equation where the unknown is only multiplied
      by a number and added to. It can always be tidied into the shape
      ax + b = 0. When a is not 0, it has exactly one answer.
  - term: "x = −b/a"
    kind: formula
    definition: >
      This formula gives the answer to ax + b = 0. To find it, subtract b
      from both sides, then divide both sides by a. It needs a to be
      something other than 0.
    example: "0.8g - 7 = 0 gives g = 7 / 0.8 = 8.75"
  - term: quadratic equation
    kind: concept
    definition: >
      A quadratic equation has the shape ax² + bx + c = 0, where a is not 0.
      It can have two real roots, one, or none.
  - term: factorising
    kind: concept
    definition: >
      Factorising is writing an expression as brackets multiplied together.
      It is expanding brackets, run backwards.
    example: "x² + 3x − 40 = (x − 5)(x + 8)"
  - term: factorising by inspection
    kind: concept
    definition: >
      Factorising by inspection is finding the brackets by looking and
      thinking. For x² + bx + c, look for two numbers that add to b and
      multiply to c.
    example: "x² + 7x + 12 = (x + 3)(x + 4), because 3 + 4 = 7 and 3 × 4 = 12"
  - term: "if two numbers multiply to 0"
    kind: concept
    definition: >
      If two numbers multiply to make 0, then one of them is 0. So once a
      quadratic is written as (x − p)(x − q) = 0, its roots are p and q.
  - term: quadratic formula
    kind: formula
    definition: >
      The quadratic formula gives the roots of ax² + bx + c = 0:
      x = (−b ± √(b² − 4ac)) / 2a. The ± means plus for one root and minus
      for the other.
  - term: discriminant
    kind: formula
    definition: >
      The discriminant of ax² + bx + c is b² − 4ac, the part under the
      square root in the quadratic formula. More than 0 gives two real
      roots, 0 gives one, and less than 0 gives none.
  - term: "solve_linear(a, b)"
    kind: function
    definition: >
      Gives back the x where a*x + b = 0. When a is 0 there is no single
      answer, so it gives back None. It is your own toolkit tool.
    example: "solve_linear(0.8, -7)   # 8.75"
  - term: "solve_quadratic(a, b, c)"
    kind: function
    definition: >
      Gives back a list of the real roots of a*x**2 + b*x + c = 0, smallest
      first. The list holds two roots, one, or none. It is your own toolkit
      tool.
    example: "solve_quadratic(1, 3, -40)   # [-8.0, 5.0]"
