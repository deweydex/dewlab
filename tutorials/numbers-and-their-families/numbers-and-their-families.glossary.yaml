# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# N/Z/Q/R themselves are not repeated here — already introduced in
# making-decisions.glossary.yaml, earlier in this series (that tutorial's
# own reference to "the number domains from our last tutorial" does not
# actually match this series' order.yaml sequence; see
# tutorials/mit-pdp-maths-prog-integration/making-decisions.md and the
# spawned follow-up task about it). What follows is what this tutorial adds
# beyond the names themselves.
entries:
  - term: closed (under an operation)
    kind: concept
    definition: >
      A number family is closed under an operation when using that
      operation on two of its numbers always gives an answer in the same
      family. N is closed under addition but not subtraction, since 3 - 5
      is not a natural number. Q is closed under all four operations,
      apart from dividing by zero.
  - term: irrational number
    kind: concept
    definition: >
      An irrational number is a real number that cannot be written as a
      fraction of two integers. Examples are sqrt(2) and pi. The
      irrationals fill the gaps between the rational numbers.
  - term: exponent, base
    kind: concept
    definition: >
      In a power a^n, the base is a and the exponent is n. The exponent
      says how many copies of the base are multiplied together, so 2^3 =
      2 * 2 * 2 = 8.
    example: "2 ** 3  # base 2, exponent 3, gives 8"
  - term: reciprocal
    kind: concept
    definition: >
      The reciprocal of a number is one divided by that number. The
      reciprocal of 4 is 1/4. A negative exponent means the reciprocal:
      a^-n = 1/a^n.
  - term: laws of indices (powers)
    kind: formula
    definition: >
      a^m * a^n = a^(m+n); a^m / a^n = a^(m-n); (a^m)^n = a^(m*n); a^0 = 1
      (a not 0); a^-n = 1/a^n; a^(1/n) is the nth root of a. Exam papers
      and the syllabus call these the laws of indices. This course says
      "power" and "exponent", because "index" already means a position in
      a list.
    example: "8 ** (1 / 3)  # 2.0, the cube root of 8"
  - term: fractional power
    kind: concept
    definition: >
      An exponent of 1/n means the nth root, so 8^(1/3) = 2. An exponent
      of m/n means the nth root, raised to the power m, so 8^(2/3) = 4.
  - term: logarithm
    kind: formula
    definition: >
      A logarithm is a power read backwards: log_a(x) = n means a^n = x.
      It answers "what power of a gives x?". Binary search's O(log n)
      counts how many times you can halve n before you reach 1.
    example: "log2(1024) = 10, since 2**10 = 1024"
  - term: rules for logarithms
    kind: formula
    definition: >
      log(ab) = log a + log b, and log(x^n) = n log x, in any base, as long
      as every logarithm uses the same base. The second rule brings an
      unknown down from an exponent: 2^n = 1000 gives n = log 1000 / log 2.
  - term: "math.log2(), math.log10()"
    python: [math.log2, math.log10]
    kind: function
    definition: Gives the base-2 and the base-10 logarithm of a number.
    example: "math.log2(1024)  # 10.0"
  - term: geometry formulas
    kind: formula
    definition: >
      Rectangle: area = l*w, perimeter = 2*(l+w). Triangle: area = b*h/2.
      Circle: area = pi*r^2, circumference = 2*pi*r. Cylinder: volume =
      pi*r^2*h, surface area = 2*pi*r^2 + 2*pi*r*h. Cone: volume =
      pi*r^2*h/3. Sphere: volume = (4/3)*pi*r^3, surface area = 4*pi*r^2.
  - term: scaling areas and volumes
    kind: concept
    definition: >
      When every length is multiplied by k, every area is multiplied by
      k^2 and every volume by k^3. Doubling a radius makes a circle four
      times as big, and a sphere eight times as big.
