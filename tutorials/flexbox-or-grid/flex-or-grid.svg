<svg baseProfile="full" fill="currentColor" font-family="'Helvetica Neue', Inter, system-ui, sans-serif" height="184px" version="1.1" viewBox="0 0 568 184" width="568px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><g><text font-family="'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="10.5px" x="16" y="24">display: flex; flex-wrap: wrap</text><rect fill="var(--dl-cell-bg)" height="34" rx="4" stroke="currentColor" stroke-width="1" width="74.66666666666667" x="16.0" y="38" /><text font-size="12px" text-anchor="middle" x="53.333333333333336" y="59.0">1</text><rect fill="var(--dl-cell-bg)" height="34" rx="4" stroke="currentColor" stroke-width="1" width="74.66666666666667" x="98.66666666666667" y="38" /><text font-size="12px" text-anchor="middle" x="136.0" y="59.0">2</text><rect fill="var(--dl-cell-bg)" height="34" rx="4" stroke="currentColor" stroke-width="1" width="74.66666666666667" x="181.33333333333334" y="38" /><text font-size="12px" text-anchor="middle" x="218.66666666666669" y="59.0">3</text><rect fill="var(--dl-cell-bg)" height="34" rx="4" stroke="currentColor" stroke-width="1" width="116.0" x="16.0" y="80" /><text font-size="12px" text-anchor="middle" x="74.0" y="101.0">4</text><rect fill="var(--dl-cell-bg)" height="34" rx="4" stroke="currentColor" stroke-width="1" width="116.0" x="140.0" y="80" /><text font-size="12px" text-anchor="middle" x="198.0" y="101.0">5</text><text font-family="'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="10.5px" x="312" y="24">display: grid; 3 columns</text><rect fill="var(--dl-cell-bg)" height="34" rx="4" stroke="currentColor" stroke-width="1" width="74.66666666666667" x="312.0" y="38" /><text font-size="12px" text-anchor="middle" x="349.3333333333333" y="59.0">1</text><rect fill="var(--dl-cell-bg)" height="34" rx="4" stroke="currentColor" stroke-width="1" width="74.66666666666667" x="394.6666666666667" y="38" /><text font-size="12px" text-anchor="middle" x="432.0" y="59.0">2</text><rect fill="var(--dl-cell-bg)" height="34" rx="4" stroke="currentColor" stroke-width="1" width="74.66666666666667" x="477.33333333333337" y="38" /><text font-size="12px" text-anchor="middle" x="514.6666666666667" y="59.0">3</text><rect fill="var(--dl-cell-bg)" height="34" rx="4" stroke="currentColor" stroke-width="1" width="74.66666666666667" x="312.0" y="80" /><text font-size="12px" text-anchor="middle" x="349.3333333333333" y="101.0">4</text><rect fill="var(--dl-cell-bg)" height="34" rx="4" stroke="currentColor" stroke-width="1" width="74.66666666666667" x="394.6666666666667" y="80" /><text font-size="12px" text-anchor="middle" x="432.0" y="101.0">5</text><rect fill="none" height="34" rx="4" stroke="var(--dl-muted)" stroke-dasharray="4 3" stroke-width="1" width="74.66666666666667" x="477.33333333333337" y="80" /><text fill="currentColor" font-family="'Helvetica Neue', Inter, system-ui, sans-serif" font-size="12px" text-anchor="middle" x="136.0" y="142">Flexbox</text><text fill="var(--dl-muted)" font-family="'Helvetica Neue', Inter, system-ui, sans-serif" font-size="10.5px" text-anchor="middle" x="136.0" y="158">each row shares out its own space</text><text fill="currentColor" font-family="'Helvetica Neue', Inter, system-ui, sans-serif" font-size="12px" text-anchor="middle" x="432.0" y="142">Grid</text><text fill="var(--dl-muted)" font-family="'Helvetica Neue', Inter, system-ui, sans-serif" font-size="10.5px" text-anchor="middle" x="432.0" y="158">the columns line up in every row</text></g></svg>