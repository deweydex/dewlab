# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: hop
    kind: concept
    definition: >
      A hop is a move along a line that multiplies by a number. Two hops of
      ×3 go from 1 to 3, and then to 9. Hops multiply. They do not add.
  - term: "halfway(♡), ♡^(1/2)"
    kind: concept
    definition: >
      halfway(♡) is the number that, multiplied by itself, gives ♡. It is
      the same number as side(♡): halfway(9) = 3. The usual way to write it
      is ♡^(1/2), and in the same way 8^(1/3) is edge(8).
    example: "print(9 ** 0.5)   # halfway(9): 3.0"
