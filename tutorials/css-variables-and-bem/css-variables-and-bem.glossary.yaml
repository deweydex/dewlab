# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# Twenty-first tutorial of first-site. This page is about BEM now. It
# used to define "CSS custom property" as an entry of its own, but that
# is the same idea as "CSS variable" from variables-and-colour, whose
# entry already gives the other name, so the entry is gone and the page
# points back there. "scoped override" stays: it is new here, and it is
# how the page's modifier changes the button's colour. Its own
# "element" is BEM's element, a named part of a block, joined with
# `__`; a different thing from the HTML element glossaried in
# a-page-is-files, so its term is written "element (BEM)" to keep the
# two apart in the reference.
entries:
  - term: scoped override
    kind: concept
    definition: >
      A scoped override sets a CSS variable again on a more specific
      rule. It changes the variable's value for that element and the
      elements inside it only.
  - term: BEM
    kind: concept
    definition: >
      BEM, short for Block, Element, Modifier, is a class-naming
      pattern where a class name says on its own which block it
      belongs to and which variant it is.
  - term: block
    kind: concept
    definition: "In BEM, a block is a self-contained piece of a page, styled on its own."
  - term: "element (BEM)"
    kind: concept
    definition: >
      In BEM, an element is a named part of a block, joined to the
      block's name with two underscores, such as `button__icon`.
  - term: modifier
    kind: concept
    definition: >
      In BEM, a modifier is joined to a block's name with two hyphens.
      It changes how the block looks without replacing its base rule,
      and is always added beside the block's own class, never used
      alone.
