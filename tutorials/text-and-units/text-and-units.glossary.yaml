#
# Eleventh tutorial of first-site. Checked against the cumulative
# glossary so far -- no overlap.
entries:
  - term: px
    kind: keyword
    definition: >
      `px` (pixel) is a fixed unit. `16px` is always 16 pixels, whatever
      else on the page changes.
  - term: rem
    kind: keyword
    definition: >
      `rem` is a unit measured against the root font size, the one set
      on `<html>`. It grows automatically if a reader has made their
      own browser's font size larger.
  - term: root font size
    kind: concept
    definition: >
      The root font size is the font size set on `<html>`. Browsers set
      it to `16px` by default, so `1rem` normally equals `16px`.
  - term: text-align
    kind: keyword
    definition: >
      The `text-align` property sets where lines of text sit within
      their element: `left`, `right`, `center` or `justify`.
