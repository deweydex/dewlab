entries:
  - term: periodic, period
    kind: concept
    definition: >
      A curve is periodic if it repeats exactly, forever. The period is the
      length of one repeat. For sine and cosine drawn from the unit circle,
      one repeat is a full turn, 2*pi radians. After a full turn you are
      back at the same point on the circle.
  - term: "wave formula: amplitude, period, phase, lift"
    kind: formula
    definition: >
      y = amplitude * sin((x - phase) / period * 2*pi) + lift. Four numbers,
      four separate effects. Amplitude is how far the wave swings from the
      middle, not top to bottom. Period is how long one repeat takes. Phase
      slides it sideways, and lift slides it up or down. All four can be
      read straight off real periodic data by eye.
