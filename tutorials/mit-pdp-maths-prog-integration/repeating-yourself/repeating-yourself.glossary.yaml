# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: while loop
    kind: keyword
    definition: >
      Repeats its body as long as a condition stays True. Needs an
      initial state, a condition checked before each pass, and an update
      inside the body that eventually makes the condition False — miss
      that last part and it never stops.
  - term: for loop
    kind: keyword
    definition: Repeats its body once per item in a sequence — cleaner than a while loop when you know in advance how many times to repeat.
  - term: "range()"
    kind: function
    definition: >
      Generates a sequence of numbers. range(5) gives 0-4; range(start,
      stop) excludes stop; range(start, stop, step) can count by any step,
      including backwards with a negative one.
    example: "range(1, 6)   # 1, 2, 3, 4, 5"
  - term: accumulator pattern
    kind: concept
    definition: >
      Start with a running total (0 for a sum, 1 for a product) and add
      or multiply into it on every pass of a loop.
  - term: sigma notation
    kind: formula
    definition: "Σ means \"add up the expression for each value of the index, over the given range.\" Exactly what a loop with a sum accumulator does."
    example: "sum(i for i in range(1, 6))  # Σ, i=1 to 5, of i"
  - term: "product notation (Π) and factorial"
    kind: formula
    definition: >
      Capital pi means "multiply every value over the given range," the
      same way sigma means "add." The product from 1 to n is exactly the
      factorial function, n!.
    example: "5! = 1 * 2 * 3 * 4 * 5 = 120"
  - term: nested loops
    kind: concept
    definition: A loop inside another loop — the inner one runs all its iterations for every single iteration of the outer one.
  - term: iteration
    kind: concept
    definition: >
      Repetition — the third of programming's three fundamental control
      structures, alongside sequential execution and selection.
