# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# sine, cosine, tangent are not repeated here — already introduced in
# the-unit-circle.glossary.yaml, earlier in this series.
entries:
  - term: "triangle area: (1/2) * a * b * sin(C)"
    kind: formula
    definition: >
      The area of a triangle from two sides and the angle between them,
      rather than from a base and a height. That is useful because the
      height often is not known directly. When C is 90 degrees, sin(90) = 1,
      and this reduces to the familiar (1/2) * base * height.
    example: "area = 0.5 * a * b * math.sin(C)"
  - term: "Cosine Rule: c^2 = a^2 + b^2 - 2ab*cos(C)"
    kind: formula
    definition: >
      Finds a missing side or angle in any triangle, not just right-angled
      ones. It is the Pythagorean theorem with a correction term for angles
      that are not 90 degrees. When C is 90 degrees, cos(90) = 0, so the
      -2ab*cos(C) term disappears and Pythagoras is left exactly.
  - term: "Sine Rule: a / sin(A) = b / sin(B) = c / sin(C)"
    kind: formula
    definition: >
      In any triangle, each side divided by the sine of its opposite angle
      gives the same constant. Used to find a missing side or angle when
      the Cosine Rule is not the natural fit.
  - term: ambiguous case
    kind: concept
    definition: >
      Given two sides and an angle that is not between them, the Sine Rule
      can produce two different valid triangles. That happens because an
      angle and its supplement have the same sine. Check and report both,
      rather than taking the single answer a calculator's inverse sine
      returns.
