# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# plt.hist() is not repeated here — already introduced in
# making-sense-of-data.glossary.yaml, earlier in this series.
entries:
  - term: "histogram, bar chart, line chart, scatter plot, pie chart"
    kind: concept
    definition: >
      Five chart types for five jobs. A histogram shows how one set of
      numbers is spread out. A bar chart compares amounts across categories.
      A line chart shows a trend over an ordered sequence. A scatter plot
      shows how two sets of numbers relate. A pie chart shows parts of a
      whole, and is best used sparingly, because a bar chart is usually
      clearer.
  - term: "plt.bar()"
    kind: function
    definition: Draws a bar chart from category labels and their values.
    example: 'plt.bar(languages, counts)'
  - term: "plt.plot()"
    kind: function
    definition: Draws a line chart connecting a sequence of points.
    example: "plt.plot(hours, temperatures, marker='o')"
  - term: "plt.scatter()"
    kind: function
    definition: Draws a scatter plot, one point per (x, y) pair.
    example: "plt.scatter(study_hours, test_scores)"
  - term: Anscombe's Quartet
    kind: concept
    definition: >
      Four datasets with nearly identical statistics, sharing a mean, a
      standard deviation and a correlation, that look completely different
      when plotted. It is the classic argument for why data has to be drawn,
      not only summarised.
  - term: chart junk
    kind: concept
    definition: Decorative elements on a chart that do not convey information — worth avoiding, since simplicity aids understanding.
