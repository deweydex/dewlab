entries:
  - term: encapsulation
    kind: concept
    definition: >
      Encapsulation is keeping an object's data behind its own methods.
      Every change to the data passes through code that can check a rule.

  - term: convention
    kind: concept
    definition: >
      A convention is a habit that programmers agree to follow. Python
      does not force it.
    example: "self._depth"

  - term: private
    kind: concept
    definition: >
      A private field is one that only the class's own methods should read
      or change. In Python, its name starts with an underscore.
    example: "self._depth = 0"

  - term: getter
    kind: concept
    definition: >
      A getter is a method that returns the value of a private field, so
      other code can read it without reaching in.
    example: "def get_depth(self):"

  - term: caller
    kind: concept
    definition: >
      A caller is any code that uses an object's methods.
    example: "nautilus.dive(250)"

  - term: abstraction
    kind: concept
    definition: >
      Abstraction is what a class shows the rest of a program: what each
      method does, not how it does it inside. A caller needs only that.
