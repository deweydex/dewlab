# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: search problem
    kind: concept
    definition: The search problem is the task of finding one item in a collection, such as one value in a list.
  - term: linear search
    kind: concept
    definition: Linear search is a way of searching that checks each element in turn, from the start, until it finds the target or reaches the end of the list. It works on data in any order.
  - term: "O(n)"
    kind: concept
    definition: >
      O(n), said "order n", means the time an algorithm takes grows in
      proportion to the size of its input. Linear search is O(n): twice
      as many items means up to twice as many comparisons.
  - term: sorted
    kind: concept
    definition: Sorted data is data that is in order, from smallest to largest.
  - term: binary search
    kind: concept
    definition: >
      Binary search is a way of searching a sorted list. It checks the
      middle item, then throws away the half that cannot hold the target,
      and repeats. It works only on sorted data, but it is much faster
      than linear search.
  - term: "O(log n)"
    kind: concept
    definition: >
      O(log n) means the time an algorithm takes grows with the number of
      times you can halve the input size before you reach 1. Binary
      search is O(log n): a million items take about 20 comparisons, not
      a million.
  - term: divide and conquer
    kind: concept
    definition: Divide and conquer is a way to solve a problem by splitting it into smaller pieces, solving the pieces, and combining the answers. Binary search is the first example of it here.
