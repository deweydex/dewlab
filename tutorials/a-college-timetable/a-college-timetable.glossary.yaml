# glossaried on the earlier pages that used them as example data. The one
# genuinely new technical term is self-join.
entries:
  - term: self-join
    kind: concept
    definition: >
      A self-join joins a table to itself, giving each side of the
      comparison its own name. It lets a query compare one row against
      another row from the very same table, such as two sessions that
      might overlap.
