# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# slope, m, c are not repeated here — already introduced in
# drawing-functions.glossary.yaml, earlier in this series.
entries:
  - term: parallel, perpendicular
    kind: concept
    definition: >
      Two lines are parallel when they go in the same direction and never
      meet: two different lines with the same slope are parallel. Two lines
      are perpendicular when they meet at a right angle. If both have a
      slope, their slopes multiply to -1.
  - term: "general form of a line: ax + by + c = 0"
    kind: formula
    definition: >
      The general form is a third way to write a line, alongside y = mx + c
      and a Python function. It is the only one of the three that can
      describe a vertical line, because b = 0 is allowed.
  - term: midpoint
    kind: formula
    definition: >
      The midpoint of two points is the point halfway between them. Average
      the x values, and average the y values.
    example: "midpoint((1, 2), (7, 6)) = ((1+7)/2, (2+6)/2) = (4, 4)"
  - term: "Pythagorean theorem, distance formula"
    kind: formula
    definition: >
      The Pythagorean theorem says that in a right-angled triangle, the two
      short sides squared and added give the long side squared. The distance
      formula is the same fact, with the gap across and the gap up as the
      two short sides.
    example: "distance = sqrt((x2-x1)**2 + (y2-y1)**2)"
  - term: isosceles triangle
    kind: concept
    definition: >
      An isosceles triangle is a triangle with two sides of the same
      length.
