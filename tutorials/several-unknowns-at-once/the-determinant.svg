nt-size="11.5px" font-style="italic" text-anchor="middle" x="312.0" y="205">b₂</text><text fill="currentColor" font-size="15px" font-style="italic" text-anchor="middle" x="228.0" y="36">a</text><text fill="currentColor" font-size="15px" font-style="italic" text-anchor="middle" x="312.0" y="36">c</text><line stroke="currentColor" stroke-linecap="round" stroke-width="1.8" x1="245.0" x2="295.0" y1="105.0" y2="155.0" /><polygon fill="currentColor" points="295.0,155.0 286.59,151.78 291.78,146.59" stroke="none" /><line stroke="currentColor" stroke-dasharray="5,3" stroke-linecap="round" stroke-width="1.4" x1="245.0" x2="295.0" y1="155.0" y2="105.0" /><polygon fill="currentColor" points="295.0,105.0 292.14,112.47 287.53,107.86" stroke="none" /><text fill="currentColor" font-size="14px" text-anchor="start" x="384" y="76">one diagonal: 1 × 5 = 5</text><text fill="currentColor" font-size="14px" text-anchor="start" x="384" y="102">the other, dashed: 12 × 1 = 12</text><text fill="currentColor" font-size="14px" font-weight="bold" text-anchor="start" x="384" y="142">determinant: 5 − 12 = −7</text><text fill="var(--dl-muted)" font-size="11.5px" text-anchor="start" x="384" y="170">Not 0, so there is one answer:</text><text fill="var(--dl-muted)" font-size="11.5px" text-anchor="start" x="384" y="188">a = 130 and c = 100.</text></svg>