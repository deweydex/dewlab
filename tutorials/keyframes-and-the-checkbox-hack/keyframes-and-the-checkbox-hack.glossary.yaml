#
# Twenty-third tutorial of first-site. The checkbox hack that used to
# share this page is now its own tutorial, the-checkbox-hack, and its
# entries moved with it. Checked against the cumulative glossary so far
# -- no overlap. `opacity` is defined in a sentence in the prose, but it
# is a supporting detail of the pulse, not what the page introduces, so
# it is left out the way it was before the split.
entries:
  - term: "@keyframes"
    kind: keyword
    definition: >
      `@keyframes` names the stages of an animation as percentages of
      the way through. The browser fills in every frame between one
      stage and the next on its own.
  - term: animation
    kind: keyword
    definition: >
      The `animation` property combines a `@keyframes` name with its
      duration, speed curve and repeat count in one line.
