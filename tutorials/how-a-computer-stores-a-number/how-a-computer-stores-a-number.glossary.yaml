# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# A context page: optional background reading for numbers-a-computer-can-hold,
# everything-is-ones-and-zeros, running-a-formula-backwards and does-it-work,
# declared with `context_for:`. Checked against the union of those pages'
# glossaries and every earlier Plot Twist glossary. `float`, `int`,
# `binary fraction`, `tolerance`, `1e-9` and `close_enough` are used here
# but defined earlier, so they stay there.
entries:
  - term: rounding error
    kind: concept
    definition: >
      A rounding error is the difference between a number and the nearest
      value a space can hold. With four decimal digits, a third is kept as
      0.3333, and three of them add up to 0.9999.
  - term: "scientific notation, e notation"
    kind: concept
    definition: >
      Scientific notation writes a very large or very small number as a
      short number times a power of 10. Python writes the power after an
      e, so 1.1e-16 means 1.1 × 10⁻¹⁶.
    example: "1.1e-16 is 0.00000000000000011"
  - term: irrational number
    kind: concept
    definition: >
      An irrational number is a real number that cannot be written as one
      whole number divided by another. Its digits never end and never
      repeat, in any base. √2 and π are irrational, so no float holds
      them exactly.
  - term: overflow
    kind: concept
    definition: >
      Overflow is going past the largest value a space can hold. Python's
      ints never overflow. Its floats stop a little under 1.8 × 10³⁰⁸.
  - term: inf
    kind: concept
    definition: >
      inf is the float Python gives when an answer is too big for a float.
      It means "bigger than any float".
    example: "1e308 * 10 gives inf"
  - term: ".as_integer_ratio()"
    python: float.as_integer_ratio
    kind: function
    definition: >
      Gives the exact fraction a float holds, as a top number and a bottom
      number. For a float, the bottom number is always a power of 2.
    example: "(0.75).as_integer_ratio() gives (3, 4)"
