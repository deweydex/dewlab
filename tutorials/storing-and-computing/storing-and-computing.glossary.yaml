# Hand-written — see first-steps.glossary.yaml for why these two exist and
# what they are proving out before the skill runs unattended.
#
# Nothing from first-steps.glossary.yaml is repeated here even where this
# tutorial uses it again (+, -, print(), …) — reusing an earlier tutorial's
# vocabulary is not introducing it a second time. "types matter" (the
# reflection's own emphasis) is left out too: stress emphasis on a phrase,
# not a term someone would look up.
entries:
  - term: variable
    kind: concept
    definition: >
      A variable is a name that refers to a value. You make one with =, and
      Python works out what kind of data it holds from the value you give
      it.
  - term: "="
    kind: operator
    definition: >
      Gives the name on the left to the value on the right. This is called
      assignment. It is different from "is equal to" in maths.
  - term: snake_case
    kind: concept
    definition: >
      Snake case is the way Python programmers write variable names:
      lowercase words joined by underscores, like temperature_in_celsius.
  - term: data type
    kind: concept
    definition: >
      A data type, or type, is the kind of data a value is. Python's four
      main types are int, float, str and bool.
  - term: int
    kind: concept
    definition: >
      int is Python's type for whole numbers, such as 42, -7 and 0. The
      function int(x) changes x into a whole number.
  - term: float
    kind: concept
    definition: >
      float is Python's type for numbers with a decimal point, such as 3.14
      and 2.0. A float cannot store every real number exactly. The function
      float(x) changes x into a float.
  - term: str
    kind: concept
    definition: >
      str is Python's type for text, written between quotes, such as
      "hello". The function str(x) changes x into text.
  - term: bool
    kind: concept
    definition: >
      bool is Python's type for true and false. A bool is either True or
      False, and the type is named after George Boole. The function bool(x)
      changes x into a bool.
  - term: "type()"
    kind: function
    definition: Tells you which type a value is.
    example: "type(42)  # int"
  - term: concatenate
    kind: concept
    definition: >
      To concatenate is to join pieces of text end to end. For strings, +
      concatenates: "40" + "2" gives "402".
  - term: "input()"
    kind: function
    definition: >
      Asks the person using the program to type something, and gives back
      what they typed. The result is always a str, even when it looks like
      a number.
  - term: base 10
    kind: concept
    definition: >
      Base 10, or decimal, is the number system we use every day. It has
      ten digits, 0 to 9, and each position is worth a power of 10.
  - term: binary
    kind: concept
    definition: >
      Binary is base 2, the number system computers use. It has two digits,
      0 and 1, and each position is worth a power of 2. Python writes it
      with a 0b in front: 0b101010.
  - term: hexadecimal
    kind: concept
    definition: >
      Hexadecimal is base 16. It uses the digits 0 to 9 and the letters A
      to F. One hex digit matches exactly four binary digits. Python writes
      it with a 0x in front: 0x2A.
  - term: "bin()"
    kind: function
    definition: Changes a number into its binary form, as text.
    example: "bin(42)  # '0b101010'"
  - term: "hex()"
    kind: function
    definition: Changes a number into its hexadecimal form, as text.
    example: "hex(42)  # '0x2a'"
