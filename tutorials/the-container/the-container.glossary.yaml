# glossary so far -- no overlap.
entries:
  - term: max-width
    kind: keyword
    definition: >
      The `max-width` property caps how wide an element is allowed to
      grow, but lets it stay narrower when there is less room, unlike
      `width`, which sets one fixed size.
  - term: auto margin
    kind: concept
    definition: >
      An auto margin is a margin set to `auto`. On the left and right
      of a width-capped element, auto margins split the leftover space
      evenly, which centres it. `margin: 0 auto` is the usual way to
      write that.
  - term: container
    kind: concept
    definition: >
      A container is an element that holds most of a page's content,
      and sets how wide that content can grow and where it sits.
