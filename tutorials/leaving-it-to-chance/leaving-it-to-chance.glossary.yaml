entries:
  - term: "pseudo-random"
    kind: concept
    definition: >
      Produced by an ordinary calculation rather than by chance, but scrambled
      thoroughly enough that no statistical test tells the difference. Every
      number Python's random module gives you is pseudo-random.

  - term: "seed"
    kind: concept
    definition: >
      The starting point a pseudo-random sequence is calculated from. The same
      seed always produces the same sequence, which is what makes a run with
      randomness in it repeatable.

  - term: "random.seed()"
    kind: function
    definition: >
      Sets the starting point by hand, so the numbers that follow come out the
      same every time. Without it Python picks one from the clock.
    example: "random.seed(42)"

  - term: "random.random()"
    kind: function
    definition: >
      One number between 0 and 1, every value equally likely. The function
      underneath most of the others.
    example: "x = random.random()"

  - term: "random.randint()"
    kind: function
    definition: >
      A whole number between two bounds. Unlike range(), it includes both ends
      — randint(1, 6) can return 6.
    example: "die = random.randint(1, 6)"

  - term: "random.uniform()"
    kind: function
    definition: "A number with decimals, anywhere between two bounds."
    example: "score = random.uniform(0, 100)"

  - term: "random.choice()"
    kind: function
    definition: >
      Picks one item from a list, every item equally likely. For a thing
      rather than a number.
    example: 'today = random.choice(["sunny", "cloudy", "rain"])'

  - term: "random.sample()"
    kind: function
    definition: >
      Picks several items with no repeats, as dealing cards does — each one
      taken out before the next is drawn. The counterpart of random.choices(),
      which puts each back.
    example: "hand = random.sample(deck, k=5)"
