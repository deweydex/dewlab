<svg baseProfile="full" fill="currentColor" font-family="'Helvetica Neue', Inter, system-ui, sans-serif" height="312px" version="1.1" viewBox="0 0 400 312" width="400px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><g><text fill="var(--dl-muted)" font-family="'Helvetica Neue', Inter, system-ui, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="36" y="26">No transform</text><rect fill="var(--dl-cell-bg)" height="40" stroke="currentColor" stroke-width="1.4" width="96" x="36" y="40" /><text fill="currentColor" font-family="'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12px" font-weight="normal" text-anchor="middle" x="84.0" y="64.0">.move</text><rect fill="var(--dl-cell-bg)" height="40" stroke="currentColor" stroke-width="1.4" width="96" x="152" y="40" /><text fill="currentColor" font-family="'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12px" font-weight="normal" text-anchor="middle" x="200.0" y="64.0">.grow</text><rect fill="var(--dl-cell-bg)" height="40" stroke="currentColor" stroke-width="1.4" width="96" x="268" y="40" /><text fill="currentColor" font-family="'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12px" font-weight="normal" text-anchor="middle" x="316.0" y="64.0">.turn</text><text fill="var(--dl-muted)" font-family="'Helvetica Neue', Inter, system-ui, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="36" y="132">The middle box with transform: scale(2)</text><rect fill="var(--dl-cell-bg)" height="40" stroke="currentColor" stroke-width="1.4" width="96" x="36" y="176" /><text fill="currentColor" font-family="'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12px" font-weight="normal" text-anchor="middle" x="84.0" y="200.0">.move</text><rect fill="var(--dl-cell-bg)" height="40" stroke="currentColor" stroke-width="1.4" width="96" x="268" y="176" /><text fill="currentColor" font-family="'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12px" font-weight="normal" text-anchor="middle" x="316.0" y="200.0">.turn</text><rect fill="var(--dl-highlight-blue)" fill-opacity="0.8" height="80" stroke="currentColor" stroke-width="1.8" width="192" x="104.0" y="156.0" /><text fill="currentColor" font-family="'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12px" font-weight="bold" text-anchor="middle" x="200.0" y="172.0">.grow</text><rect fill="none" height="40" stroke="currentColor" stroke-dasharray="5 3" stroke-width="1.4" width="96" x="152" y="176" /><text fill="var(--dl-muted)" font-family="'Helvetica Neue', Inter, system-ui, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="200.0" y="266.0">Dashed: the middle box's own space, which the page keeps.</text><text fill="var(--dl-muted)" font-family="'Helvetica Neue', Inter, system-ui, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="200.0" y="282.0">The boxes on either side do not move.</text></g></svg>