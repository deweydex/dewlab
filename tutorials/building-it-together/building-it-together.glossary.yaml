#
# Comes after code-other-people-can-read, the last page of the Dewey
# Track. pseudocode was introduced on recipes-are-algorithms; structured
# walkthrough, test suite and step_through on does-it-work; code review,
# reviewer and refactoring on code-other-people-can-read, so none is
# repeated here. hits_player, random_throw, glyph_of and number_rows are
# starter code for the projects, not Python names and not toolkit
# functions, so they have no entry. random.uniform and the pandas calls
# in the planet starter are used once and not taught, so they are left
# out. The page no longer has a rubric: it ends with questions for
# looking back, so "rubric" has no entry.
entries:
  - term: design
    kind: concept
    definition: >
      A program's design is the four questions answered in writing before
      any code: what it keeps, what each function promises, what happens
      when, and what the program assumes.
  - term: interface
    kind: concept
    definition: >
      An interface is the set of promises one part of a program makes to
      the other parts: each function's name, its inputs and its result.
      A team agrees its interfaces before anyone writes a function body.
  - term: "release, version number"
    kind: concept
    definition: >
      A release is a version of a program that someone outside the team
      could use on the day it comes out. Each release has a version
      number, such as 0.1 or 1.0, and a date, and old ones are kept.
  - term: release notes
    kind: concept
    definition: >
      Release notes are a few lines that come with a release. They say
      what is new, what changed, and what is known not to work yet.
  - term: retrospective
    kind: concept
    definition: >
      A retrospective is a meeting after a piece of work, where the team
      looks back at how it worked together, to learn from it.
  - term: definition of done
    kind: concept
    definition: >
      A definition of done is a short list, agreed at the start, of what
      must be true before any piece of work counts as finished.
