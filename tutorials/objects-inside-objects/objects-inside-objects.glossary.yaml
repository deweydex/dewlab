# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# Composition page of the series (Programming with objects), straight
# after one-parent-many-children (inheritance). "is a" and "has a" are the
# page's topic, not emphasis for contrast. Since 2026.09.26 the examples
# follow the solar-system world the page teaches in. The italic titles in
# "Where to read more" are bibliography entries, not terms.
entries:
  - term: composition
    kind: concept
    definition: >
      Composition is a way to build one class from other objects, held in
      its fields. A star system has planets, so it keeps them in a list.
    example: "self._planets = []  # a StarSystem's field that holds planets"

  - term: is a
    kind: concept
    definition: >
      An "is a" relationship means one class is a special kind of another
      class. It calls for inheritance: a troll is a character.
    example: "class Troll(Character):"

  - term: has a
    kind: concept
    definition: >
      A "has a" relationship means one object holds other objects. It
      calls for composition: a star system has planets.
    example: "sol.add(Planet('Mars', 228.0, ['Phobos', 'Deimos']))"
