# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: transformation matrix
    kind: concept
    definition: >
      A matrix read as an instruction for moving every point in a picture
      somewhere else, rather than as a grid you add or multiply on its
      own. Multiplying it by a set of points moves those points.
  - term: reading a matrix's columns
    kind: concept
    definition: >
      For any 2×2 matrix, the first column is where (1,0) lands and the
      second column is where (0,1) lands under the transformation — enough
      on its own to work out what happens to every other point.
  - term: stretch, squash, rotate, shear, reflect
    kind: concept
    definition: >
      The five named effects a 2×2 matrix can have on a picture — worth
      recognising from a matrix's numbers before running it, and from the
      picture it produces after.
