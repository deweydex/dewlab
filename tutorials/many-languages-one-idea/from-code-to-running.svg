<svg baseProfile="full" fill="currentColor" font-family="'Helvetica Neue', Inter, system-ui, sans-serif" height="376px" version="1.1" viewBox="0 0 680 376" width="680px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><text fill="currentColor" font-size="13px" font-weight="bold" text-anchor="start" x="16" y="30">A compiler: the first BASIC, at Dartmouth</text><rect fill="var(--dl-highlight-bg)" height="48" rx="6" stroke="currentColor" stroke-width="1.3" width="96" x="16" y="40" /><text fill="currentColor" font-size="12.5px" text-anchor="middle" x="64.0" y="68.5">your code</text><line stroke="currentColor" stroke-linecap="round" stroke-width="1.4" x1="116" x2="138" y1="64.0" y2="64.0" /><polygon fill="currentColor" points="138,64.0 131.61,66.85 131.61,61.15" stroke="none" /><rect fill="var(--dl-cell-bg)" height="48" rx="6" stroke="currentColor" stroke-width="1.3" width="246.0" x="142" y="40" /><text fill="currentColor" font-size="12.5px" text-anchor="middle" x="265.0" y="68.5">compiler: translates it all first</text><line stroke="currentColor" stroke-linecap="round" stroke-width="1.4" x1="392.0" x2="414.0" y1="64.0" y2="64.0" /><polygon fill="currentColor" points="414.0,64.0 407.61,66.85 407.61,61.15" stroke="none" /><rect fill="var(--dl-cell-bg)" height="48" rx="6" stroke="currentColor" stroke-width="1.3" width="246.0" x="418.0" y="40" /><text fill="currentColor" font-size="12.5px" text-anchor="middle" x="541.0" y="68.5">machine instructions, then run</text><text fill="currentColor" font-size="13px" font-weight="bold" text-anchor="start" x="16" y="116">An interpreter: BASIC on a Spectrum or a Commodore 64</text><rect fill="var(--dl-highlight-bg)" height="48" rx="6" stroke="currentColor" stroke-width="1.3" width="96" x="16" y="126" /><text fill="currentColor" font-size="12.5px" text-anchor="middle" x="64.0" y="154.5">your code</text><line stroke="currentColor" stroke-linecap="round" stroke-width="1.4" x1="116" x2="138" y1="150.0" y2="150.0" /><polygon fill="currentColor" points="138,150.0 131.61,152.85 131.61,147.15" stroke="none" /><rect fill="var(--dl-cell-bg)" height="48" rx="6" stroke="currentColor" stroke-width="1.3" width="522.0" x="142" y="126" /><text fill="currentColor" font-size="12.5px" text-anchor="middle" x="403.0" y="154.5">interpreter: reads a line, does it, reads the next</text><text fill="currentColor" font-size="13px" font-weight="bold" text-anchor="start" x="16" y="202">Python</text><rect fill="var(--dl-highlight-bg)" height="48" rx="6" stroke="currentColor" stroke-width="1.3" width="96" x="16" y="212" /><text fill="currentColor" font-size="12.5px" text-anchor="middle" x="64.0" y="240.5">your cell</text><line stroke="currentColor" stroke-linecap="round" stroke-width="1.4" x1="116" x2="138" y1="236.0" y2="236.0" /><polygon fill="currentColor" points="138,236.0 131.61,238.85 131.61,233.15" stroke="none" /><rect fill="var(--dl-cell-bg)" height="48" rx="6" stroke="currentColor" stroke-width="1.3" width="246.0" x="142" y="212" /><text fill="currentColor" font-size="12.5px" text-anchor="middle" x="265.0" y="240.5">compiled to simpler instructions</text><line stroke="currentColor" stroke-linecap="round" stroke-width="1.4" x1="392.0" x2="414.0" y1="236.0" y2="236.0" /><polygon fill="currentColor" points="414.0,236.0 407.61,238.85 407.61,233.15" stroke="none" /><rect fill="var(--dl-cell-bg)" height="48" rx="6" stroke="currentColor" stroke-width="1.3" width="246.0" x="418.0" y="212" /><text fill="currentColor" font-size="12.5px" text-anchor="middle" x="541.0" y="240.5">interpreter: runs those</text><text fill="currentColor" font-size="13px" font-weight="bold" text-anchor="start" x="16" y="288">JavaScript in Chrome</text><rect fill="var(--dl-highlight-bg)" height="48" rx="6" stroke="currentColor" stroke-width="1.3" width="96" x="16" y="298" /><text fill="currentColor" font-size="12.5px" text-anchor="middle" x="64.0" y="326.5">your code</text><line stroke="currentColor" stroke-linecap="round" stroke-width="1.4" x1="116" x2="138" y1="322.0" y2="322.0" /><polygon fill="currentColor" points="138,322.0 131.61,324.85 131.61,319.15" stroke="none" /><rect fill="var(--dl-cell-bg)" height="48" rx="6" stroke="currentColor" stroke-width="1.3" width="246.0" x="142" y="298" /><text fill="currentColor" font-size="12.5px" text-anchor="middle" x="265.0" y="326.5">interpreter: starts running it</text><line stroke="currentColor" stroke-linecap="round" stroke-width="1.4" x1="392.0" x2="414.0" y1="322.0" y2="322.0" /><polygon fill="currentColor" points="414.0,322.0 407.61,324.85 407.61,319.15" stroke="none" /><rect fill="var(--dl-cell-bg)" height="48" rx="6" stroke="currentColor" stroke-width="1.3" width="246.0" x="418.0" y="298" /><text fill="currentColor" font-size="12.5px" text-anchor="middle" x="541.0" y="311.5">while it runs, the parts that run</text><text fill="currentColor" font-size="12.5px" text-anchor="middle" x="541.0" y="326.5">most often are compiled to</text><text fill="currentColor" font-size="12.5px" text-anchor="middle" x="541.0" y="341.5">machine instructions</text></svg>