# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: system of equations
    kind: concept
    definition: >
      A system of equations is a set of equations that must all be true at
      the same time, for the same unknowns.
  - term: coefficients
    kind: concept
    definition: >
      The coefficients of a system are the numbers in front of the
      unknowns. In 2x + 3y = 7, the coefficients are 2 and 3.
  - term: "Ax = b"
    kind: formula
    definition: >
      A system of linear equations, written as one matrix equation. A holds
      the coefficients, x the unknowns, and b the right-hand sides.
  - term: Gaussian elimination
    kind: concept
    definition: >
      Gaussian elimination is a method for solving a system of equations.
      It simplifies the system one row operation at a time, until the
      answer can be read straight off. It does not compute an inverse. It
      works for any number of unknowns, and computers use a form of it.
  - term: augmented matrix
    kind: concept
    definition: >
      An augmented matrix holds a system's coefficients, with the
      right-hand sides added as one more column.
  - term: row operations
    kind: concept
    definition: >
      A row operation is a change to a matrix that leaves the system's
      solution the same. There are three: swap two rows, multiply a row by
      a number that is not zero, and replace a row with itself plus a
      multiple of another row.
  - term: row echelon form
    kind: concept
    definition: >
      A matrix is in row echelon form when each row starts with more zeros
      than the row above it. The zeros make a staircase.
