# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# Front-end page of the series (Programming with objects), before the
# series-end making task since 2026.09.26. Checked every earlier glossary
# in the series as the cumulative list: no overlap. input() itself is
# reused from storing-and-computing, without a repeat entry. widget,
# text_input() and dropdown() are new here: the page builds its second
# front end from them.
entries:
  - term: front end
    kind: concept
    definition: >
      A front end is the part of a program that lets somebody use it
      without reading or writing its code. A text menu is the simplest
      kind; a menu on a page is another.

  - term: input validation
    kind: concept
    definition: >
      Input validation is checking that what a person typed makes sense,
      before the program uses it. A front end that answers "fly" with "Not
      a command" is doing input validation.
    example: "if not text.isdigit(): return None"

  - term: widget
    kind: concept
    definition: >
      A widget is one of the pieces a page is built from, such as a box to
      type in or a menu to choose from.

  - term: "text_input()"
    kind: function
    definition: >
      Makes a box to type in, on this site's pages. What is in the box is
      read with .value.
    example: "command = text_input(\"What now?\", \"look\")"

  - term: "dropdown()"
    kind: function
    definition: >
      Makes a menu, on this site's pages. The option chosen is read with
      .value, and the page remembers the choice between runs.
    example: "command = dropdown(\"What now?\", [\"look\", \"attack\"])"
