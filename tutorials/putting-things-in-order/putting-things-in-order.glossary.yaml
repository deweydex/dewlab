# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# Shell sort and recursion, from this tutorial's own "Optional Challenges"
# section, are left out on purpose — enrichment a student may or may not
# have done, not core material every reader has met.
entries:
  - term: swap
    kind: concept
    definition: >
      To swap two elements is to exchange their positions. Python does it
      in one line, with no temporary variable, because it works out the
      whole right-hand side before it assigns anything.
    example: "a, b = b, a"
  - term: bubble sort
    kind: concept
    definition: >
      Bubble sort is a sorting algorithm that walks through the list,
      comparing each pair of neighbours and swapping any pair in the
      wrong order. One pass moves the largest remaining element to its
      final place. It repeats until the list is sorted.
  - term: "sorted(), key="
    python: sorted
    kind: function
    definition: >
      Gives back a new list, sorted from smallest to largest. With key=, it
      sorts by what that function gives back for each element, and
      reverse=True puts the largest first.
    example: "sorted(words, key=len)"
  - term: ".sort()"
    python: list.sort
    kind: function
    definition: >
      Sorts a list in place, changing that list, and gives back None.
      sorted() leaves the old list alone and gives back a new one.
    example: "numbers.sort()"
  - term: insertion sort
    kind: concept
    definition: >
      Insertion sort is a sorting algorithm that keeps a sorted part at
      the start of the list, and puts each new element into its right
      place in that part. It is the way most people sort a hand of
      playing cards.
  - term: selection sort
    kind: concept
    definition: >
      Selection sort is a sorting algorithm that finds the smallest
      element in the part not yet sorted, and swaps it into place at the
      front of that part. It repeats for what is left.
  - term: "O(n^2)"
    kind: concept
    definition: >
      O(n²) means the work grows with the square of the list's size.
      Bubble, insertion and selection sort all make about n(n-1)/2
      comparisons in the worst case, so they are O(n²). Faster sorts,
      such as merge sort, are O(n log n).
