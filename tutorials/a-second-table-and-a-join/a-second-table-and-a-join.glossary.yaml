# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# Fourth and last tutorial of "A table of your own" (series:
# first-database). Checked against the other three tutorials' own
# glossaries -- no overlap. "query" is used in this tutorial's prose
# ("a query brings the two tables back together", "at query time") but
# never given its own definition, so it is left out rather than
# glossaried on the strength of incidental use.
entries:
  - term: foreign key
    kind: concept
    definition: >
      A foreign key is a column in one table that stores the key of a row
      in another table. It has the same name as the key it points at, and
      sits directly under its own table's key. `sighting_tbl.dinosaur_id`
      is a foreign key: it stores one row's `dinosaur_id` from
      `dinosaur_tbl`.

  - term: "JOIN"
    kind: keyword
    definition: >
      JOIN combines rows from two tables into one result, matched on a
      column they share. The ON that follows it names which column in
      each table holds that shared value.
    example: "SELECT dinosaur_tbl.name, sighting_tbl.location FROM sighting_tbl JOIN dinosaur_tbl ON sighting_tbl.dinosaur_id = dinosaur_tbl.dinosaur_id;"

  - term: "table.column"
    kind: operator
    definition: >
      Names a column using both its table and its own name, such as
      `dinosaur_tbl.name`. Needed when two tables in the same query
      share a column name.
    example: "sighting_tbl.dinosaur_id"
