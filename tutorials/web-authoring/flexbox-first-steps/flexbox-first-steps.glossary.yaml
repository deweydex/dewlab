entries:
  - term: flex container
    kind: concept
    definition: "A flex container is the element with `display: flex` on it."
  - term: flex item
    kind: concept
    definition: "A flex item is one direct child of a flex container."
  - term: flex-wrap
    kind: keyword
    definition: >
      The `flex-wrap` property lets flex items move to a new row when
      they no longer fit, rather than overflow or squeeze to force a
      fit.
