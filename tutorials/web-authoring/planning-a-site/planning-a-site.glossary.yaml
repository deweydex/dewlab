entries:
  - term: site map
    kind: concept
    definition: >
      A site map says what each page of a site is for, and how the
      pages connect to one another.
  - term: wireframe
    kind: concept
    definition: >
      A wireframe is a rough sketch of a page's layout, made before any
      CSS exists, showing roughly where things sit.
