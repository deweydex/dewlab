# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: cell
    kind: concept
    definition: >
      A cell is a small box of Python code that you can change and run on
      the page. Press Run, or hold Ctrl and press Enter, and whatever the
      code produces appears under it.
  - term: expression
    kind: concept
    definition: >
      An expression is a piece of code that has a value, such as 2 + 3.
      When the last line of a cell is an expression, the cell shows its
      value, with no print() needed. An instruction, such as total = 5,
      does a job but has no value to show.
    example: "2 ** 10"
  - term: illustration
    kind: concept
    definition: >
      An illustration is a block of code with no Run button. It is there
      to be read, and you can copy it into a cell to try it.
  - term: "//"
    kind: operator
    definition: Divides, then rounds the result down to a whole number.
    example: "17 // 5 gives 3"
  - term: "%"
    kind: operator
    definition: >
      Modulo. Gives the remainder after dividing one number by another.
    example: "17 % 5 gives 2"
  - term: "**"
    kind: operator
    definition: Raises a number to a power.
    example: "2 ** 10 gives 1024"
