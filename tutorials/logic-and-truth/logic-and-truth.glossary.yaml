# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: truth table
    kind: concept
    definition: >
      A truth table lists every possible combination of True and False
      inputs to a logical operator, with the result for each one. A loop
      over every case produces it, so there is no need to memorise it.
  - term: exclusive or, XOR
    kind: concept
    definition: >
      Exclusive or is true when exactly one of its two inputs is true, and
      false when both are. It is the "or" that everyday English usually
      means. For True and False values, it is the same operation as "not
      equal to".
    example: "a ^ b   # Python's bitwise XOR, also works on booleans"
  - term: De Morgan's Laws
    kind: formula
    definition: >
      De Morgan's laws say what happens when you move a not inside a
      bracket: and becomes or, and or becomes and. So not (A and B) equals
      (not A) or (not B), and not (A or B) equals (not A) and (not B). The
      same two laws hold for sets, with union for or, intersection for
      and, and complement for not.
  - term: universal set
    kind: concept
    definition: >
      The universal set is the set of everything we are talking about in a
      problem. A complement is always taken inside it: the complement of a
      set is everything in the universal set that is not in it.
  - term: all()
    kind: function
    definition: >
      all() gives True when every value it is given is True, and False as
      soon as one is not. Given one comparison for each case, it checks a
      rule against all of them at once.
    example: "all(wins(f, s) == wins_readable(f, s) for f, s in rolls)"
