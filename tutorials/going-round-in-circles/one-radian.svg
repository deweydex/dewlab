<svg baseProfile="full" fill="currentColor" font-family="'Helvetica Neue', Inter, system-ui, sans-serif" height="334px" version="1.1" viewBox="0 0 660 334" width="660px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><circle cx="197.6" cy="167.2" fill="none" r="112" stroke="currentColor" stroke-width="1.3" /><path d="M 309.60 167.20 A 112 112 0 0 0 258.11 72.96" fill="none" stroke="currentColor" stroke-width="6" /><line stroke="currentColor" stroke-linecap="round" stroke-width="2" x1="197.6" x2="309.6" y1="167.2" y2="167.2" /><line stroke="currentColor" stroke-linecap="round" stroke-width="2" x1="197.6" x2="258.11" y1="167.2" y2="72.96" /><text fill="currentColor" font-size="13px" text-anchor="middle" x="253.6" y="185.2">radius 1</text><text fill="currentColor" font-size="13px" text-anchor="end" x="219.86" y="122.08">1</text><text fill="currentColor" font-size="13px" text-anchor="start" x="315.55" y="106.77">arc: 1</text><path d="M 223.60 167.20 A 26 26 0 0 0 211.65 145.32" fill="none" stroke="currentColor" stroke-width="1.3" /><line stroke="currentColor" stroke-linecap="round" stroke-width="2" x1="254.33" x2="261.9" y1="78.85" y2="67.06" /><line stroke="currentColor" stroke-linecap="round" stroke-width="2" x1="153.9" x2="148.08" y1="71.72" y2="58.99" /><text fill="var(--dl-muted)" font-size="11.5px" text-anchor="middle" x="142.67" y="52.17">2</text><line stroke="currentColor" stroke-linecap="round" stroke-width="2" x1="93.65" x2="79.79" y1="152.38" y2="150.41" /><text fill="var(--dl-muted)" font-size="11.5px" text-anchor="middle" x="66.92" y="153.57">3</text><line stroke="currentColor" stroke-linecap="round" stroke-width="2" x1="128.97" x2="119.82" y1="246.66" y2="257.26" /><text fill="var(--dl-muted)" font-size="11.5px" text-anchor="middle" x="111.32" y="272.1">4</text><line stroke="currentColor" stroke-linecap="round" stroke-width="2" x1="227.38" x2="231.36" y1="267.89" y2="281.31" /><text fill="var(--dl-muted)" font-size="11.5px" text-anchor="middle" x="235.04" y="298.78">5</text><line stroke="currentColor" stroke-linecap="round" stroke-width="2" x1="298.42" x2="311.86" y1="196.54" y2="200.45" /><text fill="var(--dl-muted)" font-size="11.5px" text-anchor="middle" x="324.34" y="209.08">6</text><text fill="currentColor" font-size="13px" text-anchor="start" x="378.8" y="111.2">1 radian is about 57.3°.</text><text fill="currentColor" font-size="13px" text-anchor="start" x="378.8" y="132.2">The arc is as long as the radius.</text><text fill="currentColor" font-size="13px" text-anchor="start" x="378.8" y="153.2" /><text fill="var(--dl-muted)" font-size="13px" text-anchor="start" x="378.8" y="174.2">The ticks are 1, 2, 3 ... radians</text><text fill="var(--dl-muted)" font-size="13px" text-anchor="start" x="378.8" y="195.2">round. A whole turn is 2π, about 6.28,</text><text fill="var(--dl-muted)" font-size="13px" text-anchor="start" x="378.8" y="216.2">so six fit, and a little more.</text></svg>