<svg baseProfile="full" fill="currentColor" font-family="'Helvetica Neue', Inter, system-ui, sans-serif" height="230px" version="1.1" viewBox="0 0 660 230" width="660px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><text fill="currentColor" font-size="15px" font-weight="bold" text-anchor="middle" x="48.0" y="71">6 s</text><rect fill="var(--dl-cell-bg)" height="40" rx="6" stroke="currentColor" stroke-width="1.4" width="136" x="116.0" y="46" /><text fill="currentColor" font-family="'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="13px" text-anchor="middle" x="184.0" y="71">ripple_radius</text><text fill="currentColor" font-size="15px" font-weight="bold" text-anchor="middle" x="320.0" y="71">3 m</text><rect fill="var(--dl-cell-bg)" height="40" rx="6" stroke="currentColor" stroke-width="1.4" width="124" x="388.0" y="46" /><text fill="currentColor" font-family="'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="13px" text-anchor="middle" x="450.0" y="71">circle_area</text><text fill="currentColor" font-size="15px" font-weight="bold" text-anchor="middle" x="596.0" y="71">28.27 m²</text><line stroke="currentColor" stroke-linecap="round" stroke-width="1.4" x1="84" x2="112.0" y1="66" y2="66" /><polygon fill="currentColor" points="112.0,66 105.61,68.85 105.61,63.15" stroke="none" /><line stroke="currentColor" stroke-linecap="round" stroke-width="1.4" x1="256.0" x2="284.0" y1="66" y2="66" /><polygon fill="currentColor" points="284.0,66 277.61,68.85 277.61,63.15" stroke="none" /><line stroke="currentColor" stroke-linecap="round" stroke-width="1.4" x1="356.0" x2="384.0" y1="66" y2="66" /><polygon fill="currentColor" points="384.0,66 377.61,68.85 377.61,63.15" stroke="none" /><line stroke="currentColor" stroke-linecap="round" stroke-width="1.4" x1="516.0" x2="544.0" y1="66" y2="66" /><polygon fill="currentColor" points="544.0,66 537.61,68.85 537.61,63.15" stroke