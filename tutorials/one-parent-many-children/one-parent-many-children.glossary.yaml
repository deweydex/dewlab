# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# Inheritance page of the series (Programming with objects), after
# from-a-description-to-classes since 2026.09.26. It teaches inheritance
# from the start: inheritance, parent class, child class and super() are
# defined here, and overriding is named here for the first time. The
# examples follow the game world the page now teaches in; overdraft went
# with the bank accounts.
entries:
  - term: inheritance
    kind: concept
    definition: >
      Inheritance is a way to build a new class on an existing one. The
      new class keeps everything the existing class does, and changes or
      adds only what is different.
    example: "class Troll(Character):"

  - term: parent class
    kind: concept
    definition: >
      A parent class is the existing class that a new class is built on.
      It gives its fields and methods to the new class for free.

  - term: child class
    kind: concept
    definition: >
      A child class is a new class built on a parent class. It can add
      fields and methods of its own, and replace methods it inherits.

  - term: "super()"
    python: super
    kind: function
    definition: >
      Reaches the parent class from inside a child class, so the child
      can call the parent's version of a method, and keep its rules.
    example: "super().take_damage(amount // 2)"

  - term: overriding
    kind: concept
    definition: >
      Overriding is writing a method in a child class with the same name
      as a method in its parent class. Objects of the child class then
      run the child's version.
    example: "def heal(self, amount):  # inside Phoenix"

  - term: polymorphism
    kind: concept
    definition: >
      Polymorphism is one method name working across several classes.
      Each object runs the version that fits its own class, so the caller
      does not need to check the class first.
    example: "member.take_damage(12)  # runs whichever version fits member"
