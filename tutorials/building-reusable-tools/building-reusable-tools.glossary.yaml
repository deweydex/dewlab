# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# "modular design"/"modular programming" is not repeated here — it was
# already introduced in writing-your-own-functions.glossary.yaml, earlier in
# this series.
entries:
  - term: docstring
    kind: concept
    definition: >
      A docstring is a description of a function, written in triple
      quotes at the top of it. It says what the function does, what it
      needs as input and what it gives back.
    example: 'def mean(numbers):\n    """Give back the arithmetic mean of a list of numbers."""'
  - term: contract
    kind: concept
    definition: >
      A function's contract is its promise: give it this, and it gives
      you that. The docstring states the contract, so anyone can use the
      function without reading its code.
  - term: standard deviation
    kind: formula
    definition: >
      The standard deviation is a measure of how spread out numbers are
      around their mean. The population standard deviation is the square
      root of the mean of the squared differences from the mean.
    example: "std_dev([10, 20, 30]) is about 8.165"
  - term: edge case
    kind: concept
    definition: >
      An edge case is an unusual input, at the edge of what a function
      expects, that the function must handle on purpose. An empty list
      given to a function that divides by its length is one.
  - term: test
    kind: concept
    definition: >
      A test gives a function an input whose answer is already known, and
      checks that the function gives that answer. A test that passes shows
      the function was not caught out, not that it is right.
  - term: assert
    python: assert
    kind: keyword
    definition: >
      assert is followed by something that should be True. If it is,
      nothing happens. If it is not, the program stops with an
      AssertionError, naming the line.
    example: "assert mean([10, 20, 30]) == 20"
  - term: raise
    python: raise
    kind: keyword
    definition: >
      raise stops a function with an error of its own, naming the problem,
      at the place it happened. It is the way to refuse input that makes
      no sense.
    example: 'raise ValueError("mean() needs at least one number")'
