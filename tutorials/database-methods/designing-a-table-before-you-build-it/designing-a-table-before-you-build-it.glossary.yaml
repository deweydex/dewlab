# genuinely new, emphasised term is one-to-many.
entries:
  - term: one-to-many
    kind: concept
    definition: >
      One-to-many is a relationship between two tables where one row in
      the first table can be linked to many rows in the second. Each row
      in the second table points back to exactly one row in the first,
      usually through an id column.
