# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: while loop
    python: while
    kind: keyword
    definition: >
      Repeats its body for as long as a condition stays True. It needs a
      starting state, a condition checked before each pass, and an update
      inside the body that in the end makes the condition False. Without
      that update, the loop never stops.
  - term: for loop
    python: for
    kind: keyword
    definition: Repeats its body once for each item in a sequence. It is simpler than a while loop when you know in advance how many times to repeat.
  - term: "range()"
    python: range
    kind: function
    definition: >
      Makes a sequence of numbers. range(5) gives 0 to 4. range(start,
      stop) stops before stop. range(start, stop, step) counts by any
      step, and a negative step counts backwards.
    example: "range(1, 6)   # 1, 2, 3, 4, 5"
  - term: accumulator pattern
    kind: concept
    definition: >
      The accumulator pattern is a loop that keeps a running total. The
      total starts at 0 for a sum, or 1 for a product, and the loop adds
      or multiplies into it on every pass.
  - term: sigma notation
    kind: formula
    definition: "Sigma notation is the mathematical way to write a sum. Σ means \"add up the expression for each value of the index, over the given range\", which is what a loop with a sum accumulator does."
    example: "sum(i for i in range(1, 6))  # Σ, i=1 to 5, of i"
  - term: "product notation (Π) and factorial"
    kind: formula
    definition: >
      Product notation uses capital pi, Π, to mean "multiply every value
      over the given range", in the same way that sigma means "add". The
      product of the integers from 1 to n is the factorial, n!.
    example: "5! = 1 * 2 * 3 * 4 * 5 = 120"
  - term: harmonic series
    kind: formula
    definition: The harmonic series is the sum 1 + 1/2 + 1/3 + 1/4 + and so on, adding 1/i for each whole number i.
  - term: nested loops
    kind: concept
    definition: Nested loops are a loop inside another loop. For each pass of the outer loop, the inner loop runs all the way through.
  - term: iteration
    kind: concept
    definition: >
      Iteration is repetition, using while or for. It is the third of
      programming's three basic control structures, with sequential
      execution and selection.
