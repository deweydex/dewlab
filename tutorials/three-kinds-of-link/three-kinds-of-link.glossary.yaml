# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# Sixth tutorial of first-site. Checked against the cumulative glossary
# so far -- no overlap. `href` is used throughout but never given its
# own defining sentence, so it is left for a tutorial that actually
# teaches it.
entries:
  - term: "<a>"
    kind: keyword
    definition: "`<a>` marks a link, pointing wherever its `href` attribute says."
  - term: same-site link
    kind: concept
    definition: >
      A same-site link has a filename in its `href`. It points at
      another page in your own site. The browser looks for that file in
      the same folder as the page you are on.
  - term: external link
    kind: concept
    definition: >
      An external link has a full web address in its `href`, starting
      with `https://`. It points at a page on another site.
  - term: "mailto: link"
    kind: keyword
    definition: >
      A mailto: link opens the visitor's email program, not a page, with
      a new message addressed to whoever follows the colon.
