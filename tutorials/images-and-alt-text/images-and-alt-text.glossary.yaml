# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# Fifth tutorial of first-site. The page used to teach alt text as well;
# that half is now describing-an-image, and the `alt` entry moved with
# it. `<img>` and `src` have no italicised defining sentence, but the
# whole page teaches them by name, the same reason
# computational-methods glossaries include a function like zip() even
# where it only ever appears in backticks. Checked against the
# cumulative glossary so far -- no overlap.
entries:
  - term: "<img>"
    kind: keyword
    definition: >
      `<img>` places an image on a page. It has no closing tag and no
      content between tags; the whole element is one tag with
      attributes.
  - term: src
    kind: keyword
    definition: >
      The `src` attribute on an `<img>` holds the address of the image
      file, either a path within your own site or a full web address.
  - term: path
    kind: concept
    definition: >
      A path is the address of a file inside your own site, starting
      from the HTML file that uses it. `images/photo.jpg` means a file
      called `photo.jpg` in a folder called `images`, inside the HTML
      file's folder. `..` in a path means the folder one level up.
  - term: "<figure>"
    kind: keyword
    definition: >
      `<figure>` groups an image with its caption. The caption goes in
      a `<figcaption>` inside it.
