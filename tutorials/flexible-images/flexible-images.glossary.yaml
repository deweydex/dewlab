entries:
  - term: "height: auto"
    kind: keyword
    definition: >
      `height: auto` keeps an image's proportions as it shrinks, so it
      is not squashed out of shape.
  - term: aspect ratio
    kind: concept
    definition: "The relationship between an element's width and its height."
