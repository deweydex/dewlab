# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: matrix
    kind: concept
    definition: A matrix is a grid of numbers, arranged in rows and columns.
  - term: row
    kind: concept
    definition: A row is one horizontal line of a matrix. The number of rows is said first, so a 5×3 matrix has 5 rows.
  - term: column
    kind: concept
    definition: A column is one vertical line of a matrix.
  - term: shape
    kind: concept
    definition: >
      The shape of a matrix is its number of rows and its number of
      columns. Two matrices need the same shape before you can add them.
  - term: a_ij
    kind: formula
    definition: >
      a_ij is the entry in row i and column j of a matrix. Maths counts
      rows and columns from 1, so a_11 is the top-left entry. Python
      counts from 0, so the same entry is pixels[0][0]. The row index
      always comes first and the column index second.
  - term: matrix addition
    kind: concept
    definition: >
      Matrix addition adds the numbers in matching positions of two
      matrices. It works only when both matrices have the same shape.
  - term: scalar
    kind: concept
    definition: A scalar is a single number, used together with a matrix.
  - term: scalar multiplication
    kind: concept
    definition: Scalar multiplication multiplies every entry of a matrix by the same scalar.
  - term: transpose
    kind: concept
    definition: >
      The transpose of a matrix swaps its rows and its columns. The entry
      at row i, column j moves to row j, column i. The transpose of A is
      written A^T. It only moves numbers; there is no arithmetic in it.
  - term: symmetric
    kind: concept
    definition: A symmetric matrix is a matrix that is equal to its own transpose. Swapping its rows and columns changes nothing.
  - term: "ValueError"
    kind: keyword
    definition: >
      A ValueError is an error for a value that has the right type but is
      wrong in some other way. On this page we raise one ourselves, with a
      message that says what went wrong. That is clearer than an error
      like IndexError, which says where something failed but not why.
    example: "raise ValueError(\"matrices must be the same shape\")"
