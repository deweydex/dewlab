# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# "iteration" is named in this tutorial's own reflection ("The third is
# *iteration*, which means repetition") but deliberately left out: that
# sentence describes what a later tutorial (repeating-yourself) teaches,
# not this one.
entries:
  - term: comparison operators
    kind: operator
    definition: >
      Compare two values and give back True or False. There are six: >,
      <, >=, <=, == and !=. Two equals signs, ==, asks "are these equal?".
      One equals sign, =, is assignment. Mixing the two up is one of the
      most common mistakes in programming.
  - term: if statement
    python: if
    kind: keyword
    definition: Runs its indented body only when a condition is True. The code after the body runs every time.
    example: 'if temperature > 30:\n    print("hot")'
  - term: if-else
    python: [if, else]
    kind: keyword
    definition: Runs one body when the condition is True, and the other when it is False. Between them, the two cover every case.
  - term: elif
    python: elif
    kind: keyword
    definition: >
      Adds another condition to an if statement. Its name is short for
      "else if". Python checks each condition from top to bottom, runs
      the first one that is True and skips the rest, so the order matters.
  - term: and, or, not
    python: [and, or, not]
    kind: operator
    definition: >
      Combine True and False values, or change one. These are the Boolean
      operators. "and" needs both sides True, "or" needs at least one, and
      "not" turns True into False and False into True. Python works them
      out in this order: not, then and, then or.
  - term: selection structures
    kind: concept
    definition: Selection structures are code that chooses which lines to run, such as if, elif and else.
  - term: sequential execution
    kind: concept
    definition: Sequential execution is running every line from top to bottom, every time. A program with no selection structures runs this way.
  - term: "natural numbers, integers, rationals, reals (N, Z, Q, R)"
    kind: concept
    definition: >
      These are four families of numbers, each one inside the next. Every
      natural number is an integer, every integer is a rational number,
      and every rational number is a real number.
