# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# The three kinds of wrong, SyntaxError, IndentationError, NameError,
# TypeError, ValueError, ZeroDivisionError and traceback are not repeated
# here: they moved to reading-an-error-message.glossary.yaml, which comes
# earlier in the series. This page adds the errors that need lists and
# dictionaries, and the words for finding bugs.
entries:
  - term: "IndexError"
    python: IndexError
    kind: keyword
    definition: Means you asked for a position that does not exist in a list. It is very often off by one.
  - term: "KeyError"
    python: KeyError
    kind: keyword
    definition: >
      Means you asked for a key that does not exist in a dictionary. The
      message shows the key you asked for, so check its spelling and its
      capital letters.
  - term: "AttributeError"
    python: AttributeError
    kind: keyword
    definition: >
      Means you asked a value for something it does not have. This often
      means the value is not the type you thought it was.
  - term: off-by-one error
    kind: concept
    definition: >
      An off-by-one error is a mistake where a count or a position is one
      too many or one too few. Asking for names[len(names)] is one: the
      last position in a list is one less than its length.
  - term: bug, debugging
    kind: concept
    definition: >
      A bug is a mistake in a program. Debugging is finding the bugs and
      fixing them. Two habits help most: print the values in the middle,
      with labels, and test each small piece on its own.
