# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: pandas
    kind: concept
    definition: pandas is a library for working with tables of data in Python.
  - term: library
    kind: concept
    definition: >
      A library is a collection of ready-made code that you can load and
      use. import loads it.
    example: "import pandas as pd"
  - term: DataFrame
    kind: concept
    definition: >
      A DataFrame is the table that pandas holds in Python's memory. Like
      a database table, it has named columns and one row for each record.
  - term: filtering with a comparison
    kind: concept
    definition: >
      A comparison such as readings["evening"] > 14 runs on a whole column
      at once, and gives one True or False for each row. Put inside
      readings[...], it keeps only the rows where the answer is True, like
      WHERE in SQL.
    example: 'readings[readings["evening"] > 14]'
  - term: "check()"
    python: tutorial_tools.check
    kind: function
    definition: Tells you whether a value matches the one expected. Nothing is graded or recorded.
    example: "check(readings[\"morning\"].mean(), 10.85)"
  - term: "mean()"
    python: pandas.Series.mean
    kind: function
    definition: Works out the mean, or average, of a column's values.
    example: 'readings["morning"].mean()'
