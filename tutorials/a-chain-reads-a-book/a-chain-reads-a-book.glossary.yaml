# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: "load_text()"
    python: tutorial_tools.load_text
    kind: function
    definition: >
      Fetches a plain-text file from dewlab's shared data folder, or from
      a full web address, and gives back its contents as one string.
    example: 'book = await load_text("the-time-machine.txt")'
  - term: dictionary of dictionaries
    kind: concept
    definition: >
      A dictionary of dictionaries is a dictionary whose values are
      dictionaries. In a chain built from a book, the keys are words, and
      each inner dictionary holds every word that followed the key and
      how many times. It stores only pairs that really happen, so it
      never has to store a zero the way a grid does.
  - term: "dict.setdefault()"
    python: dict.setdefault
    kind: function
    definition: >
      Returns a key's existing value if it has one, or sets and returns a
      given default if it does not. Used to start a new inner dictionary
      the first time a word is seen, without a separate check first.
    example: "next_words.setdefault(word, {})"
  - term: "str.find()"
    python: str.find
    kind: function
    definition: >
      Searches a string for the first place another string appears inside
      it, and returns that position as a number. A second argument gives a
      position to start searching from, which finds a later match instead
      of the first one. Returns -1 if the search text is not found at all.
    example: 'raw.find("*** START")'
  - term: "str.index()"
    python: str.index
    kind: function
    definition: >
      Works like str.find(): it searches for the first place another
      string appears. When the search text is not there at all, it raises
      an error, where str.find() would give back -1.
    example: 'raw.index("\n", start)'
  - term: "random.seed()"
    python: random.seed
    kind: function
    definition: >
      Sets where the random choices start, so the choices that follow come
      out the same every time. Two people who use the same seed, the same
      text and the same start word get the same sentence from a chain.
    example: "random.seed(1)"
