# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: shoelace formula
    kind: formula
    definition: >
      The shoelace formula finds the area inside a shape from its corner
      points. For each pair of neighbouring corners, cross-multiply their
      coordinates. Add up the results, and halve the total.
  - term: determinant
    kind: concept
    definition: >
      The determinant of a 2×2 matrix [[a, b], [c, d]] is ad - bc. It is
      the factor by which the matrix scales area. A negative determinant
      also flips the shape over. A determinant of zero means the matrix
      flattens every shape onto a line or a point, with no way back.
    example: "ad - bc"
  - term: singular
    kind: concept
    definition: >
      A singular matrix is a matrix whose determinant is zero. It has no
      inverse.
  - term: "A^-1 (inverse matrix)"
    kind: formula
    definition: >
      The inverse of A is the matrix that undoes A. For a 2×2 matrix it is
      (1/det(A)) times [[d, -b], [-c, a]]. There is no inverse when det(A)
      is zero, which is the algebra behind why a flattened shape cannot be
      recovered.
    example: "multiply(A, inverse(A)) == identity"
