# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: "zip()"
    python: zip
    kind: function
    definition: >
      Pairs up two lists, position by position. If the lists have
      different lengths, it stops at the end of the shorter one without
      any error. Check the lengths yourself first if that matters.
    example: "list(zip([1, 2, 3], [4, 5, 6]))  # [(1, 4), (2, 5), (3, 6)]"
  - term: dot product
    kind: concept
    definition: >
      The dot product of two lists of the same length is the number you
      get when you multiply each pair of matching entries and add up the
      results. Matrix multiplication is built from dot products.
  - term: matrix multiplication, product
    kind: concept
    definition: >
      The product TS of two 2x2 transformation matrices is the one matrix
      that does S and then T: the move that happens first is written on
      the right. In general, the entry at row i, column j of AB is the dot
      product of row i of A with column j of B.
  - term: "c_ij = sum(a_ik * b_kj)"
    kind: formula
    definition: The matrix multiplication rule, written as a formula. The sum runs over k, the position along the row and down the column.
  - term: matrix multiplication shape rule
    kind: concept
    definition: >
      To multiply an m×n matrix by an n×p matrix, the inner numbers (the
      two n's) have to match. The result is m×p.
  - term: "AB is not BA"
    kind: concept
    definition: >
      For matrices, AB and BA are usually different. The order of
      matrix multiplication matters, which is not true for ordinary
      numbers.
  - term: identity matrix
    kind: concept
    definition: >
      The identity matrix is a square matrix with ones down its main
      diagonal and zeros everywhere else. It is written I. Multiplying
      any matrix of a matching shape by it changes nothing.
