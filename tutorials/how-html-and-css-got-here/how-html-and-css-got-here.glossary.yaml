entries:
  - term: W3C
    kind: concept
    definition: >
      The W3C, the World Wide Web Consortium, is a group that writes and
      publishes standards for the web. Tim Berners-Lee founded it in
      1994.
  - term: standard
    kind: concept
    definition: >
      A standard is a document that says exactly how a language such as
      HTML or CSS works, so that every browser can follow the same
      rules.
  - term: WHATWG
    kind: concept
    definition: >
      The WHATWG is a group started by people from Apple, Mozilla and
      Opera in 2004. Its work became HTML5, and it now looks after the
      HTML standard.
  - term: browser compatibility
    kind: concept
    definition: >
      Browser compatibility is whether a feature works the same way in
      every browser a site's visitors use. MDN Web Docs and caniuse.com
      both show it.
