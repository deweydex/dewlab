# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# Second tutorial of its series (Programming with objects), after
# objects-and-classes. Checked against that glossary: no overlap.
# sequence/selection/iteration are emphasised in the PDP module's own
# tutorials too (repeating-yourself, making-decisions), but
# fundamentals-of-oop has no series.yaml pulling that module's vocabulary
# forward, so they are named here as this module's own terms. tuple is
# not taught in the Programming Foundations tutorials, so it is defined
# here where Basket first stores (name, price) pairs.
entries:
  - term: sequence
    kind: concept
    definition: >
      A sequence is a program's lines running in the order they are
      written, one after another.

  - term: selection
    kind: concept
    definition: >
      A selection is a program choosing between two or more paths,
      usually with an if statement.

  - term: iteration
    kind: concept
    definition: >
      An iteration is a program repeating one step more than once,
      usually with a loop.

  - term: tuple
    kind: concept
    definition: >
      A tuple is a fixed group of values kept together, written in round
      brackets.
    example: "(\"bread\", 2.50)"
