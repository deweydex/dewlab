# Generated per .claude/skills/tutorial-glossary/SKILL.md.
#
# Second tutorial of its series (Programming with objects), after
# objects-and-classes. Checked against that glossary: no overlap.
# sequence/selection/iteration are emphasised in the PDP module's own
# tutorials too (repeating-yourself, making-decisions), but
# fundamentals-of-oop has no series.yaml pulling that module's vocabulary
# forward, so they are named here as this module's own terms, with
# storing beside them. Since 2026.09.26 the page no longer stores
# (name, price) pairs, so tuple has gone with them.
entries:
  - term: storing
    kind: concept
    definition: >
      Storing is a program keeping a value under a name, so a later line
      can use it. Inside a class, a value stored on self lasts as long as
      the object does.
    example: "count = 0"

  - term: sequence
    kind: concept
    definition: >
      A sequence is a program's lines running in the order they are
      written, one after another.

  - term: selection
    kind: concept
    definition: >
      A selection is a program choosing between two or more paths,
      usually with an if statement.

  - term: iteration
    kind: concept
    definition: >
      An iteration is a program repeating one step more than once,
      usually with a loop.
