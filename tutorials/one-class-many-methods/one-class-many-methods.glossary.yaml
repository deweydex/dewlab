# Fifth tutorial of the series (Programming with objects) since
# 2026.09.26, after objects-and-classes, the-moves-you-already-know,
# the-tools-around-your-code and keeping-details-inside-an-object.
# Checked their glossaries as the cumulative list: none of these terms
# overlap. polynomial, coefficient, degree and leading coefficient went
# with the Polynomial class; attribute, instance, instance attribute and
# class attribute came here from objects-and-classes, with the section
# that teaches them.
entries:
  - term: reusable
    kind: concept
    definition: >
      A reusable method is written once and works on every object of its
      class, using the data that object already carries.
    example: "mars.describe()"

  - term: attribute
    kind: concept
    definition: >
      An attribute is any name reached with a dot after an object, such
      as a field or a method.
    example: "mars.distance"

  - term: instance
    kind: concept
    definition: >
      An instance is another word for an object built from a class. mars
      is an instance of Planet.

  - term: instance attribute
    kind: concept
    definition: >
      An instance attribute is a value that belongs to one object. It is
      usually set on self in the constructor, and each object has its own.
    example: "self.distance = distance"

  - term: class attribute
    kind: concept
    definition: >
      A class attribute is a value that belongs to the class itself. Every
      object of that class shares the one value. Change it through the
      class, not through an object.
    example: "star = \"the Sun\""
