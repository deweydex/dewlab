# Generated per .claude/skills/tutorial-glossary/SKILL.md.
entries:
  - term: limit
    kind: concept
    definition: >
      A limit is the value a function gets closer and closer to as its
      input gets closer to some point. The function does not need to have
      a value at that point. A limit is about the numbers near a point,
      not the point itself.
  - term: neighbourhood
    kind: concept
    definition: >
      The neighbourhood of a point is the set of numbers very close to it,
      on both sides. A limit describes what a function does in the
      neighbourhood of a point.
  - term: "lim(x -> a) f(x)"
    kind: formula
    definition: >
      This notation means "the limit of f(x) as x approaches a". It is the
      single number that f(x) gets as close to as we like, when x gets
      close enough to a, from either side.
  - term: one-sided limits must agree
    kind: concept
    definition: >
      A limit exists only if the values from below and the values from
      above head for the same number. If the two sides head for different
      numbers, or one side does not settle at all, there is no limit. The
      function may still have values at every point nearby.
  - term: limit at infinity
    kind: concept
    definition: >
      A limit at infinity is the value a function settles on as its input
      grows without end. It is written the same way as other limits, with
      x approaching infinity instead of a number.
