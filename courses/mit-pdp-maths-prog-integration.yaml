title: Programming and Maths, Integrated
code: 5N2927 + 5N18396 · QQI Level 5
status: beta
card: We recommend starting here. One course moves between the two subjects, in
  the order the class needs them.
description: 'This is dewlab''s flagship course. It teaches Programming and Design
  Principles (5N2927) and Mathematics for Information Technology (5N18396) together,
  moving between the two subjects in the order the class needs them.


  Five series carry it: programming foundations, discrete maths and statistics,
  algebra and functions, geometry and trigonometry, and a capstone project that
  draws on all four.'
