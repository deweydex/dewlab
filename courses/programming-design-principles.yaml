  - storing-and-computing
  - how-we-got-here
  - making-decisions
  - when-it-goes-wrong
  - repeating-yourself
  - lists-and-sequences
  - finding-things
  - putting-things-in-order
  - building-reusable-tools
- title: Working in a Team
  tutorials:
  - critique-and-reflection
  - the-team-project
