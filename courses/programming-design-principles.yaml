title: Programming and Design Principles
code: 5N2927 · QQI Level 5
status: beta
card: This is the programming half of the integrated course, on its own. It runs
  from a first cell to reusable tools, then a project built in a team.
description: 'This module is Programming and Design Principles (5N2927) on its own,
  without the maths. The tutorials are the same pages the integrated course uses,
  in the same order, so a class taking only this module can start here.


  Two series carry it: programming foundations, from a first cell to reusable tools,
  and working in a team, which is how the module is assessed.'
contents:
