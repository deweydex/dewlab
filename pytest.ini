# Run from the repository root: `python3 -m pytest`
#   tests/            everything
#   tests/test_*.py   the fast ones, no browser needed
# Every test file needs a name of its own across tests/, tests/build/ and
# tests/e2e/. With no __init__.py files, pytest imports each file by its
# bare name, and two files with one name stop the whole run before any test
# starts. That is why the build tests for challenges, predicts, the toolkit
# and worlds end in _build.
[pytest]
testpaths = tests
# `advisory` marks the few tests that check something an author would want to
# hear about but a reader never sees break: a warning the build prints, the
# page templates building, links inside the project's documents. They are left
# out of a plain `python3 -m pytest`, and CI reports them without failing a
# pull request (DECISIONS_LOG 7.291, 7.298). Run them with `-m advisory`.
addopts = -q -m "not advisory"
markers =
    advisory: a house preference or a planning-document check; reported, never blocking
# pytest's own default for this setting skips any folder named `build`,
# which would hide tests/build/ from `python3 -m pytest` and from CI. The
# list below is that default with `build` taken out.
norecursedirs = *.egg .* _darcs CVS dist node_modules venv {arch} site vendor-src
