# Tutorials that do not exist yet, and where each one would go.
#
# Written as data rather than prose so the curriculum map can place them in the
# existing sequence and show what they would close. Each has a fuller outline in
# planning/outlines/.
#
# `after` is a placement argument, not a filing decision: it says which existing
# tutorial the new one should follow, and `because` says why that position and
# not another. Several of these want to go in the middle of the series rather
# than on the end, which would renumber everything after them — that is a real
# cost and it is Josh's call, so nothing here has been given an `order`.

proposed:
  - id: rearranging-formulae
    outline: rearranging-formulae
    title: "Rearranging Formulae"
    after: tutorial-14-expressions-come-alive
    covers: [MIT-1.7]
    builds_on: [tutorial-14-expressions-come-alive]
    because: >
      The one algebra outcome with no home. Tutorial 14 builds polynomials and
      Tutorial 15 solves them; getting a formula into the shape you need sits
      exactly between the two, and every science subject the students take
      assumes they can do it.
    size: short

  - id: complex-roots
    outline: complex-roots
    title: "When There Is No Answer (And Then There Is)"
    after: tutorial-15-cracking-equations
    covers: [MIT-1.10]
    extends: [MIT-2.1]
    builds_on: [tutorial-15-cracking-equations, tutorial-13-numbers-and-their-families]
    because: >
      Tutorial 15 computes the discriminant, finds it negative, and stops at "no
      real solutions". That is a cliff-edge the descriptor asks us to walk over:
      the roots exist, they are just not real. It also completes the set of
      number domains that Tutorial 13 lays out and leaves at R.
    size: short

  - id: drawing-functions
    outline: drawing-functions
    title: "Drawing Functions"
    after: tutorial-15-cracking-equations
    covers: [MIT-3.1, MIT-3.2]
    builds_on: [tutorial-12-pictures-worth-numbers, tutorial-14-expressions-come-alive, tutorial-15-cracking-equations]
    because: >
      The largest single gap and the one that unlocks the rest. The students can
      already build a polynomial (14), solve it (15), and plot data (12); nobody
      has yet asked them to plot a function and read an answer off the picture.
      It used to carry MIT-4.1 to 4.3 as an optional extra, written while most of
      Section 4 was out of scope; those have their own tutorial now. And it hands
      completing the square to parabolas, on Josh's instinct that graphing wants
      more than one tutorial.

      What a function is stays here rather than becoming a tutorial of its own.
      One outcome about the idea of a machine with one output per input is a
      paragraph, not a lesson; sitting where the pictures are, it is the reason
      the pictures mean anything.
    size: full

  - id: parabolas
    outline: parabolas
    title: "Parabolas"
    after: drawing-functions
    covers: [MIT-3.4]
    builds_on: [tutorial-15-cracking-equations, drawing-functions]
    because: >
      Completing the square, and the two things it tells you: where the curve
      turns and where it crosses. Its payoff is a fact about the graph, so it
      comes after graphing rather than beside the algebra in Tutorial 15.

      Its own tutorial because the algebra is fiddly and the picture is the whole
      reward — a section inside a graphing tutorial would rush the first to reach
      the second.
    size: short

  - id: lines-and-distances
    outline: lines-and-distances
    title: "Lines and Distances"
    after: drawing-functions
    covers: [MIT-4.1, MIT-4.2, MIT-4.3, MIT-4.4]
    builds_on: [tutorial-12-pictures-worth-numbers, drawing-functions]
    because: >
      The only part of the map with outcomes in scope, no tutorial, and no
      proposal — found by counting rather than remembered. Josh settled MIT-4.1
      to 4.4 as in scope in full on 2026-08-22 and nothing was written to carry
      them.

      Its own tutorial rather than a section of drawing-functions, for two
      reasons. Pythagoras is one of the six gateways in the topic tree, unlocking
      seven downstream topics, and a gateway that exists only as somebody else's
      third subsection is not a gateway. And angles-and-waves already assumes
      this material: the unit circle is a coordinate-geometry object, so without
      this it would have to teach coordinates in passing on the way to
      trigonometry.
    size: full

  - id: the-unit-circle
    outline: the-unit-circle
    title: "The Unit Circle"
    after: lines-and-distances
    covers: [MIT-4.5, MIT-4.6, MIT-4.7]
    builds_on: [lines-and-distances]
    because: >
      Josh, 2026-08-23: the exact values in surd form deserve a tutorial of their
      own, and the unit circle is how to teach them — so the circle is worth
      introducing as its own thing rather than as a step on the way to graphing.

      All three outcomes here are the same object seen three ways. A radian is
      arc length on it. Sine and cosine are the coordinates of a point on it.
      The surd values are where the angles a person can picture actually land.
      Taught apart, each is a convention to accept; taught here, each is a fact
      about one drawing.

      After lines-and-distances because a point on a circle of radius one is a
      coordinate-geometry object, and the distance formula is what makes the
      identity true.
    size: full

  - id: sine-and-cosine-waves
    outline: sine-and-cosine-waves
    title: "Sine and Cosine Waves"
    after: the-unit-circle
    covers: [MIT-3.3]
    builds_on: [drawing-functions, the-unit-circle]
    because: >
      Unrolling the circle into a wave, and what amplitude, phase and period do
      to it. One outcome, one idea, and the animation of a point going round
      while a curve draws itself is the thing dewlab can do that paper cannot.

      Separated from the circle itself so that neither is rushed: the circle is
      where the definitions live, this is where they move.
    size: short

  - id: solving-triangles
    outline: solving-triangles
    title: "Solving Triangles"
    after: sine-and-cosine-waves
    covers: [MIT-4.8, MIT-4.9, MIT-4.10]
    builds_on: [lines-and-distances, the-unit-circle]
    because: >
      Given some of a triangle, find the rest. The Sine and Cosine Rules, the
      area from two sides and the angle between them, and the right-angled case
      that needs neither.

      This absorbs what was proposed as "How Tall Is That?". Josh: *"I don't
      really think we need to worry about it. I don't think we need to deal with
      roof pitches and buildings because we can deal with more appropriate to
      computer science types of questions there."* So the practical work stays
      and its examples change — bearings and headings, the angle between two
      vectors, a robot arm reaching a point, distances on a plot — and it does
      not need a tutorial to itself once the examples are of a piece with the
      rules.
    size: full

  - id: approaching-a-limit
    outline: approaching-a-limit
    title: "Approaching a Limit"
    after: angles-and-waves
    covers: [MIT-3.5]
    builds_on: [drawing-functions]
    because: >
      A short tutorial that exists to make the next one honest. A limit is
      exactly the sort of idea a runnable cell teaches better than a page does:
      evaluate closer and closer, watch the number settle, notice that the
      function need not be defined at the point at all.
    size: short

  - id: rates-of-change
    outline: rates-of-change
    title: "Rates of Change"
    after: approaching-a-limit
    covers: [MIT-3.6, MIT-3.7]
    builds_on: [lines-and-distances, approaching-a-limit]
    because: >
      The slope of a line that keeps changing, and then the rules for finding it
      without going back to the limit each time.

      One tutorial rather than two. Splitting the idea from the rules was tried
      on 2026-08-23 and undone the same day: a derivative tutorial that stops
      before you can differentiate anything leaves a student with a definition
      and nothing to do with it, and a rules tutorial on its own is a drill.

      Narrowed deliberately — see the `partial:` entry in out-of-scope.yaml. The
      sum and product rules, the chain rule as a bonus, and neither the quotient
      rule nor integration by parts.

      Slope was named as a rate of change in lines-and-distances precisely so
      this arrives as a continuation rather than as new vocabulary.
    size: full

  - id: logic-and-truth
    outline: logic-and-truth
    title: "Logic and Truth"
    after: tutorial-16-sets-as-sorted-lists
    covers: [MIT-2.4, MIT-2.5]
    builds_on: [tutorial-03-making-decisions, tutorial-16-sets-as-sorted-lists]
    because: >
      Students have been writing `and`, `or` and `not` since Tutorial 3 without
      ever seeing them laid out. A truth table is a small table a loop can
      generate, De Morgan's Laws are two claims a loop can check exhaustively,
      and both land better after sets have made the union/intersection shape
      familiar.
    size: short

  - id: venn-diagrams
    outline: venn-diagrams
    title: "Drawing Sets"
    after: tutorial-16-sets-as-sorted-lists
    covers: [MIT-2.3]
    builds_on: [tutorial-12-pictures-worth-numbers, tutorial-16-sets-as-sorted-lists]
    because: >
      Was out of scope, on the grounds that the diagram is a pen-and-paper
      convention adding notation rather than understanding. Josh reversed that on
      2026-08-23 and asked for a small tutorial of its own, linked to
      logic-and-truth and to sets-as-sorted-lists rather than folded into either.

      The reversal answers the original objection rather than overruling it. What
      comes back is not the notation but the picture drawn by matplotlib from
      real sets — output rather than convention, and the size at which three sets
      stop fitting in a person's head.
    size: short

  - id: how-we-got-here
    outline: from-everlearning
    title: "How We Got Here"
    after: tutorial-02-storing-and-computing
    covers: [PDP-LO1, PDP-LO3]
    builds_on: [tutorial-02-storing-and-computing]
    because: >
      The history of programming, from Lovelace's notes through machine code and
      assembly to the high-level languages these students already use. Converted
      from everlearning's Computing Time Machine notebook, which frames the
      history around binary and hexadecimal so it reinforces a skill rather than
      sitting beside it.

      After Storing and Computing rather than after Tutorial 1, because the
      notebook's binary and hex work assumes it — a placement the source made
      obvious and the earlier proposal had wrong.

      LO3, telling languages apart by their characteristics, stays in it. It was
      briefly split out as its own tutorial and put back the same day: the
      paradigms are the end of the story the history is telling, and a comparison
      tutorial with the story removed has nothing to motivate it.
    size: full
    source: >
      everlearning
      PDP_MIT_2026_2027_Integrated/LearningOutcomes/PDP/PDP-LO1_LO3_MIT-1.4_The-Computing-Time-Machine.ipynb

  - id: when-it-goes-wrong
    outline: from-everlearning
    title: "When It Goes Wrong"
    after: tutorial-03-making-decisions
    covers: [PDP-LO9]
    builds_on: [tutorial-01-first-steps]
    because: >
      Reading an error message is the single most useful thing a beginner can
      learn, and it is currently taught only in passing. Early in the series,
      while the errors are still small ones.
    size: full
    source: >
      everlearning
      PDP_MIT_2026_2027_Integrated/LearningOutcomes/PDP/PDP-LO9_LO10_Reading-Compiler-Errors-and-Debugging.ipynb

  - id: team-project
    outline: team-project
    title: "The Team Project"
    after: tutorial-17-bringing-it-all-together
    covers: [PDP-LO12]
    builds_on: [tutorial-17-bringing-it-all-together]
    because: >
      Not a tutorial. The outcome asks for teams of three to five designing,
      releasing and reviewing successive versions over time, which is an
      assessment structure and a schedule, not a page of cells. Listed here so
      the map stops showing it as a tutorial-shaped hole.
    size: not-a-tutorial
