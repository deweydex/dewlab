# The topics on the knowledge map, in plain English.
#
# What each topic actually is and where it turns up in computing. This is the
# file the map page reads, and it doubles as a glossary: everything a student
# would want to know about a topic before deciding whether to open the tutorial.
#
# A topic is not the same thing as a learning outcome. `outcomes.yaml` holds
# the four QQI module descriptors, which are the awarding body's and are not
# ours to cut up; a topic is ours, and several may serve one outcome where the
# descriptor bundles ideas a student meets separately. So each topic carries
# an `outcome:` naming the one it serves, and every outcome must still be
# claimed by at least one topic — otherwise something would go untaught with
# nobody noticing. A `PRE-` code is groundwork no descriptor asked for and
# carries no outcome at all.
#
# Four fields carry the weight:
#
#   `plain`  — what it is, in a sentence or two, assuming no prior knowledge and
#              no jargon that has not been introduced. If a student reads only
#              this, they should be able to say what the topic is about.
#   `uses`   — two or three places it turns up in computing, concrete enough to
#              picture. Not "used in data science" but the actual thing.
#   `needs`  — the topics that have to come first. These are the arrows on the
#              map, and they are about the mathematics rather than about the
#              order we happen to teach in.
#   `outcome`— which learning outcome in `outcomes.yaml` this topic serves.
#              Absent on a `PRE-` topic, which serves none.
#
# `needs` may name a topic that is not taught yet. That is the point: an arrow
# into a gap is how the map shows what is missing.

topics:
  # ------------------------------------------ MIT 1: arithmetic and algebra
  MIT-1.1a:
    name: Powers
    outcome: MIT-1.1
    plain: >
      Multiplying a number by itself over and over. The small raised number
      counts how many times, so three to the fourth means three multiplied
      by itself four times.
    uses:
      - Place value in binary. Each column of a binary number is the next
        power of two, which is why the columns read 1, 2, 4, 8, 16.
      - File sizes and storage. A kilobyte, a megabyte and a gigabyte are
        each about a thousand times the last.
      - Anything that doubles. A program that doubles its work at each step
        is described by a power of two.
    needs: []

  MIT-1.1b:
    name: Logarithms
    outcome: MIT-1.1
    plain: >
      The operation that undoes a power. A logarithm answers the question
      "how many times did I multiply?" Anything that grows or shrinks by a
      factor, rather than by a fixed amount, is usually described this way.
    uses:
      - Measuring how much slower a program gets as its input grows. An
        algorithm that halves the problem at each step takes a logarithmic
        number of steps.
      - Audio and image processing, where loudness and brightness are
        perceived as ratios rather than as differences.
    needs: [MIT-1.1a]

  MIT-1.2:
    name: Area and perimeter
    outcome: MIT-1.2
    plain: >
      How much surface a flat shape covers, and how far it is around the edge.
      Square, rectangle, triangle, circle.
    uses:
      - Laying out anything on a screen — a button's hit area, whether two
        windows overlap, how much of an image a crop keeps.
      - Estimating cost or time from a drawing, which is what most spreadsheet
        models of physical work are doing.
    needs: []

  MIT-1.3:
    name: Volume and surface area
    outcome: MIT-1.3
    plain: >
      The same question in three dimensions: how much a solid holds, and how
      much surface covers the outside. Cube, cylinder, cone, sphere.
    uses:
      - 3D graphics and games, where every object needs a bounding volume before
        anything can be drawn or collided.
      - Packing and logistics problems, which are volume arithmetic with rules.
    needs: [MIT-1.2]

  MIT-1.4:
    name: Binary and hexadecimal
    outcome: MIT-1.4
    plain: >
      Counting with only two digits, and counting with sixteen. A computer has
      only "on" and "off" to work with, so every number it holds is written in
      twos; hexadecimal is a shorthand that makes long binary readable.
    uses:
      - Colours on a screen. `#d4692a` is three hexadecimal numbers — how much
        red, how much green, how much blue.
      - File permissions, network masks, and anything described as a "flag" —
        each bit is a separate yes or no.
      - Understanding why a number can suddenly go negative when it gets too
        big, which is a whole category of real bug.
    needs: []

  MIT-1.5:
    name: Expressions and equations
    outcome: MIT-1.5
    plain: >
      An expression is something you can work out — it has a value. An equation
      is a claim that two expressions are equal, which you can solve. Knowing
      which one you are holding tells you what to do with it.
    uses:
      - Every line of code is one or the other. `total = price * 1.23` is an
        expression assigned to a name; `if total == 100` is a claim being
        tested.
      - Spreadsheet formulas, where the distinction is the difference between a
        cell that displays and a goal-seek that solves.
    needs: []

  MIT-1.6:
    name: Expanding and simplifying
    outcome: MIT-1.6
    plain: >
      Rewriting an expression so it says the same thing in a more useful shape —
      multiplying out brackets, collecting like terms.
    uses:
      - Making a slow calculation fast. The same arithmetic in a different shape
        can mean far fewer operations, which is what query optimisation does
        on a much larger scale.
      - Reading someone else's formula and satisfying yourself it does what they
        claim.
    needs: [MIT-1.5]

  MIT-1.7:
    name: Rearranging formulae
    outcome: MIT-1.7
    plain: >
      Taking a formula written to find one thing and getting it to find another.
      Speed, distance and time are one formula in three shapes, and being able
      to move between them is the skill.
    uses:
      - Turning a specification into code. The formula in the documentation is
        rarely the one you need.
      - Working backwards from a target — "what interest rate would I need?" is
        the same formula solved for a different letter.
    needs: [MIT-1.6]

  MIT-1.8:
    name: Multiplying out to quadratics
    outcome: MIT-1.8
    plain: >
      What happens when you multiply two simple expressions together: the
      squared terms that appear, and why the middle term is what it is.
    uses:
      - Predicting how a program scales. Two nested loops over the same list is
        a quadratic, and it is the most common reason something fast on ten
        items is unusable on ten thousand.
    needs: [MIT-1.6]

  MIT-1.9:
    name: Factorising quadratics
    outcome: MIT-1.9
    plain: >
      Running the multiplication backwards — finding the two simple expressions
      that were multiplied together. Once you have them, the solutions are
      obvious.
    uses:
      - Breaking a problem into independent pieces, which is the same instinct
        as factorising and the reason both are called that.
    needs: [MIT-1.8]

  MIT-1.10a:
    name: Solving quadratics
    outcome: MIT-1.10
    plain: >
      The formula that solves any quadratic equation. You put the three
      numbers in and it gives you the values that make the equation true.
    uses:
      - Working out where something lands, or when it arrives, whenever the
        quantity changes at a changing rate.
      - Finding where two curves meet, which is how a program answers a
        question like whether two moving objects collide.
    needs: [MIT-1.9]

  MIT-1.10b:
    name: Complex roots
    outcome: MIT-1.10
    plain: >
      What to do when the formula asks for the square root of a negative
      number. The answers still exist. They sit off the number line you
      have been using, on a second axis at right angles to it.
    uses:
      - Signal processing and anything involving a wave. Complex numbers
        hold how big and how far shifted in one value.
      - Working out whether a system settles down or oscillates, which is
        the difference between a control loop that works and one that
        shakes itself apart.
    needs: [MIT-1.10a, MIT-2.1]

  MIT-1.11:
    name: Linear inequalities
    outcome: MIT-1.11
    plain: >
      Solving for a range rather than a value: not "x is 5" but "x is anything
      above 5". The one surprise is that multiplying by a negative flips the
      direction.
    uses:
      - Validation. Every "must be at least 8 characters" is an inequality.
      - Setting bounds in a loop or a search, where getting the direction wrong
        is an off-by-one that runs forever.
    needs: [MIT-1.5]

  MIT-1.12:
    name: Simultaneous equations
    outcome: MIT-1.12
    plain: >
      Two or three facts that have to be true at once, and finding the values
      that satisfy all of them together.
    uses:
      - Where two lines cross, which is collision detection, route planning and
        the intersection of any two constraints.
      - Balancing a set of resources against a set of demands — the shape behind
        most scheduling and allocation code.
    needs: [MIT-1.5]

  # -------------------------------------------- MIT 2: sets and boolean logic
  MIT-2.1:
    name: Number families
    outcome: MIT-2.1
    plain: >
      The nested families numbers live in — counting numbers, then negatives,
      then fractions, then everything on the number line, then a family that
      includes the square roots of negatives. Each one exists because the
      previous one could not answer some question.
    uses:
      - Choosing a type. `int` and `float` in a program are two of these
        families, and the bugs come from forgetting which one you are in.
      - Knowing that 0.1 + 0.2 is not exactly 0.3 in most languages, and why
        that is a fact about the family and not a mistake.
    needs: []

  MIT-2.2:
    name: Set operations
    outcome: MIT-2.2
    plain: >
      Combining collections: everything in either, everything in both,
      everything in one but not the other. A set has no order and no repeats,
      which is exactly what makes these operations clean.
    uses:
      - Database queries. A join is an intersection, a union is a union, and
        "everyone who has not paid" is a difference.
      - Permissions — what a user can do is usually the intersection of what
        their role allows and what the resource permits.
    needs: [MIT-2.1]

  MIT-2.3:
    name: Venn diagrams
    outcome: MIT-2.3
    plain: >
      Drawing sets as overlapping circles so that the combinations can be
      pointed at rather than described.
    uses:
      - Explaining a filter to somebody who does not write code.
    needs: [MIT-2.2]

  MIT-2.4:
    name: Truth tables
    outcome: MIT-2.4
    plain: >
      Writing down what a logical statement gives for every possible input.
      With two inputs there are only four cases, so "every possible input" is a
      table you can actually finish.
    uses:
      - Checking a condition in code really means what you intended, especially
        once it has three clauses and a `not` in the middle.
      - How a processor is built. AND, OR and NOT gates are these tables in
        silicon.
    needs: []

  MIT-2.5:
    name: De Morgan's Laws
    outcome: MIT-2.5
    plain: >
      Two rules for turning a negation inside out. "Not (A and B)" is the same
      as "not A, or not B" — and once you have noticed it, you will start
      seeing it in other people's conditions.
    uses:
      - Simplifying a tangled `if`. Most conditions that need a comment to
        explain them are one De Morgan away from not needing one.
      - Search queries and database `WHERE` clauses, where the same rewrite can
        turn a slow query into a fast one.
    needs: [MIT-2.4]

  # ---------------------------------------------- MIT 3: functions and calculus
  MIT-3.1:
    name: Functions and inverses
    outcome: MIT-3.1
    plain: >
      A function is a machine: put a value in, get exactly one value out. An
      inverse is the machine that undoes it. Not every function has one, and
      the reason why is worth knowing.
    uses:
      - Encoding and decoding, compressing and decompressing, encrypting and
        decrypting — each pair is a function and its inverse.
      - Hashing, which is deliberately a function with no inverse, and that is
        the entire point of it.
    needs: [MIT-1.5]

  MIT-3.2:
    name: Graphing functions
    outcome: MIT-3.2
    plain: >
      Drawing a function as a picture, and reading answers off the picture.
      Where the curve crosses the axis is where the function is zero; where two
      curves cross is where they are equal.
    uses:
      - Every chart in every dashboard is this.
      - Seeing at a glance whether an algorithm's running time is levelling off
        or about to run away from you.
    needs: [MIT-3.1]

  MIT-3.3:
    name: Graphing sine and cosine
    outcome: MIT-3.3
    plain: >
      The two wave-shaped functions, and what each number in front of them
      does — how tall the wave is, how often it repeats, and where it starts.
    uses:
      - Sound. A note is a wave, and the numbers that describe it are exactly
        these.
      - Animation and easing, where a smooth back-and-forth is a sine curve.
      - Anything that repeats on a cycle — daily traffic, seasonal demand.
    needs: [MIT-3.2, MIT-4.6]

  MIT-3.4:
    name: Completing the square
    outcome: MIT-3.4
    plain: >
      Rewriting a quadratic so that its highest or lowest point can simply be
      read off. The algebra is fiddly; the payoff is that the answer is sitting
      there in the new form.
    uses:
      - Finding the best setting for something — the cheapest, the fastest, the
        least wasteful — when the thing behaves like a quadratic.
    needs: [MIT-1.9, MIT-3.2]

  MIT-3.5:
    name: Limits
    outcome: MIT-3.5
    plain: >
      What a function is heading towards, as opposed to what it does when it
      gets there. The two can differ, and the gap between them is where calculus
      starts.
    uses:
      - Reasoning about very large inputs — what happens "in the limit" is what
        Big-O notation is describing.
      - Numerical methods that get closer and closer to an answer and have to
        decide when close enough is close enough.
    needs: [MIT-3.2]

  MIT-3.6:
    name: The derivative
    outcome: MIT-3.6
    plain: >
      How fast something is changing, right now rather than on average. On a
      graph it is the steepness at a single point.
    uses:
      - Training a model. Machine learning is largely the business of nudging
        numbers in whichever direction the derivative says is downhill.
      - Physics in games — velocity is the derivative of position, and
        acceleration the derivative of velocity.
      - Detecting a spike in monitoring data, which is asking when the
        derivative got large.
    needs: [MIT-3.5, MIT-1.8]

  MIT-3.7:
    name: Rules for differentiating
    outcome: MIT-3.7
    plain: >
      Shortcuts that let you find a derivative without going back to the limit
      each time — one for adding functions, one for multiplying them.
    uses:
      - Any optimisation done symbolically rather than by trial and error.
      - Understanding what an automatic differentiation library is doing on your
        behalf, which matters the first time it gives an answer you did not
        expect.
    needs: [MIT-3.6]

  # ------------------------------------------- MIT 4: geometry and trigonometry
  MIT-4.1:
    name: Equations of lines
    outcome: MIT-4.1
    plain: >
      Writing a straight line as an equation, so that "is this point on the
      line?" becomes arithmetic rather than looking.
    uses:
      - Drawing anything. A line on a screen is this equation walked one pixel
        at a time.
      - Fitting a trend through data, which is finding the line that misses by
        the least.
    needs: [MIT-1.5]

  MIT-4.2:
    name: Slope, parallel and perpendicular
    outcome: MIT-4.2
    plain: >
      How steep a line is, and what the steepness tells you about two lines'
      relationship. Parallel lines share a slope; perpendicular ones have
      slopes that multiply to minus one.
    uses:
      - Snapping and alignment in any drawing tool.
      - Working out which way a surface faces, which is how lighting is
        calculated in 3D.
    needs: [MIT-4.1]

  MIT-4.3:
    name: Midpoint and distance
    outcome: MIT-4.3
    plain: >
      How far apart two points are, and what sits exactly halfway between them.
      Both fall straight out of Pythagoras once you treat the gap across and the
      gap up as the two short sides of a triangle.
    uses:
      - Finding the nearest anything — the closest shop, the most similar
        image, the matching fingerprint. All of them are a distance calculation.
      - Hit detection in games, and clustering in data analysis.
    needs: [MIT-4.4]

  MIT-4.4:
    name: Pythagoras
    outcome: MIT-4.4
    plain: >
      In a right-angled triangle, the two short sides squared add up to the long
      side squared. Probably the single most useful fact in this whole list.
    uses:
      - Distance between two points on a screen or a map.
      - Comparing two things described by several numbers at once, where the
        "distance" between them is the same sum of squares.
    needs: []

  MIT-4.5:
    name: Degrees and radians
    outcome: MIT-4.5
    plain: >
      Two ways of measuring an angle. Degrees are the familiar one; radians
      measure how far you have walked around the circle, which is why every
      maths library expects them.
    uses:
      - Rotating anything. Feed degrees to a function expecting radians and your
        sprite spins the wrong amount — a classic first bug in graphics code.
    needs: []

  MIT-4.6:
    name: The unit circle
    outcome: MIT-4.6
    plain: >
      A circle of radius one, and the observation that the coordinates of a
      point going round it are exactly sine and cosine. It turns two functions
      you have to memorise into one picture you can reconstruct.
    uses:
      - Circular motion, orbits, and anything on a dial.
      - The maths underneath rotating an image or a 3D model.
    needs: [MIT-4.5, MIT-4.4, MIT-4.1]

  MIT-4.7:
    name: Exact trigonometric values
    outcome: MIT-4.7
    plain: >
      The handful of angles whose sine and cosine can be written exactly with
      square roots, rather than as a decimal that goes on forever.
    uses:
      - Hand-checking that a calculation is right before trusting the code.
    needs: [MIT-4.6]

  MIT-4.8:
    name: Area of any triangle
    outcome: MIT-4.8
    plain: >
      A formula for a triangle's area that needs two sides and the angle between
      them, rather than a base and a height you may not have.
    uses:
      - Measuring an irregular area from surveyed points, by cutting it into
        triangles.
      - Rendering. Every 3D surface is triangles, and their areas decide how much
        of anything lands on them.
    needs: [MIT-4.6]

  MIT-4.9:
    name: Right-triangle trigonometry
    outcome: MIT-4.9
    plain: >
      Given one angle and one side of a right-angled triangle, finding the rest.
      The three ratios and when to reach for each.
    uses:
      - Working out a height you cannot measure — a mast, a building, the angle
        of a camera.
      - Splitting a movement into how far across and how far up, which is what
        every "move at this angle" in a game does.
    needs: [MIT-4.4, PRE-1]

  PRE-1:
    # Groundwork carries its own strand: strands otherwise come from
    # outcomes.yaml, and a topic that is deliberately not an outcome would fall
    # back to "other" — which is not a subject, it is a shrug.
    strand: geometry
    name: Kinds of triangle
    plain: >
      Telling triangles apart by their sides and angles — three equal sides,
      two equal sides, none equal, and the right angle that makes one of them
      special. Naming them is what lets any later rule say which triangles it
      applies to.
    uses:
      - Collision detection and hit-testing in games, which is mostly deciding
        which shape you are dealing with before measuring anything.
      - Mesh generation for 3D graphics, where a surface is cut into triangles
        and their shape decides how well it renders.
    needs: []

  MIT-4.10a:
    name: The Cosine Rule
    outcome: MIT-4.10
    plain: >
      A rule for a triangle that has no right angle. It is Pythagoras with
      a correction term, and the correction depends on how far the angle is
      from a right angle.
    uses:
      - Working out a distance you cannot measure directly, given two sides
        and the angle between them.
      - Robot arms and animation rigs, where the question is what angles
        put the hand in the right place.
    needs: [MIT-4.9]

  MIT-4.10b:
    name: The Sine Rule
    outcome: MIT-4.10
    plain: >
      A second rule for a triangle with no right angle. It relates each
      side to the angle opposite it, so knowing one such pair lets you find
      the others.
    uses:
      - Navigation and positioning, where you work out where you are from
        the angles to two known landmarks.
      - Surveying a distance across something you cannot walk over, such as
        a river.
    needs: [MIT-4.9]

  MIT-4.10c:
    name: The ambiguous case
    outcome: MIT-4.10
    plain: >
      Sine cannot tell an angle from 180 degrees minus that angle, so the
      Sine Rule sometimes gives two triangles that both fit. You then have
      to decide which one the problem meant.
    uses:
      - Any program that solves triangles from measurements and has to
        choose an answer rather than return both.
      - Reading a result from a library and knowing when it has quietly
        picked one of two.
    needs: [MIT-4.10b]

  # ----------------------------------------- MIT 5: probability and statistics
  MIT-5.1:
    name: Listing outcomes
    outcome: MIT-5.1
    plain: >
      Writing down everything that could happen, carefully enough that nothing
      is missed and nothing is counted twice.
    uses:
      - Testing. The set of cases worth testing is the set of things that can
        happen, and finding it is this skill.
    needs: []

  MIT-5.2:
    name: The counting principle
    outcome: MIT-5.2
    plain: >
      If one choice has three options and the next has four, together they have
      twelve. Multiply the choices.
    uses:
      - Password strength, which is exactly this multiplication and is why
        length beats cleverness.
      - Working out how many combinations of settings a system has, which is
        usually far more than anyone expected.
    needs: [MIT-5.1]

  MIT-5.3:
    name: Factorials
    outcome: MIT-5.3
    plain: >
      How many ways a set of things can be put in order. It grows
      alarmingly fast — ten items already have over three million arrangements.
    uses:
      - Knowing when brute force is hopeless. If your plan is "try every order",
        the factorial tells you whether to abandon it.
    needs: [MIT-5.2]

  MIT-5.4:
    name: Permutations
    outcome: MIT-5.4
    plain: >
      Choosing some of a set when the order matters. Picking a first, second
      and third from eight runners is a different count from picking any three
      to go through, because first place and second place are different
      places.
    uses:
      - Ranking and scheduling problems, where first and second are different
        from second and first.
    needs: [MIT-5.3]

  MIT-5.5:
    name: Combinations
    outcome: MIT-5.5
    plain: >
      Choosing some of a set when the order does not matter — a committee
      rather than a podium. Take the permutation count and divide it by the
      number of ways the chosen ones could be reordered, because all of those
      orders now count as one choice.
    uses:
      - Sampling — how many different groups of five could be drawn from a
        class of thirty.
      - Working out how many pairs of anything exist, which is what tells you a
        comparison of everything with everything is quadratic.
    needs: [MIT-5.4]

  MIT-5.6:
    name: Probability as a scale
    outcome: MIT-5.6
    plain: >
      Every probability is a number between zero and one. Zero cannot happen,
      one is certain, and everything real is in between.
    uses:
      - Reading a model's confidence honestly. A classifier that says 0.51 is
        not really making a prediction; it is saying it does not know.
    needs: []

  MIT-5.7:
    name: Equally likely outcomes
    outcome: MIT-5.7
    plain: >
      Sometimes every outcome is as likely as every other. Then the
      probability of something is just the number of outcomes that count,
      divided by how many outcomes there are altogether.
    uses:
      - Random number generation, shuffling, and load balancing — all of which
        assume this and break interestingly when the assumption is false.
    needs: [MIT-5.6, MIT-5.1]

  MIT-5.8a:
    name: Both things happening
    outcome: MIT-5.8
    plain: >
      The chance that two things both happen. When neither one affects the
      other, you multiply the two chances together, and the answer is
      always smaller than either.
    uses:
      - Reliability. A system that needs five parts all working has the
        product of their five chances, which is worse than most people
        expect.
      - Retry logic, where the chance that three attempts all fail is one
        multiplication.
    needs: [MIT-5.7]

  MIT-5.8b:
    name: Either thing happening
    outcome: MIT-5.8
    plain: >
      The chance that at least one of two things happens. You add the two
      chances, then take away the chance of both, because otherwise the
      overlap is counted twice.
    uses:
      - Working out whether any one of several alerts fires.
      - Counting how many records match one condition or another without
        double-counting the ones that match both.
    needs: [MIT-5.7]

  MIT-5.8c:
    name: When one event changes another
    outcome: MIT-5.8
    plain: >
      The chance of something given that something else has already
      happened. Learning one fact can change how likely the next one is,
      and the multiplication rule has to account for that.
    uses:
      - Reading a medical or a security test result, where the chance of a
        true alarm depends on how common the thing is.
      - Spam filters and other classifiers, which are built on chances that
        shift as each new word is read.
    needs: [MIT-5.8a, MIT-5.8b]

  MIT-5.9:
    name: Kinds of data
    outcome: MIT-5.9
    plain: >
      Data comes in kinds: labels with no order, labels with an order, whole
      counts, and measurements that can take any value. What you are allowed to
      do with a column depends on which it is.
    uses:
      - Choosing a chart. Averaging a column of postcodes is meaningless, and
        knowing the kind is what stops you.
      - Database schema design, which is this decision made permanent.
    needs: []

  MIT-5.10:
    name: Choosing a display
    outcome: MIT-5.10
    plain: >
      Which chart actually shows the thing you are trying to show, and which
      ones quietly argue for something else. A pie chart of twelve categories
      and a bar chart whose axis starts at ninety are both technically honest
      and practically misleading.
    uses:
      - Every report anyone will read. A badly chosen chart is not neutral — it
        argues for the wrong conclusion.
    needs: [MIT-5.9]

  MIT-5.11:
    name: Frequency tables and histograms
    outcome: MIT-5.11
    plain: >
      Counting how many values fall into each band, and drawing the result. The
      shape that appears tells you things no average can.
    uses:
      - Performance monitoring. The average response time hides the slow tail;
        the histogram shows it.
    needs: [MIT-5.9, MIT-6.3a]

  MIT-5.12a:
    name: The middle of a set of numbers
    outcome: MIT-5.12
    plain: >
      Three different ideas of what counts as typical. The mean adds
      everything up and shares it out, the median takes the one in the
      middle, and the mode takes the one that appears most.
    uses:
      - Any summary of anything. Which one to use is a real decision rather
        than a formality.
      - Reporting a response time. The mean and the median can tell very
        different stories about the same server.
    needs: [MIT-5.11]

  MIT-5.12b:
    name: How spread out the numbers are
    outcome: MIT-5.12
    plain: >
      How far from typical the values usually sit. The simplest measure is
      the range, which is the largest value minus the smallest.
    uses:
      - Saying how reliable a measurement is. Two sets of readings can
        share a mean and still be nothing alike.
      - Setting a sensible limit. A threshold is easier to choose once you
        know how much the values move about.
    needs: [MIT-5.12a]

  MIT-5.12c:
    name: Standard deviation
    outcome: MIT-5.12
    plain: >
      A measure of spread that uses every value rather than only the two
      extremes. It is roughly the average distance from the mean, worked
      out in a way that keeps larger distances counting for more.
    uses:
      - Spotting anomalies. An alert that fires at three standard
        deviations from the mean is this arithmetic.
      - Comparing two sets of measurements taken in different units, once
        each is expressed in standard deviations.
    needs: [MIT-5.12b]

  MIT-5.13:
    name: When averages mislead
    outcome: MIT-5.13
    plain: >
      What the mean, median and mode each hide, and which to distrust when the
      data is lopsided or has a few extreme values.
    uses:
      - Salary and response-time figures, both of which are routinely reported
        using whichever average looks best.
    needs: [MIT-5.12a]

  # ------------------------------------------ MIT 6: algorithms and computation
  MIT-6.1:
    name: What an algorithm is
    outcome: MIT-6.1
    plain: >
      A set of steps precise enough that following them requires no judgement.
      That precision is the whole difficulty and the whole point.
    uses:
      - Everything in this course. Also every recipe, every assembly
        instruction, and every legal procedure.
    needs: []

  MIT-6.2:
    name: Algorithms as functions
    outcome: MIT-6.2
    plain: >
      Thinking of an algorithm as a machine with a defined set of allowed
      inputs and one output for each. What it should do with an input outside
      that set is a decision you have to make deliberately.
    uses:
      - API design. Most of what a specification says is which inputs are
        allowed.
    needs: [MIT-6.1, MIT-3.1]

  MIT-6.3a:
    name: Lists
    outcome: MIT-6.3
    plain: >
      Holding many values under one name, in order. You can reach any one
      of them by its position, and you can do the same thing to all of them
      at once.
    uses:
      - Every collection of anything, from rows out of a database to pixels
        in an image to people waiting in a queue.
      - Reading a file. A program usually takes the lines in one at a time
        and keeps them together under one name.
    needs: [PDP-LO6a, PDP-LO6b]

  MIT-6.3b:
    name: Arrays
    outcome: MIT-6.3
    plain: >
      A list where every value is the same kind of thing, and the computer
      knows in advance how much room each one takes. Knowing that is what
      lets it jump straight to a position instead of counting along.
    uses:
      - Working with numbers in bulk. The libraries for data and for images
        store their values this way, which is part of why they are so much
        faster than a plain list.
      - Talking to hardware, or to a file format, where the bytes have to
        sit in a fixed shape.
    needs: [MIT-6.3a]

  MIT-6.4:
    name: Index and sigma notation
    outcome: MIT-6.4
    plain: >
      A compact way of writing "add up all of these" or "multiply all of these",
      with a counter that walks through the positions.
    uses:
      - Reading a formula in a paper or a specification and turning it into a
        loop, which is largely a matter of recognising this notation.
    needs: [MIT-6.3a]

  MIT-6.5:
    name: Lists applied to problems
    outcome: MIT-6.5
    plain: >
      Using a list to model something real — a shopping list, a queue, a set of
      readings — and choosing the operations the problem actually needs.
    uses:
      - Almost any small program. The first design decision is usually what goes
        in the list.
    needs: [MIT-6.3a]

  MIT-6.6:
    name: Divide and conquer
    outcome: MIT-6.6
    plain: >
      Cutting a problem in half, solving each half, and combining the answers.
      Halving repeatedly is enormously fast, which is why this idea keeps
      appearing.
    uses:
      - Binary search, the fast sorting algorithms, and the way large files are
        processed in parallel.
    needs: [MIT-6.7]

  MIT-6.7:
    name: Iterating by index
    outcome: MIT-6.7
    plain: >
      Walking through a list one position at a time, using the position itself
      as well as the value.
    uses:
      - Comparing each item with the next, which is what every sorting algorithm
        does at its core.
    needs: [MIT-6.4]

  MIT-6.8a:
    name: Searching
    outcome: MIT-6.8
    plain: >
      Finding one thing in a collection. You can look at every item in
      turn, or, if the collection is already in order, throw away half of
      it at each step.
    uses:
      - Almost every "find" a program does, from a lookup in a table to a
        word in a document.
      - Understanding why a database index exists, and what it costs to
        keep one.
    needs: [MIT-6.7]

  MIT-6.8b:
    name: Sorting
    outcome: MIT-6.8
    plain: >
      Putting a collection in order. Several methods do it, and they differ
      enormously in how long they take on a large collection.
    uses:
      - The most used non-trivial algorithm there is. A results page, a
        leaderboard and a merge of two files all sort first.
      - Making searching cheap. Once a collection is in order, finding
        something in it is much faster.
    needs: [MIT-6.7]

  # ------------------------------------------------------------------- PDP
  PDP-LO1:
    name: The history of programming
    outcome: PDP-LO1
    plain: >
      How programming got from punched cards to here, and why the languages we
      use look the way they do.
    uses:
      - Understanding why a language has a feature that seems strange, which is
        usually a decision made for a machine that no longer exists.
    needs: []

  PDP-LO2:
    name: Algorithms in the real world
    outcome: PDP-LO2
    plain: >
      Spotting the algorithms already running in ordinary life: how post is
      sorted, how a queue is served, how change is counted out. Then
      describing one precisely enough that somebody else could build it
      without asking you a single question.
    uses:
      - Turning "how we do it at the moment" into something a computer can do,
        which is most of the job.
    needs: [MIT-6.1]

  PDP-LO3:
    name: Comparing languages
    outcome: PDP-LO3
    plain: >
      What really differs between programming languages, once you look past
      the punctuation. Do they check types before running? How do they manage
      memory? What do they make easy? Choosing a language is mostly choosing
      which problems you would rather have.
    uses:
      - Reading code in a language you do not know, which is easier than it
        sounds once you know what to expect.
    needs: [PDP-LO1, PDP-LO4]

  PDP-LO4:
    name: The parts of a program
    outcome: PDP-LO4
    plain: >
      Variables, expressions, statements, input and output — the small vocabulary
      that nearly every language shares. Learn it once and a new language is
      mostly a matter of new spelling rather than new ideas.
    uses:
      - Everything. This is the alphabet.
    needs: []

  PDP-LO5:
    name: Solving in sequence
    outcome: PDP-LO5
    plain: >
      Breaking a task into ordered steps, and noticing which steps really
      depend on which. The dependencies are what fix the order. Everything
      else could be done in any sequence, and seeing the difference is what
      lets work be shared out.
    uses:
      - Planning before coding, which is the difference between an hour's work
        and an afternoon's.
    needs: [MIT-6.1]

  PDP-LO6a:
    name: Choosing between paths
    outcome: PDP-LO6
    plain: >
      Making a program take one route or another, depending on whether
      something is true. The program asks a question, and the answer
      decides which steps run next.
    uses:
      - Any program that treats one case differently from another, such as
        a form that accepts a valid entry and asks again for an invalid
        one.
    needs: [PDP-LO4]

  PDP-LO6b:
    name: Repeating a step
    outcome: PDP-LO6
    plain: >
      Making a program do the same thing again, either a fixed number of
      times or until something changes. Together with choosing between
      paths, this is enough to express any computation at all.
    uses:
      - Every program that handles more than one of anything, such as
        sending the same email to a hundred addresses.
    needs: [PDP-LO4]

  PDP-LO7:
    name: Documented programs
    outcome: PDP-LO7
    plain: >
      Writing programs somebody else can pick up and change — including you,
      in a month, having forgotten every decision you made. Names, comments
      and structure are the whole of it, and none of them change whether the
      program runs.
    uses:
      - Any code that outlives the afternoon it was written in.
    needs: [PDP-LO6a]

  PDP-LO8:
    name: Functions and scope
    outcome: PDP-LO8
    plain: >
      Packaging a piece of a program so it can be used again, and understanding
      which names are visible where.
    uses:
      - Every library you have ever imported is this, done well.
      - Most confusing bugs in a beginner's program are a scope misunderstanding.
    needs: [PDP-LO6a, MIT-3.1]

  PDP-LO9:
    name: Reading error messages
    outcome: PDP-LO9
    plain: >
      What the computer is telling you when it refuses to run your code, and
      what to do about it. Error messages are written for people who already
      know Python. This is how to become one of them.
    uses:
      - The single most useful skill a beginner can acquire, measured in hours
        saved.
    needs: [PDP-LO4]

  PDP-LO10:
    name: Testing and debugging
    outcome: PDP-LO10
    plain: >
      Deciding what a program should do before checking whether it does, and
      finding out why when it does not.
    uses:
      - Changing code without breaking it, which is the difference between a
        program that can grow and one that cannot.
    needs: [PDP-LO7]

  PDP-LO11:
    name: Coding standards
    outcome: PDP-LO11
    plain: >
      Naming, spacing and commenting conventions — the things that have no
      effect on whether a program runs and a large effect on whether anyone can
      read it.
    uses:
      - Working with other people, and being able to read your own work later.
    needs: [PDP-LO4]

  PDP-LO12:
    name: Working as a team
    outcome: PDP-LO12
    plain: >
      Designing, building and releasing software with other people over time.
      That includes reviewing each other's work and shipping more than one
      version.
    uses:
      - How essentially all professional software is made.
    needs: [PDP-LO10, PDP-LO11]

  # ------------------------------------------------------------------ FOOP
  FOOP-LO1:
    name: Data types in an object oriented program
    outcome: FOOP-LO1
    plain: >
      The kinds of value a program stores and works with — whole numbers,
      decimals, text, true or false — plus the ones a class defines for
      itself, built out of those.
    uses:
      - Choosing the right container for a value before you choose what to do
        with it, since a decimal and a whole number behave differently in
        division.
    needs: [PDP-LO4]

  FOOP-LO2:
    name: The instructions a program is built from
    outcome: FOOP-LO2
    plain: >
      The small, shared vocabulary of any program: storing a value, running
      steps in order, choosing between paths, and repeating a step. Object
      oriented programming adds new ways to organise these, not new ones to
      learn.
    uses:
      - Recognising the same handful of moves inside every class method you
        will ever write.
    needs: [PDP-LO4, PDP-LO6a]

  FOOP-LO3:
    name: Classes and objects
    outcome: FOOP-LO3
    plain: >
      A class is a blueprint: it says what an object of that kind has (its
      fields) and what it can do (its methods). An object is one thing built
      from that blueprint. Encapsulation keeps an object's own details to
      itself; inheritance lets one class reuse and extend another.
    uses:
      - Every library import that hands you a ready-made object rather than a
        bag of loose functions.
    needs: [FOOP-LO2]

  FOOP-LO4:
    name: Modular, reusable code
    outcome: FOOP-LO4
    plain: >
      Writing a method once and calling it from anywhere an object of that
      class exists, instead of copying the same steps out by hand each time
      they are needed.
    uses:
      - The difference between fixing a bug in one place and hunting down
        every copy of it.
    needs: [FOOP-LO3, PDP-LO8]

  FOOP-LO5:
    name: Working in a development environment
    outcome: FOOP-LO5
    plain: >
      The tools that sit around the code itself: an editor with autocomplete,
      a way to run a program and see what it did, and a debugger for
      following a program step by step when reading it is not enough.
    uses:
      - Working faster once the tool is doing the typing and the remembering
        it is good at, leaving the thinking to you.
    needs: []

  FOOP-LO6:
    name: Building bigger programs from smaller ones
    outcome: FOOP-LO6
    plain: >
      Putting several classes to work together, each one responsible for a
      single piece, rather than writing one long program that does
      everything itself.
    uses:
      - Any real application, which is nearly always many small, cooperating
        objects rather than one large one.
    needs: [FOOP-LO4]

  FOOP-LO7:
    name: Modelling the real world
    outcome: FOOP-LO7
    plain: >
      Deciding what an object needs to remember about itself and what it
      needs to be able to do, starting from a real thing — a customer, a
      shape, a game character — rather than from the code.
    uses:
      - Turning a problem statement written in English into a first sketch of
        which classes a program needs.
    needs: [FOOP-LO3]

  FOOP-LO8:
    name: Organising data
    outcome: FOOP-LO8
    plain: >
      Grouping the values that belong together into one object's own fields,
      instead of tracking them as separate, disconnected variables.
    uses:
      - Passing one object around a program instead of five loose values that
        have to travel together by convention.
    needs: [FOOP-LO1, FOOP-LO3]

  FOOP-LO9:
    name: Documenting object oriented code
    outcome: FOOP-LO9
    plain: >
      Writing a class so that somebody meeting it for the first time —
      including you, later — can tell what it represents and what each of
      its methods does, without reading every line.
    uses:
      - Every docstring that lets an editor show you what a method does
        before you call it.
    needs: [PDP-LO7]

  FOOP-LO10:
    name: Debugging and testing an object oriented program
    outcome: FOOP-LO10
    plain: >
      Finding out whether an object behaves the way its class promises it
      will, and tracking down why when it does not.
    uses:
      - Catching a bug in one class before it reaches every other class that
        relies on it.
    needs: [PDP-LO9, PDP-LO10]

  FOOP-LO11:
    name: Deploying a program
    outcome: FOOP-LO11
    plain: >
      Giving a finished program a way for somebody other than its author to
      actually use it, rather than leaving it runnable only from inside an
      editor.
    uses:
      - The difference between a program that works on your machine and one
        anyone else can open and use.
    needs: [FOOP-LO4]

  # ---------------------------------------------------------------- CMPS 5N0554
  CMPS-LO1a:
    name: Grids
    outcome: CMPS-LO1
    plain: >
      Arranging values in rows and columns rather than in a single row. You
      reach one value by giving two positions, first which row and then
      which column.
    uses:
      - ASCII art and computer graphics, where a grid of characters or of
        pixels is exactly this.
      - Any table of numbers a program works on, such as a spreadsheet or a
        set of readings taken at several places over several days.
    needs: [MIT-6.7]

  CMPS-LO1b:
    name: Trees
    outcome: CMPS-LO1
    plain: >
      Arranging values so that each one can lead to several others, and
      none of them leads back. Following the branches gets you to any value
      quickly, because each step rules out most of what is left.
    uses:
      - Folders on a disk, and the structure of a web page, both of which
        branch this way.
      - Deciding something in stages, where each answer narrows what you
        ask next.
    needs: [MIT-6.7]

  CMPS-LO1c:
    name: Recursion
    outcome: CMPS-LO1
    plain: >
      Writing a function that calls itself on a smaller piece of the
      problem. It needs a case small enough to answer outright, or it never
      stops.
    uses:
      - Walking a tree or a folder structure, where each branch is the same
        problem again on something smaller.
      - Any method that splits a problem in half and combines the two
        answers.
    needs: [MIT-6.7]

  CMPS-LO2:
    name: Probability and information
    outcome: CMPS-LO2
    plain: >
      How likely something is, written as a number between zero and one. The
      idea extends to statistics taken from a sample, and to events that do or
      do not affect each other. It also covers the random numbers a computer
      needs but cannot truly produce on its own.
    uses:
      - Games of chance, and any feature that needs a fair-seeming shuffle or
        deal.
      - Conditional probability in spam filters, medical testing, and
        recommendation engines.
      - Public-key infrastructure, which depends on numbers a system can
        generate but an attacker cannot predict.
    needs: [MIT-5.6, MIT-5.7]

  CMPS-LO3:
    name: Computer simulation
    outcome: CMPS-LO3
    plain: >
      Working out what would happen, instead of running the real thing when
      that would be slow, expensive or impossible. You repeat a calculation
      many times, often with randomness in it, until the results settle on an
      answer you can trust.
    uses:
      - Monte Carlo estimation, which turns a geometric or physical question
        into a counting exercise a computer can just run.
      - Testing a design against thousands of random scenarios before it is
        built.
    needs: [CMPS-LO2]

  CMPS-LO4:
    name: Matrices in practice
    outcome: CMPS-LO4
    plain: >
      What a grid of numbers is good for once you leave the data-structures
      course. A matrix is the machinery behind a graphics transformation, a
      game's state, a web search ranking, and comparing one thing with its
      nearest neighbours.
    uses:
      - Computer graphics and game engines, where every rotation, scale and
        camera move is a matrix multiplication.
      - Google's PageRank algorithm, which ranks the entire web by repeatedly
        multiplying a matrix of links.
      - Sequence alignment and nearest-neighbour search, both of which compare
        rows of numbers to find the closest match.
    needs: [MIT-6.3a, MIT-3.2]

  CMPS-LO5:
    name: Algorithmic complexity
    outcome: CMPS-LO5
    plain: >
      Judging an algorithm by how its cost grows as the input grows, not by
      how fast it feels on one small example. You separate the best case, the
      case you should expect, and the worst case you have to plan for.
    uses:
      - Choosing between two libraries that solve the same problem, where the
        real difference only shows up at scale.
      - Capacity planning — knowing before you ship that a correct answer will
        become too slow.
    needs: [MIT-6.8a]

  CMPS-LO6:
    name: Probability applied to computing
    outcome: CMPS-LO6
    plain: >
      Using probability on computing itself. How often does an algorithm meet
      its average case rather than its worst? How likely is a part to fail?
      What does network traffic look like when some of it goes missing?
    uses:
      - Average-case analysis of an algorithm, which is often the number that
        actually matters in production.
      - Failure prediction and reliability engineering, and branch prediction
        inside a processor.
      - Analysing packet loss and jitter on a network link.
    needs: [CMPS-LO2, CMPS-LO5]

  CMPS-LO7:
    name: Modelling versus simulation
    outcome: CMPS-LO7
    plain: >
      Two related things that are easy to confuse. A model is a simplified
      description of a real system, cut down to the parts that matter. A
      simulation runs that description forward in time to see what it
      predicts.
    uses:
      - A server room's cooling system, described as a model and then
        simulated to test a heatwave before it happens.
      - Robot control and autonomous-vehicle software, both of which simulate
        a model of the world many times before it meets the real one.
    needs: [CMPS-LO3]

  CMPS-LO8:
    name: Problem definition and design
    outcome: CMPS-LO8
    plain: >
      The work that comes before any code is written. You pin down what the
      problem actually is, sketch a solution, and decide in advance how you
      will test it and how you will know it worked.
    uses:
      - Writing a specification or an assessment brief that someone else could
        implement without asking you what you meant.
      - Deciding what "done" means before starting, rather than after.
    needs: [PDP-LO7]

  CMPS-LO9:
    name: Problem-solving strategies
    outcome: CMPS-LO9
    plain: >
      The few general approaches to a hard problem, and which one suits which
      situation. You can try everything, split the problem in half and combine
      the answers, or accept a good-enough answer quickly.
    uses:
      - Brute force where the input is small enough that cleverness is not
        worth the risk of a bug.
      - Divide-and-conquer in sorting, searching, and any problem that shrinks
        cleanly.
      - Heuristic strategies where an exact answer would take too long and an
        approximate one is good enough.
    needs: [MIT-6.6]

  CMPS-LO10:
    name: Symptoms versus root cause
    outcome: CMPS-LO10
    plain: >
      The difference between a fix that makes the error message go away and a
      fix that deals with why the program produced it. It means reading a
      problem for its logic instead of patching the first thing that looks
      wrong.
    uses:
      - Debugging — a crash on line 40 is often caused by a bad value created
        on line 12.
      - Any support ticket where the reported symptom and the actual defect
        are two different things.
    needs: [CMPS-LO8]

  CMPS-LO11:
    name: Iterating a model
    outcome: CMPS-LO11
    plain: >
      Building a model, checking it against what really happens, and adjusting
      it. You do this as a loop rather than once, because the first version of
      a model is almost never the one you end up using.
    uses:
      - Traffic flow at a single intersection, refined against observed queue
        lengths until the model's predictions hold up.
      - Any simulation used to make a real decision, which has to earn trust
        by matching reality before it is relied on.
    needs: [CMPS-LO7]

  CMPS-LO12:
    name: Personal attributes in problem-solving
    outcome: CMPS-LO12
    plain: >
      The habits that make someone good at solving problems, none of which is
      a technique you can be taught. Starting before every detail is settled,
      working methodically, reasoning logically, keeping going when the first
      idea fails, and now and then trying the unlikely one.
    uses:
      - Debugging a stubborn fault, which usually rewards persistence over any
        particular tool.
      - Approaching an unfamiliar problem with no worked example to copy.
    needs: []

  CMPS-LO13:
    name: What a model's numbers are worth
    outcome: CMPS-LO13
    plain: >
      How far a computational model can be trusted. You ask how accurate and
      how precise its numbers really are, and what it means to make a real
      decision on the strength of what a simulation says.
    uses:
      - Deciding whether a weather or climate model's forecast is precise
        enough to act on.
      - Knowing the difference between a model being wrong and a model being
        usefully approximate.
    needs: [CMPS-LO11]
