# Scope Exclusions & Boundary Decisions
#
# This file tracks syllabus outcomes and sub-topics explicitly excluded from
# active assessment or instruction, along with architectural rationale.
# It prevents settled scope limits from being re-opened as missing gaps in
# automated curriculum audits.
#
# Schema:
#   outcomes: list of excluded learning outcome codes
#   partial: list of partially included outcomes with excluded subtopics
#   topics: general scope boundaries
#   returned: items restored to active curriculum
#   settled: historical resolution of scope debates

# Whole outcomes excluded from active curriculum
outcomes: []

# Partially covered outcomes with specific subtopic limits
partial:
  - code: MIT-3.7
    excluded: the quotient rule, and integration by parts
    kept: >
      the sum and product rules as a tutorial of their own; integration by
      substitution as a second tutorial; the chain rule as a bonus section
    reason: >
      The quotient rule and integration by parts represent specialized manual
      manipulations beyond the computational focus of this curriculum. The chain
      rule is introduced conceptually as a bonus section rather than drilled.
      Integration by substitution is framed as the inverse operation to the chain rule.

  - code: MIT-1.5
    excluded: the formal expression-versus-equation distinction as an assessed item
    kept: both, as a working vocabulary
    reason: >
      Students require practical familiarity with evaluating expressions and
      solving equations. Rote definitional examination of the distinction is excluded.

# General scope boundaries not bound to a single outcome code
topics:
  - topic: Integration beyond polynomials
    reason: >
      Polynomial integration establishes the fundamental principle that integration
      inverts differentiation and calculates area under curves. Trigonometric,
      logarithmic, and parts-based integration are omitted.

  - topic: Trigonometric identities, equations, and compound angle formulae
    reason: >
      Manual algebraic proof of trigonometric identities and compound angle
      equations is excluded in favor of computational modeling, wave function
      plotting, and geometric triangle solving.

# Outcomes restored to active curriculum
returned:
  - code: MIT-4.7
    date: 2026-08-23
    was: >
      Trigonometric ratios in surd form previously considered a hand-calculation skill.
    now: >
      Restored as a core component of *The Unit Circle*. Exact values in surd
      form represent geometric landmark coordinates on the unit circle derived
      directly via the Pythagorean theorem. See planning/outlines/the-unit-circle.md.

  - code: MIT-2.3
    date: 2026-08-23
    was: >
      Venn diagrams previously excluded as pen-and-paper notation.
    now: >
      Restored as a dedicated modular tutorial (*Drawing Sets*), computing diagrams
      directly from Python set operations via Matplotlib. See planning/outlines/venn-diagrams.md.

# Historical scope resolutions
settled:
  - about: MIT-4.4, MIT-4.9 — Pythagoras and right-triangle trigonometry
    answer: In scope in full.
  - about: MIT-4.5, MIT-4.6 — radians and the unit circle
    answer: In scope in full.
  - about: MIT-4.1, MIT-4.2, MIT-4.3 — coordinate geometry
    answer: In scope in full.
  - about: Expansion scope
    answer: >
      Modularity and comprehensive coverage are prioritized; additional focused
      tutorials are preferred over congested composite units.
