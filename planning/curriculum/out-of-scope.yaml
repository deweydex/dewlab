# What we have decided *not* to teach or assess.
#
# A gap and a decision look identical in a coverage table, and they are not the
# same thing at all. Without this file, every pass over the curriculum
# rediscovers the same "missing" topics and someone has to remember, again, that
# we left them out on purpose. With it, the map shows them as settled rather
# than outstanding, and the count of real gaps is a number worth acting on.
#
# It earns its keep in the other direction too: if something here is still being
# taught in a tutorial, the map says so, because that is a tutorial with a
# section nobody is going to assess.
#
# Nothing here is permanent. Move an entry out and the map picks the outcome
# back up as a gap on the next run.
#
# Author: Josh. Added to as decisions are made, and the reason matters as much
# as the decision — a reason is what lets a later reader disagree with it
# properly.

# Whole outcomes we are not covering.
outcomes:
  - code: MIT-2.3
    scope: whole
    reason: >
      Venn diagrams. The set operations themselves are taught in Tutorial 16 and
      that is the part the students use. The diagram is a pen-and-paper
      convention that adds notation without adding understanding here.

  - code: MIT-4.7
    scope: whole
    reason: >
      Trigonometric ratios in surd form. Exact values from the special triangles
      are a hand-calculation skill; the trigonometry we want is the graphing and
      the two rules, both of which work in decimals.

# Outcomes we are covering, but not all of.
partial:
  - code: MIT-3.7
    excluded: the chain rule and the quotient rule
    kept: the sum rule and the product rule
    reason: >
      Differentiating a composed or divided function is a mechanical skill that
      sits well above the level these students need. Sum and product carry the
      idea that differentiation has rules and that they compose.

  - code: MIT-1.5
    excluded: the formal expression-versus-equation distinction as an assessed item
    kept: both, as a working vocabulary
    reason: >
      Students need to know that one can be evaluated and the other solved. They
      do not need to be examined on defining the difference. Tutorial 14 opens
      with this and can keep it, framed as vocabulary rather than as a topic.

# Scope limits that are not tied to one outcome code.
topics:
  - topic: Integration beyond polynomials
    reason: >
      Polynomial integration makes the point that integration undoes
      differentiation and gives area under a curve. Substitution, parts, and
      trigonometric integrals do not add to that and cost weeks.

  - topic: Trigonometry beyond graphing and the Sine and Cosine Rules
    reason: >
      The trigonometry worth having here is: what the sine and cosine curves
      look like and what amplitude, period and phase do to them; and solving a
      triangle that is not right-angled. Identities, equations, and compound
      angle formulae are not.

# Things the decisions above brush against without settling. Each needs a yes or
# no from Josh; until then the map counts them as gaps, which is the safer
# default.
#
# These are stated here in one line each. DECISIONS_NEEDED.md in this folder
# sets each one out properly — what exists already, what each answer costs, a
# recommendation, and a form of words that would settle it.
undecided:
  - about: MIT-4.4, MIT-4.9 — Pythagoras and practical right-triangle trigonometry
    question: >
      "Trigonometry beyond graphing and the Sine and Cosine Rules" could be read
      as excluding SOH-CAH-TOA as well. It is the usual way in to the subject and
      the students will have met it before, so it may be worth keeping as the
      bridge into the two rules rather than dropping.

  - about: MIT-4.5, MIT-4.6 — radians and the unit circle
    question: >
      Graphing sine and cosine needs an x-axis, and radians are what that axis is
      normally in. Keep radians as the minimum needed for the graphs, or teach
      the graphs in degrees and drop radians entirely?

  - about: MIT-4.1, MIT-4.2, MIT-4.3 — coordinate geometry
    question: >
      Not mentioned either way. Slope and midpoint are cheap to teach, sit
      naturally beside graphing straight lines in the polynomial tutorial, and
      are the one part of Section 4 that the programming half of the course can
      use directly. Keep?
