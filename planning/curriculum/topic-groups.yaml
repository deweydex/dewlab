# Broader topic groups for the "browse by topic" page (tree.html's own
# sibling — see write_topics_page() in build.py), one level up from
# `topics.yaml`'s per-outcome entries and cutting across module/series
# boundaries entirely.
#
# `topics.yaml` answers "what does MIT-3.4 mean and what does it need
# first" for the prerequisite map. This file answers a different
# question: "I want to practice trigonometry today, in whatever order —
# what's there?" A reader following the strict module order never needs
# this file at all; it exists for the one who already has some of the
# course behind them and wants to jump to a topic rather than page
# through thirty-odd tutorials in series order to find it.
#
# Each group is:
#   name    — the heading on the topics page.
#   intro   — one or two plain-English sentences, written for the reader
#             deciding whether to open this group, not a dictionary
#             definition. No unexplained jargon.
#   tutorials — a list of {module, slug} pairs, in a sensible reading
#             order for that group specifically (not the course's own
#             series order). A tutorial can appear in more than one
#             group when it genuinely spans two — that's the point of
#             this being separate from the strict, one-place-only series
#             structure.
#
# A {module, slug} naming a tutorial that doesn't exist (a typo, or one
# renamed) is a build error (see topics_page_data() in build.py) rather
# than a silently broken link.

groups:
  - key: numbers-and-algebra
    name: Numbers, expressions, and equations
    intro: >
      Where algebra starts: turning a problem into symbols, and getting
      symbols back into a single number. What an expression is, how to
      rearrange one without changing what it means, and what to do when
      an equation has no ordinary answer at all.
    tutorials:
      - { module: mit-pdp-maths-prog-integration, slug: numbers-and-their-families }
      - { module: mit-pdp-maths-prog-integration, slug: expressions-come-alive }
      - { module: mit-pdp-maths-prog-integration, slug: rearranging-formulae }
      - { module: mit-pdp-maths-prog-integration, slug: cracking-equations }
      - { module: mit-pdp-maths-prog-integration, slug: complex-roots }
      - { module: mit-pdp-maths-prog-integration, slug: mixed-algebra }

  - key: polynomials-and-graphs
    name: Quadratics, polynomials, and graphing functions
    intro: >
      A polynomial is built from just adding, multiplying, and raising to
      a power — and that simplicity is exactly why they show up
      everywhere a computer models a curve. Graphing them, reading what
      the graph says, and the one shape (the parabola) worth knowing by
      sight.
    tutorials:
      - { module: mit-pdp-maths-prog-integration, slug: expressions-come-alive }
      - { module: mit-pdp-maths-prog-integration, slug: drawing-functions }
      - { module: mit-pdp-maths-prog-integration, slug: parabolas }
      - { module: mit-pdp-maths-prog-integration, slug: cracking-equations }
      - { module: mit-pdp-maths-prog-integration, slug: lines-and-distances }

  - key: trigonometry
    name: Trigonometry — triangles, circles, and waves
    intro: >
      Right-triangle ratios, the circle they all secretly come from, and
      the repeating wave that falls out once you let the angle keep
      turning. The same handful of numbers describe a rooftop's pitch, a
      game character's aim, and a sound wave.
    tutorials:
      - { module: mit-pdp-maths-prog-integration, slug: the-unit-circle }
      - { module: mit-pdp-maths-prog-integration, slug: solving-triangles }
      - { module: mit-pdp-maths-prog-integration, slug: sine-and-cosine-waves }
      - { module: mit-pdp-maths-prog-integration, slug: mixed-trigonometry }

  - key: rates-of-change
    name: Rates of change and limits
    intro: >
      How fast something is changing, right now, not on average — the
      question that started calculus. What it means to get closer and
      closer to a value without ever quite naming it.
    tutorials:
      - { module: mit-pdp-maths-prog-integration, slug: rates-of-change }
      - { module: mit-pdp-maths-prog-integration, slug: approaching-a-limit }

  - key: counting-and-chance
    name: Counting, probability, and chance
    intro: >
      How many ways can this happen, and how likely is it? The
      arithmetic behind everything from a shuffled deck to a spam
      filter's confidence score.
    tutorials:
      - { module: mit-pdp-maths-prog-integration, slug: counting-carefully }
      - { module: mit-pdp-maths-prog-integration, slug: what-are-the-chances }

  - key: logic-and-sets
    name: Logic, sets, and decisions
    intro: >
      True, false, and nothing in between — the rules for combining
      them, the way a group of things can itself be treated as one
      object, and how both turn into a program that actually chooses
      between paths.
    tutorials:
      - { module: mit-pdp-maths-prog-integration, slug: logic-and-truth }
      - { module: mit-pdp-maths-prog-integration, slug: venn-diagrams }
      - { module: mit-pdp-maths-prog-integration, slug: sets-as-sorted-lists }
      - { module: mit-pdp-maths-prog-integration, slug: making-decisions }

  - key: data-and-pictures
    name: Working with data, and picturing it
    intro: >
      A table of numbers doesn't explain itself — summarising it, and
      choosing a chart that tells the truth about it rather than just
      looking impressive, are their own skill.
    tutorials:
      - { module: computational-methods, slug: working-with-tables }
      - { module: mit-pdp-maths-prog-integration, slug: making-sense-of-data }
      - { module: mit-pdp-maths-prog-integration, slug: pictures-worth-numbers }
      - { module: mit-pdp-maths-prog-integration, slug: mixed-data }

  - key: matrices
    name: Matrices and linear algebra
    intro: >
      A grid of numbers that can be added, multiplied, and undone like a
      single quantity — the same idea underneath a 3D game's camera, a
      photo filter, and a system of equations solved all at once instead
      of one at a time.
    tutorials:
      - { module: computational-methods, slug: grid-of-numbers }
      - { module: computational-methods, slug: multiplying-grids }
      - { module: computational-methods, slug: what-a-matrix-does-to-a-picture }
      - { module: computational-methods, slug: solving-systems }
      - { module: computational-methods, slug: undoing-it }
      - { module: computational-methods, slug: where-chains-lead }

  - key: text-generation
    name: Generating text with Markov chains
    intro: >
      This is the same chain *Matrices* introduces, grown up. Instead of
      three toy pages or one repeated sentence, it learns from an entire
      real book — closely enough to write sentences no one has read
      before.
    tutorials:
      - { module: computational-methods, slug: a-chain-reads-a-book }
      - { module: computational-methods, slug: how-much-it-remembers }
      - { module: computational-methods, slug: whose-voice-is-this }

  - key: programming-foundations
    name: Programming foundations
    intro: >
      Names for values, doing something more than once, choosing between
      paths, and finding the one thing you need in a pile of others — the
      handful of ideas every program is built from, whatever language
      it's written in.
    tutorials:
      - { module: mit-pdp-maths-prog-integration, slug: first-steps }
      - { module: computational-methods, slug: first-steps }
      - { module: mit-pdp-maths-prog-integration, slug: storing-and-computing }
      - { module: mit-pdp-maths-prog-integration, slug: lists-and-sequences }
      - { module: mit-pdp-maths-prog-integration, slug: repeating-yourself }
      - { module: mit-pdp-maths-prog-integration, slug: making-decisions }
      - { module: mit-pdp-maths-prog-integration, slug: finding-things }
      - { module: mit-pdp-maths-prog-integration, slug: putting-things-in-order }
      - { module: computational-methods, slug: three-ways-to-make-change }
      - { module: computational-methods, slug: finding-everything-inside-a-folder }
      - { module: mit-pdp-maths-prog-integration, slug: building-reusable-tools }
      - { module: mit-pdp-maths-prog-integration, slug: when-it-goes-wrong }
      - { module: mit-pdp-maths-prog-integration, slug: mixed-programming }

  - key: object-oriented-programming
    name: Objects, classes, and building bigger programs
    intro: >
      Keeping a thing's data and the operations on it together as one
      unit, so a program can have many of something — accounts, shapes,
      characters — without a separate variable name for every one of
      them.
    tutorials:
      - { module: fundamentals-of-oop, slug: the-moves-you-already-know }
      - { module: fundamentals-of-oop, slug: objects-and-classes }
      - { module: fundamentals-of-oop, slug: the-tools-around-your-code }
      - { module: fundamentals-of-oop, slug: one-class-many-methods }
      - { module: fundamentals-of-oop, slug: one-parent-many-children }
      - { module: fundamentals-of-oop, slug: testing-what-a-class-does }
      - { module: fundamentals-of-oop, slug: documenting-a-class }
      - { module: fundamentals-of-oop, slug: a-front-end-for-a-class }
      - { module: fundamentals-of-oop, slug: mixed-programming-with-objects }

  - key: big-picture
    name: How it all fits together
    intro: >
      Where the course started, what it looked like added up, and the
      one project that asks for maths and programming at the same time
      rather than one after the other.
    tutorials:
      - { module: mit-pdp-maths-prog-integration, slug: how-we-got-here }
      - { module: mit-pdp-maths-prog-integration, slug: bringing-it-all-together }
      - { module: mit-pdp-maths-prog-integration, slug: the-team-project }
      - { module: mit-pdp-maths-prog-integration, slug: critique-and-reflection }

  - key: chance-and-simulation
    name: Chance and simulation
    intro: >
      Asking a machine for a number nobody could predict, and what becomes
      possible once you can: answering a question by running something
      thousands of times and counting, rather than by solving it.
    tutorials:
      - { module: mit-pdp-maths-prog-integration, slug: what-are-the-chances }
      - { module: computational-methods, slug: leaving-it-to-chance }
      - { module: computational-methods, slug: counting-darts }
      - { module: computational-methods, slug: a-model-that-corrects-itself }
      - { module: computational-methods, slug: when-a-queue-never-clears }

  - key: problem-solving-and-debugging
    name: Solving problems and finding faults
    intro: >
      What happens before any code gets written, and what to do once a
      program runs but still gives the wrong answer — the habits and
      strategies behind fixing something, not any one language or tool.
    tutorials:
      - { module: computational-methods, slug: finding-where-it-went-wrong }

  - key: tables-and-queries
    name: Tables, rows, and simple queries
    intro: >
      A table stores records; a query asks it a question. This is where
      both ideas start — one worked example built up, changed, and joined
      to a second table, alongside a table you build and query yourself.
    tutorials:
      - { module: database-methods, slug: a-table-is-a-list-of-rows }
      - { module: database-methods, slug: asking-questions-of-a-table }
      - { module: database-methods, slug: changing-what-is-in-it }
      - { module: database-methods, slug: a-second-table-and-a-join }

  - key: real-data-and-several-tables
    name: Real data across several tables
    intro: >
      Moving from a hand-built example to a real, published dataset: loading
      a CSV into a table, joining it to a second one, charting a query's
      result, and getting a result back out again. Ends with a five-table
      design of its own — a college timetable, and the query that finds a
      double-booked room or teacher.
    tutorials:
      - { module: database-methods, slug: designing-a-table-before-you-build-it }
      - { module: database-methods, slug: loading-a-real-dataset }
      - { module: database-methods, slug: joining-two-real-tables }
      - { module: database-methods, slug: charting-a-querys-result }
      - { module: database-methods, slug: exporting-a-query-to-a-file }
      - { module: database-methods, slug: a-form-that-writes-a-row }
      - { module: database-methods, slug: a-college-timetable }

  - key: database-practice
    name: Database practice and self-checks
    intro: >
      Open-ended SQL practice, and two self-checked quizzes that build a
      database task by task, with a hint if you get stuck. The second one
      adds a many-to-many table of its own, with a different kind of key.
    tutorials:
      - { module: database-methods, slug: sql-practice }
      - { module: database-methods, slug: the-tentacular-plushies-quiz }
      - { module: database-methods, slug: the-library-loans-quiz }

  - key: web-authoring-orientation
    name: A GitHub account, an editor, and a published page
    intro: >
      The tools this course's website track runs on, and the two loops
      you use every time you change something: saving a file on your own
      computer, and publishing a change through GitHub.
    tutorials:
      - { module: web-authoring, slug: how-the-pieces-fit }
      - { module: web-authoring, slug: a-github-account }
      - { module: web-authoring, slug: issues-and-pull-requests }
      - { module: web-authoring, slug: an-editor }
      - { module: web-authoring, slug: your-copy-of-the-starter }
      - { module: web-authoring, slug: publish-it }
      - { module: web-authoring, slug: the-two-loops }
      - { module: web-authoring, slug: the-inspector }

  - key: web-authoring-reference
    name: Web authoring reference shelf
    intro: >
      Not a series to read start to finish — a shelf to come back to.
      Questions people ask most, the checks worth trying when something
      will not run, HTML/CSS/SQL syntax to look up, and project ideas
      once you have a skill and want to practise it.
    tutorials:
      - { module: web-authoring, slug: faq }
      - { module: web-authoring, slug: troubleshooting }
      - { module: web-authoring, slug: quick-reference }
      - { module: web-authoring, slug: project-ideas }

  - key: web-first-page
    name: "Your first page: HTML basics"
    intro: >
      Tags, elements and attributes; the head and the body; headings,
      paragraphs and emphasis; sections that say what they hold; images
      that still make sense when they fail to load; and three kinds of
      link.
    tutorials:
      - { module: web-authoring, slug: a-page-is-files }
      - { module: web-authoring, slug: the-skeleton }
      - { module: web-authoring, slug: headings-and-emphasis }
      - { module: web-authoring, slug: sections-that-mean-something }
      - { module: web-authoring, slug: images-and-alt-text }
      - { module: web-authoring, slug: three-kinds-of-link }
      - { module: web-authoring, slug: navigation }

  - key: web-css-basics
    name: "CSS basics: rules, boxes and selectors"
    intro: >
      Where a rule lives and what it is made of, the three layers around
      every element's content, units that hold their ground differently,
      and picking out exactly the elements you mean.
    tutorials:
      - { module: web-authoring, slug: a-rule-and-where-it-lives }
      - { module: web-authoring, slug: variables-and-colour }
      - { module: web-authoring, slug: the-box }
      - { module: web-authoring, slug: text-and-units }
      - { module: web-authoring, slug: selectors-and-classes }
      - { module: web-authoring, slug: the-container }

  - key: web-interactive-css
    name: Interactive and responsive CSS
    intro: >
      A header that stays in view, a footer that never floats up, states
      a reader triggers with a pointer or a keyboard, smooth transitions,
      and CSS that only applies below a chosen screen width.
    tutorials:
      - { module: web-authoring, slug: position-and-the-sticky-header }
      - { module: web-authoring, slug: hover-and-focus }
      - { module: web-authoring, slug: transitions-and-transforms }
      - { module: web-authoring, slug: media-queries }

  - key: web-layout-and-naming
    name: Flexbox, grid, and naming your CSS
    intro: >
      Images that fit their container at any width, rows that wrap and
      grids that resize themselves, a whole page laid out as a named map,
      a naming pattern that says what a class is for, and CSS that moves
      on its own or answers a click.
    tutorials:
      - { module: web-authoring, slug: flexible-images }
      - { module: web-authoring, slug: flexbox-first-steps }
      - { module: web-authoring, slug: named-grid-areas }
      - { module: web-authoring, slug: css-variables-and-bem }
      - { module: web-authoring, slug: keyframes-and-the-checkbox-hack }

  - key: web-several-pages
    name: A site with several pages
    intro: >
      Planning five pages before writing any HTML, one navigation that
      appears on all of them, cards and a gallery that rearrange
      themselves, a navigation that works on a phone, an accessible
      form, keeping image files small, and documenting what you built.
    tutorials:
      - { module: web-authoring, slug: planning-a-site }
      - { module: web-authoring, slug: pages-and-navigation }
      - { module: web-authoring, slug: cards-in-a-row }
      - { module: web-authoring, slug: a-grid-gallery }
      - { module: web-authoring, slug: navigation-on-a-phone }
      - { module: web-authoring, slug: a-form }
      - { module: web-authoring, slug: images-and-file-size }
      - { module: web-authoring, slug: documenting-what-you-built }

  - key: full-stack-basics
    name: A page joined to its own database
    intro: >
      Database Methods built tables. Web Authoring built pages. This is
      where the two meet — a page whose own script reads a database
      directly, and shows a visitor's own search back as it happens.
    tutorials:
      - { module: full-stack, slug: a-page-that-reads-from-a-database }
