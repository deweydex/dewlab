# The two QQI Level 5 module descriptors, one entry per learning outcome.
#
# This is the spine of the curriculum map. Every tutorial declares which of
# these codes it covers, in its `covers:` frontmatter, and dev/curriculum_map.py
# turns the two together into planning/CURRICULUM_MAP.md. A code that appears in
# a tutorial but not here fails the build, so the map cannot drift from either
# side.
#
# Wording is a close paraphrase of each outcome rather than the descriptor's
# exact legal text — enough to recognise the outcome, short enough to read in a
# diagram. The descriptors themselves are the authority:
#   Maths for Information Technology 5N18396
#   Programming and Design Principles 5N2927
# Both PDFs live in the everlearning repository, under
# PDP_MIT_2026_2027_Integrated/.
#
# `strand` groups an outcome for the map's colouring, and is our word rather
# than the descriptor's: it answers "what kind of thing is this?" in a way a
# student would recognise, which the descriptor's section numbers do not.

modules:
  MIT:
    title: "Maths for Information Technology"
    code: "5N18396"
    sections:
      "1": "Basic Arithmetic and Algebra"
      "2": "Set Theory and Boolean Logic"
      "3": "Functions and Calculus"
      "4": "Geometry and Trigonometry"
      "5": "Probability and Statistics"
      "6": "Algorithms and Computations"
  PDP:
    title: "Programming and Design Principles"
    code: "5N2927"
    sections:
      LO: "Learning outcomes"

outcomes:
  # ---------------------------------------------- MIT 1: arithmetic & algebra
  - code: MIT-1.1
    title: "Operations in N, Z, Q, R; indices and logarithms"
    strand: number
  - code: MIT-1.2
