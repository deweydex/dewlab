# The QQI Level 5 module descriptors, one entry per learning outcome.
#
# This is the spine of the curriculum map. Every tutorial declares which of
# these codes it covers, in its `covers:` frontmatter, and dev/curriculum_map.py
# turns the two together into planning/CURRICULUM_MAP.md. A code that appears in
# a tutorial but not here fails the build, so the map cannot drift from either
# side.
#
# Wording is a close paraphrase of each outcome rather than the descriptor's
# exact legal text — enough to recognise the outcome, short enough to read in a
# diagram. The descriptors themselves are the authority:
#   Maths for Information Technology 5N18396
#   Programming and Design Principles 5N2927
#   Computational Methods and Problem Solving 5N0554
#   Fundamentals of Object Oriented Programming 5N0541
#   Database Methods 5N0783
# All five PDFs live in this repository, under planning/curriculum/descriptors/.
#
# Database Methods 5N0783's own descriptor is written for a GUI database tool
# (Microsoft Access — "design view", "pivot chart", "combo box", "Lookup
# wizard", mail-merge labels). dewlab teaches the same eleven outcomes through
# real SQL and Python instead, since that is what dewlab teaches everywhere
# else — DBM-LO3, DBM-LO6 and DBM-LO7 below are the clearest cases of the
# descriptor's own vocabulary and dewlab's parting ways, not a disagreement
# about what the outcome means. "A Form That Writes a Row" covers DBM-LO6
# with the query side of a data-entry form — the `INSERT` a submission would
# run — and says plainly that reading an HTML form's own fields is Web
# Authoring's job, not yet joined to this page. "Exporting a Query to a File"
# and "Charting a Query's Result" cover DBM-LO7's reports as a CSV export and
# a matplotlib chart. Ten of the eleven are covered. DBM-LO1 (typical uses for
# databases) has a topics.yaml entry but no page of its own yet — see
# planning/CURRICULUM_MAP.md for the current state of every code.
#
# `strand` groups an outcome for the map's colouring, and is our word rather
# than the descriptor's: it answers "what kind of thing is this?" in a way a
# student would recognise, which the descriptor's section numbers do not.
#
# Where the descriptor's vocabulary and ours differ, both appear here — this is
# the file an examiner's wording has to be findable in. The tutorials use ours.
# `MIT-1.1` is the case in point: the syllabus says "indices", dewlab says
# "powers", because "index" is already taken by the position of an item in a
# list, which students meet nine tutorials earlier.

modules:
  MIT:
    title: "Maths for Information Technology"
    code: "5N18396"
    sections:
      "1": "Basic Arithmetic and Algebra"
      "2": "Set Theory and Boolean Logic"
      "3": "Functions and Calculus"
      "4": "Geometry and Trigonometry"
      "5": "Probability and Statistics"
      "6": "Algorithms and Computations"
  PDP:
    title: "Programming and Design Principles"
    code: "5N2927"
    sections:
      LO: "Learning outcomes"
  CMPS:
    title: "Computational Methods and Problem Solving"
    code: "5N0554"
    sections:
      LO: "Learning outcomes"
  FOOP:
    title: "Fundamentals of Object Oriented Programming"
    code: "5N0541"
    sections:
      LO: "Learning outcomes"
  DBM:
    title: "Database Methods"
    code: "5N0783"
    sections:
      LO: "Learning outcomes"
  WA:
    title: "Web Authoring"
    code: "5N1910"
    sections:
      LO: "Learning outcomes"

outcomes:
  # ---------------------------------------------- MIT 1: arithmetic & algebra
  - code: MIT-1.1
    title: "Operations in N, Z, Q, R; powers (the syllabus says indices) and logarithms"
    strand: number
  - code: MIT-1.2
    title: "Area and perimeter: square, rectangle, triangle, circle"
    strand: geometry
  - code: MIT-1.3
    title: "Volume and surface area: cube, cylinder, cone, sphere"
    strand: geometry
  - code: MIT-1.4
    title: "Binary and hexadecimal arithmetic and conversion"
    strand: number
  - code: MIT-1.5
    title: "Distinguish an expression from an equation"
    strand: algebra
  - code: MIT-1.6
    title: "Evaluate, expand and simplify expressions"
    strand: algebra
  - code: MIT-1.7
    title: "Transpose formulae; operate on rational algebraic expressions"
    strand: algebra
  - code: MIT-1.8
    title: "Multiply linear expressions into quadratics and cubics"
    strand: algebra
  - code: MIT-1.9
    title: "Factor quadratics by inspection and solve them"
    strand: algebra
  - code: MIT-1.10
    title: "Solve quadratics, including complex roots"
    strand: algebra
  - code: MIT-1.11
    title: "Solve linear inequalities"
    strand: algebra
  - code: MIT-1.12
    title: "Simultaneous equations in two and three unknowns"
    strand: algebra

  # ------------------------------------------------- MIT 2: sets & boolean
  - code: MIT-2.1
    title: "Set language: N, Z, Q, R, C, the empty set; finite, infinite, cardinality"
    strand: sets
  - code: MIT-2.2
    title: "Set operations: union, intersection, complement, symmetric difference, Cartesian product, power set"
    strand: sets
  - code: MIT-2.3
    title: "Venn diagrams for two and three sets"
    strand: sets
  - code: MIT-2.4
    title: "Truth tables: AND, NOT, OR, XOR"
    strand: logic
  - code: MIT-2.5
    title: "De Morgan's Laws"
    strand: logic

  # --------------------------------------------- MIT 3: functions & calculus
  - code: MIT-3.1
    title: "The function and inverse function concept"
    strand: functions
  - code: MIT-3.2
    title: "Graph linear, quadratic and cubic functions; solve from a graph"
    strand: functions
  - code: MIT-3.3
    title: "Define and graph the trigonometric functions"
    strand: trigonometry
  - code: MIT-3.4
    title: "Complete the square to find roots and vertex"
    strand: functions
  - code: MIT-3.5
    title: "The limit of a function"
    strand: calculus
  - code: MIT-3.6
    title: "The derivative as a limit, a tangent slope, a rate of change"
    strand: calculus
  - code: MIT-3.7
    title: "Sum, product, quotient and chain rules"
    strand: calculus

  # ------------------------------------------- MIT 4: geometry & trigonometry
  - code: MIT-4.1
    title: "Linear equations in the form ax + by + c = 0"
    strand: geometry
  - code: MIT-4.2
    title: "Slope; parallel and perpendicular lines"
    strand: geometry
  - code: MIT-4.3
    title: "Midpoint and length of a line segment"
    strand: geometry
  - code: MIT-4.4
    title: "The Pythagorean theorem"
    strand: geometry
  - code: MIT-4.5
    title: "Degree and radian measure"
    strand: trigonometry
  - code: MIT-4.6
    title: "sin, cos, tan and the unit circle: amplitude, phase, period"
    strand: trigonometry
  - code: MIT-4.7
    title: "Trigonometric ratios in surd form"
    strand: trigonometry
  - code: MIT-4.8
    title: "Triangle area as one half a b sin theta"
    strand: trigonometry
  - code: MIT-4.9
    title: "Practical right-triangle trigonometry"
    strand: trigonometry
  - code: MIT-4.10
    title: "The Sine Rule and the Cosine Rule"
    strand: trigonometry

  # ----------------------------------------- MIT 5: probability & statistics
  - code: MIT-5.1
    title: "List the outcomes of an experiment"
    strand: probability
  - code: MIT-5.2
    title: "The fundamental principle of counting"
    strand: probability
  - code: MIT-5.3
    title: "Arrangements of n objects (n factorial)"
    strand: probability
  - code: MIT-5.4
    title: "Permutations P(n, r)"
    strand: probability
  - code: MIT-5.5
    title: "Combinations C(n, r)"
    strand: probability
  - code: MIT-5.6
    title: "Probability as a scale from 0 to 1"
    strand: probability
  - code: MIT-5.7
    title: "Probability from equally likely outcomes"
    strand: probability
  - code: MIT-5.8
    title: "Compound probability: independent and mutually exclusive events"
    strand: probability
  - code: MIT-5.9
    title: "Data types: nominal, ordinal, discrete, continuous"
    strand: statistics
  - code: MIT-5.10
    title: "Effectiveness of displays: pie, histogram, stem-and-leaf"
    strand: statistics
  - code: MIT-5.11
    title: "Frequency tables and histograms"
    strand: statistics
  - code: MIT-5.12
    title: "Mean, median, mode, range, standard deviation"
    strand: statistics
  - code: MIT-5.13
    title: "Merits and limitations of the averages with skewed data"
    strand: statistics

  # ------------------------------------------ MIT 6: algorithms & computation
  - code: MIT-6.1
    title: "The concept of an algorithm"
    strand: algorithms
  - code: MIT-6.2
    title: "An algorithm as a function on a domain of inputs"
    strand: algorithms
  - code: MIT-6.3
    title: "Manipulate lists and arrays, including addition and multiplication"
    strand: algorithms
  - code: MIT-6.4
    title: "Index, sigma and pi notation"
    strand: algorithms
  - code: MIT-6.5
    title: "Lists and arrays applied to simple problems"
    strand: algorithms
  - code: MIT-6.6
    title: "Divide and conquer"
    strand: algorithms
  - code: MIT-6.7
    title: "Iterate over a one-dimensional array by index"
    strand: algorithms
  - code: MIT-6.8
    title: "Recursion; linear and binary search; bubble, insertion, selection and shell sort"
    strand: algorithms

  # ------------------------------------------------------------------- PDP
  - code: PDP-LO1
    title: "The history of computer programming"
    strand: programming
  - code: PDP-LO2
    title: "Algorithms and their real-world application"
    strand: algorithms
  - code: PDP-LO3
    title: "Differentiate programming languages by their characteristics"
    strand: programming
  - code: PDP-LO4
    title: "Procedural syntax: storage, expressions, statements, input and output, keywords, operators"
    strand: programming
  - code: PDP-LO5
    title: "The sequential nature of problem solving"
    strand: programming
  - code: PDP-LO6
    title: "Structured design: pseudocode, storage, selection and iteration"
    strand: programming
  - code: PDP-LO7
    title: "Develop documented programs for familiar and unfamiliar problems"
    strand: programming
  - code: PDP-LO8
    title: "Modularisation: functions, procedures, scope, parameter passing"
    strand: programming
  - code: PDP-LO9
    title: "Interpret compiler and linker messages and react appropriately"
    strand: programming
  - code: PDP-LO10
    title: "The testing process: structured walkthroughs and debugging tools"
    strand: programming
  - code: PDP-LO11
    title: "Coding standards: comments, indentation, variable naming"
    strand: programming
  - code: PDP-LO12
    title: "Team programming: design, develop, release and review over time, in teams of three to five"
    strand: programming

  # ------------------------------------------------------------------ FOOP
  # Fundamentals of Object Oriented Programming, 5N0541. Eleven outcomes —
  # one fewer than PDP's twelve, not a typo; the descriptor's own numbered
  # list stops at 11.
  - code: FOOP-LO1
    title: "Data types used in object oriented programs"
    strand: oop
  - code: FOOP-LO2
    title: "The fundamental set of instructions in a program, and using them to design and construct programs that solve problems"
    strand: programming
  - code: FOOP-LO3
    title: "Basic object oriented constructs: classes, objects, methods, fields, encapsulation, abstraction, inheritance"
    strand: oop
  - code: FOOP-LO4
    title: "Design and construct modular, reusable code blocks"
    strand: programming
  - code: FOOP-LO5
    title: "Work within a modern integrated development environment"
    strand: programming
  - code: FOOP-LO6
    title: "Construct larger programs from smaller ones"
    strand: oop
  - code: FOOP-LO7
    title: "Model real-world objects to build object oriented programs that model real-world activities"
    strand: oop
  - code: FOOP-LO8
    title: "Ways to organise and structure data"
    strand: programming
  - code: FOOP-LO9
    title: "Document program code properly"
    strand: programming
  - code: FOOP-LO10
    title: "Debug and test programs"
    strand: programming
  - code: FOOP-LO11
    title: "Deploy a program to the end user via a front end"
    strand: programming

  # ---------------------------------------------------------------- CMPS 5N0554
  # Computational Methods and Problem Solving. Thirteen outcomes, paraphrased
  # from the descriptor at planning/curriculum/descriptors/. The descriptor's
  # own "e.g." examples (ASCII art, PKI, Google PageRank, server-room
  # temperature, and so on) are suggested content, not the thing coverage is
  # measured against — they live in topics.yaml's `uses:` for each code, never
  # here. See DECISIONS_LOG.md 7.55.
  - code: CMPS-LO1
    title: "Data structures and representations — arrays, lists, matrices, trees — and the difference between iterative and recursive algorithms"
    strand: data-structures
  - code: CMPS-LO2
    title: "Elementary probability and information theory: distributions, sample statistics, dependent and independent events, conditional probability, and randomness in computing"
    strand: probability
  - code: CMPS-LO3
    title: "Basic computational and numerical methods for computer simulation"
    strand: simulation
  - code: CMPS-LO4
    title: "Apply array and matrix representations to real-world computational problems"
    strand: linear-algebra
  - code: CMPS-LO5
    title: "Assess an algorithm or computational approach for speed, efficiency, and best/expected/worst-case behaviour"
    strand: complexity
  - code: CMPS-LO6
    title: "Apply probability and information theory to computational approaches to real-world problems"
    strand: probability
  - code: CMPS-LO7
    title: "Differentiate modelling from simulation, and the abstraction that lets a machine address a real-world problem"
    strand: modelling
  - code: CMPS-LO8
    title: "Identify approaches to problem definition, solution design, testing and evaluation"
    strand: problem-solving
  - code: CMPS-LO9
    title: "Strengths, weaknesses and areas of application of contemporary problem definition and analysis techniques"
    strand: complexity
  - code: CMPS-LO10
    title: "Distinguish pragmatic problem-solving (treating the symptom) from semantic analysis (finding the root cause)"
    strand: problem-solving
  - code: CMPS-LO11
    title: "An iterative process of model creation and validation against the real-world situation being modelled"
    strand: modelling
  - code: CMPS-LO12
    title: "The role of personal attributes — initiative, a methodical approach, logical reasoning, persistence, lateral thinking — in preventing and resolving problems"
    strand: problem-solving
  - code: CMPS-LO13
    title: "Reflect on the impact of numerical and logical thinking in the real world: accuracy, precision, and decisions made from computational models and simulations"
    strand: reflection

  # ---------------------------------------------------------------- DBM
  - code: DBM-LO1
    title: "Typical uses for databases, in everyday life and in business decision-making"
    strand: database-concepts
  - code: DBM-LO2
    title: "Essential database concepts: tables, rows, columns, statements, queries"
    strand: database-concepts
  - code: DBM-LO3
    title: "Explain what a query does, and read and write one in SQL (the descriptor's own list — design view, datasheet view, pivot table, pivot chart — names a GUI tool's views; dewlab teaches the query language directly instead)"
    strand: querying
  - code: DBM-LO4
    title: "Open an existing table and carry out routine operations on it: reading, adding, editing, deleting, sorting and filtering rows"
    strand: querying
  - code: DBM-LO5
    title: "Retrieve chosen data from one or more tables by writing a query, saved as the reader's own work for reuse"
    strand: querying
  - code: DBM-LO6
    title: "Write the query a data-entry submission would run against a table (the descriptor's own form is a GUI data-entry screen; dewlab covers the query side here and the HTML side in Web Authoring)"
    strand: data-entry
  - code: DBM-LO7
    title: "Present selected information from a database in a format suitable for sharing or printing (the descriptor's own GUI report builder; dewlab teaches a CSV export and a chart instead)"
    strand: reporting
  - code: DBM-LO8
    title: "Import external data, such as a CSV file, into a table"
    strand: data-import
  - code: DBM-LO9
    title: "Design a database to a brief: tables, primary keys, and the relationships between tables"
    strand: design
  - code: DBM-LO10
    title: "Build a database to a brief: create its tables, load or enter data, and write the queries it needs"
    strand: design
  - code: DBM-LO11
    title: "Use hints, error messages and self-checks to work through an unfamiliar database problem"
    strand: reflection

  # ----------------------------------------------------------------- WA
  # Web Authoring 5N1910. The descriptor assumes a commercial GUI toolchain
  # throughout — a WYSIWYG editor beside a text editor, desktop publishing
  # programs, website management systems (Joomla, Drupal, WordPress), FTP
  # upload, and HTML/CSS code generators. dewlab teaches the same fourteen
  # outcomes through hand-written HTML, CSS and JavaScript in its own
  # in-browser site editor instead, published through GitHub Pages rather
  # than an ISP's own hosting — WA-LO3, WA-LO5, WA-LO12 and WA-LO13 below are
  # the clearest cases of the descriptor's own vocabulary and dewlab's
  # parting ways, not a disagreement about what the outcome means. WA-LO12
  # (HTML/CSS code generators) has no dewlab equivalent yet and is not
  # claimed as covered by anything, the same way DBM-LO1 is flagged in the
  # section above. WA-LO10's "browser compatibility" is dev-tools diagnosis
  # in one browser, not a multi-browser comparison — see
  # planning/CURRICULUM_MAP.md for the current state of every code.
  - code: WA-LO1
    title: "The development of HTML and CSS, through the versions of each standard"
    strand: web-history
  - code: WA-LO2
    title: "The use, purpose and attributes of a range of HTML tags, and how browsers render them"
    strand: html-tags
  - code: WA-LO3
    title: "Explore available HTML and CSS editors and development tools (the descriptor's own contrast is a WYSIWYG editor against a text editor; dewlab explores its own in-browser site editor against a plain-text editor instead)"
    strand: tooling
  - code: WA-LO4
    title: "The principles of good website design: target audience, site objectives, navigation, structure, interface and access speed"
    strand: design-principles
  - code: WA-LO5
    title: "Investigate available web authoring tools, including desktop publishing programs and website management systems (the descriptor's own examples — Dreamweaver, Photoshop, Joomla, WordPress — are commercial GUI tools; dewlab discusses GitHub Pages, WordPress and two modern single-page builders against the hand-written HTML and CSS this course actually teaches)"
    strand: tooling
  - code: WA-LO6
    title: "Keep evidence of a web authoring project: its own research, requirements, and an evaluation of the finished site"
    strand: process
  - code: WA-LO7
    title: "Plan a design and user interface for a specified website, documenting each stage of the process (the descriptor's own outcome also has the learner selecting an authoring tool; dewlab's own tool is a given, not a choice)"
    strand: design-principles
  - code: WA-LO8
    title: "Use HTML tags to build a standards-conformant page or site to a given design"
    strand: html-tags
  - code: WA-LO9
    title: "Use CSS to style a standards-conformant page or site to a given design"
    strand: css
  - code: WA-LO10
    title: "Test a website's functioning and fix any issues found (the descriptor's own outcome also names cross-browser testing; dewlab teaches diagnosis with a single browser's own developer tools instead)"
    strand: testing
  - code: WA-LO11
    title: "Recommend how a website should be upgraded, maintained and tested in future"
    strand: process
  - code: WA-LO12
    title: "Use HTML and CSS code generators and judge how well they work (dewlab teaches HTML and CSS by hand instead of a generator — not yet covered by anything in dewlab)"
    strand: tooling
  - code: WA-LO13
    title: "Work independently to design, build and publish webpages, without needing an ISP's own hosting (dewlab's own equivalent of the descriptor's own phrase is GitHub Pages, free and independent of any commercial host)"
    strand: independence
  - code: WA-LO14
    title: "Apply the principles of good website design when building a real page or site"
    strand: design-principles
