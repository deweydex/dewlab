    strand: geometry
  - code: MIT-1.3
    title: "Volume and surface area: cube, cylinder, cone, sphere"
    strand: geometry
  - code: MIT-1.4
    title: "Binary and hexadecimal arithmetic and conversion"
    strand: number
  - code: MIT-1.5
    title: "Distinguish an expression from an equation"
    strand: algebra
  - code: MIT-1.6
    title: "Evaluate, expand and simplify expressions"
    strand: algebra
  - code: MIT-1.7
    title: "Transpose formulae; operate on rational algebraic expressions"
    strand: algebra
  - code: MIT-1.8
    title: "Multiply linear expressions into quadratics and cubics"
    strand: algebra
  - code: MIT-1.9
    title: "Factor quadratics by inspection and solve them"
    strand: algebra
  - code: MIT-1.10
    title: "Solve quadratics, including complex roots"
    strand: algebra
  - code: MIT-1.11
    title: "Solve linear inequalities"
    strand: algebra
  - code: MIT-1.12
    title: "Simultaneous equations in two and three unknowns"
    strand: algebra

  # ------------------------------------------------- MIT 2: sets & boolean
  - code: MIT-2.1
    title: "Set language: N, Z, Q, R, C, the empty set; finite, infinite, cardinality"
    strand: sets
  - code: MIT-2.2
    title: "Set operations: union, intersection, complement, symmetric difference, Cartesian product, power set"
    strand: sets
  - code: MIT-2.3
