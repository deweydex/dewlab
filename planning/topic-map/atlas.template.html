<title>dewlab Atlas</title>
<style>
:root {
  --sea: #e3ebee;
  --sea-line: #d2dde2;
  --paper: #fdfcfa;
  --ink: #1a1a1a;
  --navy: #1b2a4a;
  --town: #1b2a4a;
  --orange: #b8541a;
  --orange-soft: rgba(184, 84, 26, 0.18);
  --muted: #5f6b7a;
  --rule: #ddd6ca;
  --coast: #8199a6;
  --road: rgba(27, 42, 74, 0.28);
  --road-strong: rgba(27, 42, 74, 0.8);
  --ring: rgba(27, 42, 74, 0.13);
  --visited: #2c7a4b;
  --halo: rgba(253, 252, 250, 0.92);
  --shadow: rgba(27, 42, 74, 0.16);
  --land-s: 44%;
  --land-l: 85%;
  --plains: #eff0d9;
  --county-line: rgba(27, 42, 74, 0.26);
  --border-line: rgba(27, 42, 74, 0.5);
  --terrain: rgba(27, 42, 74, 0.2);
  --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --mono: "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --sea: #0f151c; --sea-line: #18212b; --paper: #161b23; --ink: #e6e3dd;
    --navy: #b9c8e6; --town: #e3e9f5; --orange: #e0803f; --orange-soft: rgba(224, 128, 63, 0.22);
    --muted: #98a2b3; --rule: #2a3140; --coast: #4f6676; --road: rgba(210, 222, 245, 0.22);
    --road-strong: rgba(225, 233, 248, 0.85); --ring: rgba(210, 222, 245, 0.10); --visited: #5cc488;
    --halo: rgba(22, 27, 35, 0.9); --shadow: rgba(0, 0, 0, 0.45);
    --land-s: 20%; --land-l: 23%; --plains: #2c2f23; --county-line: rgba(225, 233, 248, 0.22); --border-line: rgba(225, 233, 248, 0.45); --terrain: rgba(225, 233, 248, 0.14);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --sea: #0f151c; --sea-line: #18212b; --paper: #161b23; --ink: #e6e3dd;
  --navy: #b9c8e6; --town: #e3e9f5; --orange: #e0803f; --orange-soft: rgba(224, 128, 63, 0.22);
  --muted: #98a2b3; --rule: #2a3140; --coast: #4f6676; --road: rgba(210, 222, 245, 0.22);
  --road-strong: rgba(225, 233, 248, 0.85); --ring: rgba(210, 222, 245, 0.10); --visited: #5cc488;
  --halo: rgba(22, 27, 35, 0.9); --shadow: rgba(0, 0, 0, 0.45);
  --land-s: 20%; --land-l: 23%; --plains: #2c2f23; --county-line: rgba(225, 233, 248, 0.22); --border-line: rgba(225, 233, 248, 0.45); --terrain: rgba(225, 233, 248, 0.14);
}
html, body { height: 100%; }
body { background: var(--sea); color: var(--ink); font-family: var(--serif); overflow: hidden; }
#app { position: relative; height: 100%; overflow: hidden; }
#stage { position: absolute; inset: 0; touch-action: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#land { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#overlay { position: absolute; inset: 0; pointer-events: none; }

.coast { fill: none; stroke: var(--coast); stroke-width: 2.2; }
.coast-fill { fill: var(--paper); }
.land { fill-rule: evenodd; stroke: none; }
.plains { fill: var(--plains); fill-rule: evenodd; }
.county { fill-rule: evenodd; stroke: var(--county-line); stroke-width: 1; stroke-dasharray: 2 4; }
.border { fill: none; stroke: var(--border-line); stroke-width: 1.5; stroke-dasharray: 7 4; }
.plains-label { font-style: italic; letter-spacing: .18em; }
.terrain-mark { fill: none; stroke: var(--terrain); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.wave { fill: none; stroke: var(--coast); stroke-width: 1.3; stroke-linecap: round; opacity: .5; }
.bridge-casing { fill: none; stroke: var(--coast); stroke-width: 10; }
.bridge-deck { fill: none; stroke: var(--paper); stroke-width: 6; }
.bridge-planks { fill: none; stroke: var(--coast); stroke-width: 6; stroke-dasharray: 1.5 5; opacity: .75; }
.road { fill: none; stroke: var(--road); stroke-width: 1.2; transition: opacity .2s; stroke-linejoin: round; }
.road.bridge { stroke: var(--orange); stroke-dasharray: 6 5; opacity: .75; }
#app[data-lod="0"] .road, #app[data-lod="1"] .road { opacity: 0; }
#app[data-lod="2"] .road.bridge { opacity: .3; }
#app.no-roads .road { opacity: 0 !important; }
.road.lit-in { stroke: var(--road-strong); stroke-width: 2.4; opacity: 1 !important; stroke-dasharray: none; }
.road.lit-out { stroke: var(--orange); stroke-width: 2.4; opacity: 1 !important; stroke-dasharray: none; }
.route-casing { fill: none; stroke: var(--paper); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
.route { fill: none; stroke: var(--orange); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
.line-casing { fill: none; stroke: var(--paper); stroke-width: 8; stroke-linejoin: round; stroke-linecap: round; opacity: .9; }
.line { fill: none; stroke: var(--navy); stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; opacity: .85; }

/* towns are buttons laid over the drawing so they stay the same size at any zoom */
.town {
  position: absolute; left: 0; top: 0; pointer-events: auto;
  border: 0; background: none; padding: 0; margin: 0; color: var(--ink);
  font: inherit; cursor: pointer; display: block; width: 0; height: 0;
}
.town .dot {
  position: absolute; left: 0; top: 0; width: var(--d); height: var(--d);
  transform: translate(-50%, -50%); border-radius: 50%;
  background: var(--town); border: 2px solid var(--paper); box-sizing: content-box;
}
.town[data-state="planned"] .dot { background: var(--paper); border: 2px dashed var(--town); }
.town.visited .dot { background: var(--visited); }
.town .name {
  position: absolute; left: 0; top: calc(var(--d) / 2 + 4px); transform: translateX(-50%);
  white-space: nowrap; font-size: 12.5px; line-height: 1.2; color: var(--ink);
  text-shadow: 0 0 3px var(--halo), 0 0 3px var(--halo), 0 0 6px var(--halo);
}
.town.hide-label .name { visibility: hidden; }
.town.selected .dot { outline: 3px solid var(--orange); outline-offset: 2px; }
.town.selected .name, .town.on-route .name { font-weight: bold; visibility: visible; }
.town.on-route .dot { box-shadow: 0 0 0 4px var(--orange-soft); }
.town:focus-visible { outline: none; }
.town:focus-visible .dot { outline: 3px solid var(--orange); outline-offset: 3px; }
.town .stop {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -150%);
  font: 600 10px/1 var(--mono); background: var(--orange); color: var(--paper);
  border-radius: 8px; padding: 3px 5px; margin-top: calc(var(--d) / -2 - 4px);
}
.region-label {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); z-index: 1;
  font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--navy);
  width: max-content; max-width: 10em; text-align: center; line-height: 1.35;
  opacity: .55; transition: opacity .25s;
  text-shadow: 0 0 4px var(--halo);
}
#app[data-lod="1"] .region-label { font-size: 15px; opacity: .8; }
.region-label small { display: block; font-size: 10.5px; letter-spacing: .12em; text-transform: none; font-style: italic; margin-top: 2px; }
#app[data-lod="0"] .region-label { opacity: 0; }
#app[data-lod="2"] .region-label { opacity: .3; }
.continent-label {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; z-index: 1;
  background: none; border: 0; padding: 2px 4px; font: inherit; font-size: 18px;
  letter-spacing: .3em; text-transform: uppercase; color: var(--navy);
  width: max-content; max-width: 12em; text-align: center; line-height: 1.3;
  text-shadow: 0 0 5px var(--halo), 0 0 5px var(--halo), 0 0 9px var(--halo);
  transition: opacity .25s, visibility .25s;
}
.continent-label small { display: block; font-size: 11.5px; letter-spacing: .12em; text-transform: none; font-style: italic; margin-top: 3px; }
.continent-label:hover { color: var(--orange); }
.continent-label:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
#app:not([data-lod="0"]) .continent-label { opacity: 0; visibility: hidden; }
#app[data-lod="0"] .town .dot { transform: translate(-50%, -50%) scale(.65); }
.cont-head { display: flex; gap: 8px; align-items: flex-start; margin: 16px 0 4px !important; }
.cont-head .swatch { margin-top: 6px; flex: none; }
.cont-head button { background: none; border: 0; padding: 0; font: 16px var(--serif); color: var(--navy); cursor: pointer; text-align: left; }
.cont-head button:hover { color: var(--orange); }
.cont-head em { display: block; font-size: 13px; line-height: 1.4; color: var(--muted); }
#app[data-lod="3"] .region-label, #app[data-lod="4"] .region-label { opacity: 0; }
.district-label {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
  font-size: 12.5px; font-style: italic; letter-spacing: .06em; color: var(--muted);
  white-space: nowrap; opacity: 0; transition: opacity .25s; text-shadow: 0 0 4px var(--halo), 0 0 4px var(--halo);
}
#app[data-lod="2"] .district-label { opacity: .95; }
#app[data-lod="3"] .district-label { opacity: .55; }
.landmark {
  position: absolute; left: 0; top: 0; pointer-events: auto; border: 0; background: none; padding: 0;
  font: inherit; color: var(--navy); cursor: pointer; width: 0; height: 0; opacity: 0; transition: opacity .25s;
}
.landmark .glyph {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%) rotate(45deg);
  width: 9px; height: 9px; background: var(--paper); border: 2px solid var(--orange);
}
.landmark .name {
  position: absolute; left: 10px; top: 0; transform: translateY(-50%); white-space: nowrap;
  font-size: 11.5px; font-style: italic; color: var(--muted); visibility: hidden;
  text-shadow: 0 0 3px var(--halo), 0 0 3px var(--halo);
}
#app[data-lod="2"] .landmark, #app[data-lod="3"] .landmark, #app[data-lod="4"] .landmark { opacity: 1; }
#app[data-lod="4"] .landmark .name, .landmark.lit .name { visibility: visible; }
.landmark:focus-visible .glyph { outline: 3px solid var(--orange); outline-offset: 3px; }
.streets {
  position: absolute; left: 0; top: 0; pointer-events: auto; list-style: none; margin: 0; padding: 6px 0 0 14px;
  border-left: 2px solid var(--orange); max-width: 250px; display: none;
}
#app[data-lod="3"] .streets.on, #app[data-lod="4"] .streets.on { display: block; }
.streets li { margin: 0 0 3px; font-size: 12px; line-height: 1.3; position: relative; }
.streets li::before { content: ""; position: absolute; left: -19px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); border: 2px solid var(--paper); }
.streets li.side::before { background: var(--paper); border: 2px solid var(--orange); }
.streets a { color: var(--ink); text-decoration: none; background: var(--halo); padding: 1px 4px; border-radius: 3px; }
.streets a:hover { color: var(--orange); }
.streets small { font: 9.5px var(--mono); color: var(--muted); letter-spacing: .05em; text-transform: uppercase; margin-left: 4px; }
.street-list { list-style: none; padding: 0 !important; display: grid; gap: 6px; counter-reset: st; }
.street-list li { margin: 0 !important; }
.street-list a { display: grid; grid-template-columns: 22px 1fr; gap: 8px; text-decoration: none; color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; }
.street-list a:hover { border-color: var(--orange); }
.street-list .n { font: 600 11px/20px var(--mono); text-align: center; border-radius: 10px; height: 20px; background: var(--orange); color: var(--paper); }
.street-list .side .n { background: none; color: var(--orange); border: 1.5px solid var(--orange); box-sizing: border-box; }
.street-list b { display: block; font-weight: normal; font-size: 14.5px; line-height: 1.35; color: var(--orange); }
.street-list em { display: block; font-style: normal; font-size: 13px; color: var(--ink); }
.street-list small { display: block; font: 10.5px var(--mono); color: var(--muted); letter-spacing: .04em; margin-top: 3px; }
.lore-intro { color: var(--muted); }
.key i svg { width: 100%; height: 100%; display: block; }
.lore { font-size: 14px !important; line-height: 1.5; color: var(--muted); margin: 2px 0 8px 18px !important; }
#panel > .body > .lore { margin-left: 0 !important; }
.badge { font: 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--rule); border-radius: 4px; padding: 1px 5px; color: var(--muted); }
.regions details details { margin-left: 18px; }
.regions summary.country { align-items: flex-start; padding: 7px 0; }
.regions summary.country .swatch { margin-top: 5px; flex: none; }
.cname { display: flex; flex-direction: column; gap: 2px; }
.cname em { font-size: 13px; line-height: 1.4; color: var(--muted); }
.regions summary.country small { padding-top: 3px; }
.regions details details summary { font-size: 14px; color: var(--ink); }
.start-mark {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
  background: none; border: 0; padding: 0; color: var(--orange);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font: 10.5px/1.25 var(--mono); letter-spacing: .08em; text-transform: uppercase;
  text-align: center; white-space: nowrap;
  text-shadow: 0 0 4px var(--halo), 0 0 4px var(--halo);
}
.start-mark svg { width: 20px; height: 24px; filter: drop-shadow(0 0 2px var(--halo)); }
.start-mark:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }

/* chrome */
.card {
  background: var(--paper); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: 0 6px 22px var(--shadow);
}
#top {
  position: absolute; left: 16px; top: calc(12px + env(safe-area-inset-top, 0px));
  width: min(360px, calc(100% - 32px)); padding: 12px 14px 12px; z-index: 5;
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.brand b { font-size: 19px; color: var(--navy); }
.brand b::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--orange); margin-left: 3px; vertical-align: 2px; }
.brand span { font: 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.brand .proto { margin-left: auto; font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--orange); border: 1px solid currentColor; border-radius: 4px; padding: 2px 5px; }
#q {
  width: 100%; box-sizing: border-box; font: 15px var(--serif); color: var(--ink);
  background: var(--sea); border: 1px solid var(--rule); border-radius: 7px; padding: 8px 10px;
}
#q:focus-visible { outline: 2px solid var(--orange); outline-offset: 1px; }
#results { list-style: none; margin: 6px 0 0; padding: 0; max-height: 40vh; overflow: auto; }
#results li button {
  width: 100%; text-align: left; background: none; border: 0; padding: 6px 4px; font: 14px var(--serif);
  color: var(--ink); cursor: pointer; border-radius: 5px; display: flex; justify-content: space-between; gap: 8px;
}
#results li button:hover, #results li button:focus-visible { background: var(--sea); outline: none; }
#results small { font: 10.5px var(--mono); color: var(--muted); letter-spacing: .05em; white-space: nowrap; }

#controls {
  position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
}
.zoom { display: flex; }
.zoom button, .chip {
  font: 12px var(--mono); color: var(--ink); background: var(--paper); border: 1px solid var(--rule);
  padding: 7px 11px; cursor: pointer; min-height: 34px;
}
.zoom button:first-child { border-radius: 8px 0 0 8px; }
.zoom button:last-child { border-radius: 0 8px 8px 0; }
.zoom button + button { border-left: 0; }
.layers { padding: 10px 12px; display: grid; gap: 8px; width: 250px; }
.layers h3 { margin: 0; font: 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: normal; }
.layers label { display: flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
.layers select { font: 13px var(--serif); color: var(--ink); background: var(--sea); border: 1px solid var(--rule); border-radius: 6px; padding: 6px; width: 100%; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border-radius: 999px; font-size: 11.5px; padding: 5px 10px; min-height: 0; }
.chip:hover, .zoom button:hover { border-color: var(--orange); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

#panel {
  position: absolute; right: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 380px; z-index: 6; display: flex; flex-direction: column; overflow: hidden;
}
#panel .body { overflow: auto; padding: 18px 20px 22px; }
#panel h2 { font-size: 23px; line-height: 1.2; margin: 4px 0 10px; color: var(--navy); text-wrap: balance; font-weight: normal; }
#panel h3 { font: 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; font-weight: normal; }
#panel p { font-size: 15.5px; line-height: 1.55; margin: 0 0 10px; }
#panel ul { margin: 0; padding-left: 18px; }
#panel li { font-size: 14.5px; line-height: 1.5; margin-bottom: 6px; }
.eyebrow { font: 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; border: 1px solid var(--rule); }
.close { float: right; background: none; border: 0; font: 20px var(--serif); color: var(--muted); cursor: pointer; padding: 0 2px; line-height: 1; }
.ways { list-style: none; padding: 0 !important; display: grid; gap: 8px; }
.ways li { margin: 0 !important; }
.ways a { display: block; text-decoration: none; color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 11px; }
.ways a:hover { border-color: var(--orange); }
.ways a b { display: block; font-weight: normal; font-size: 14.5px; line-height: 1.35; color: var(--orange); }
.ways a small { display: block; font: 10.5px var(--mono); color: var(--muted); letter-spacing: .04em; margin-top: 4px; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.links button { font: 13.5px var(--serif); background: var(--sea); color: var(--ink); border: 1px solid var(--rule); border-radius: 999px; padding: 5px 11px; cursor: pointer; }
.links button:hover { border-color: var(--orange); }
.links button.done { border-color: var(--visited); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 4px; }
.primary { font: 13px var(--mono); background: var(--orange); color: var(--paper); border: 0; border-radius: 8px; padding: 9px 13px; cursor: pointer; }
.secondary { font: 13px var(--mono); background: none; color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 13px; cursor: pointer; }
.steps { list-style: none; padding: 0 !important; counter-reset: s; display: grid; gap: 8px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 8px; margin: 0 !important; }
.steps li::before { content: counter(s); font: 600 11px/22px var(--mono); text-align: center; background: var(--orange); color: var(--paper); border-radius: 11px; height: 22px; }
.steps button { background: none; border: 0; padding: 0; text-align: left; font: 15px var(--serif); color: var(--ink); cursor: pointer; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.steps small { display: block; font: 10.5px var(--mono); color: var(--muted); margin-top: 2px; }
.note { font-size: 13.5px !important; color: var(--muted); border-left: 3px solid var(--orange); padding-left: 10px; }
.regions { list-style: none; padding: 0 !important; }
.regions > li { margin: 0 0 4px !important; }
.regions details summary { cursor: pointer; font-size: 15px; padding: 5px 0; display: flex; align-items: center; gap: 8px; }
.regions details summary small { margin-left: auto; font: 10.5px var(--mono); color: var(--muted); }
.regions .links { padding: 4px 0 10px 18px; }
.key { display: grid; grid-template-columns: 22px 1fr; gap: 6px 8px; align-items: center; font-size: 13.5px; }
.key i { display: block; margin: auto; }
.num { font-variant-numeric: tabular-nums; }

@media (max-width: 1100px) {
  .continent-label { font-size: 14px; letter-spacing: .2em; max-width: 10em; }
  .continent-label small { font-size: 10.5px; letter-spacing: .08em; }
}
@media (max-width: 760px) {
  #top { padding: 10px 12px; }
  .continent-label { font-size: 12.5px; letter-spacing: .16em; max-width: 9em; }
  .continent-label small { font-size: 10px; letter-spacing: .06em; }
  .layers { width: auto; }
  #controls { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 12px; }
  #controls .layers { display: none; }
  #controls.open .layers { display: grid; }
  #panel { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 52%; border-radius: 14px 14px 0 0; }
  #panel.collapsed { max-height: 100px; }
  #panel.collapsed .body { overflow: hidden; }
  #panel .body { padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
  #controls { bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
  /* The bar is a tall tap target with a short line drawn on it. It must not
     shrink: the panel is a flex column, and a 4px button squeezed to under 1px. */
  .grab { display: block; flex: none; position: relative; width: 100%; height: 28px; background: none; border: 0; padding: 0; cursor: pointer; }
  .grab::after { content: ""; position: absolute; left: 50%; top: 11px; width: 40px; height: 4px; border-radius: 2px; background: var(--rule); transform: translateX(-50%); }
}
@media (min-width: 761px) { .grab, .layers-toggle { display: none !important; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app" data-lod="1">
  <div id="stage">
    <svg id="land" aria-hidden="true"><g id="world"></g></svg>
    <div id="overlay"></div>
  </div>

  <div id="top" class="card">
    <div class="brand"><b>dewlab</b><span>Atlas</span></div>
    <label for="q" class="sr" style="position:absolute;left:-9999px">Find a town</label>
    <input id="q" type="search" placeholder="Find a town, like logarithms" autocomplete="off">
    <ul id="results" role="listbox" aria-label="Topics that match"></ul>
  </div>

  <div id="controls">
    <div class="zoom">
      <button type="button" id="zout" aria-label="Zoom out">−</button>
      <button type="button" id="zfit">whole map</button>
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" class="layers-toggle" id="ltoggle" aria-expanded="false">layers</button>
    </div>

      <h3>Layers</h3>

      <div>

    <div class="body" id="pbody"></div>
  </aside>
</div>

<script id="atlas-data" type="application/json">/*DATA*/</script>
<script>
(function () {
  "use strict";
  const data = JSON.parse(document.getElementById("atlas-data").textContent);
  const towns = data.towns;
  const byCode = new Map(towns.map((t) => [t.code, t]));
  data.regions.forEach((r, i) => { if (r.hue == null) r.hue = Math.round((30 + i * 137.508) % 360); r.full = r.fancy ? `${r.fancy} (${r.name})` : r.name; });
  const continents = data.continents || [];
  continents.forEach((c) => { c.full = c.fancy ? `${c.fancy} (${c.name})` : c.name; });
  const contById = new Map(continents.map((c) => [c.id, c]));
  const startLand = (continents.find((c) => c.kind === "start") || {}).id;
  // a county is a slightly lighter or darker shade of its country
  const SHADES = [0, 3.5, -3, 2, -4.5, 1.5, -1.5];
  const landColour = (r, shade) => `hsl(${r.hue} var(--land-s) calc(var(--land-l) + ${SHADES[(shade || 0) % SHADES.length]}%))`;
  const regionById = new Map(data.regions.map((r) => [r.id, r]));
  const districtById = new Map(data.districts.map((d) => [d.id, d]));
  const contColour = (c) => c.kind === "start" ? "var(--plains)" : `hsl(${c.hue} var(--land-s) var(--land-l))`;
  const landmarksAt = new Map(towns.map((t) => [t.code, []]));
  for (const lm of data.landmarks) for (const a of lm.at) landmarksAt.get(a).push(lm);
  const children = new Map(towns.map((t) => [t.code, []]));
  for (const t of towns) for (const n of t.needs) children.get(n).push(t.code);

  const app = document.getElementById("app");
  const stage = document.getElementById("stage");
  const svg = document.getElementById("land");
  const world = document.getElementById("world");
  const overlay = document.getElementById("overlay");
  const panel = document.getElementById("panel");
  const pbody = document.getElementById("pbody");

  // A new version of this page can arrive while an old one is still open, and
  // run its script in the same document. The older copy must let go of the
  // shared elements first, or two copies draw the map at once, each with its
  // own zoom.
  if (window.__atlasTeardown) window.__atlasTeardown();
  const life = new AbortController();
  const listen = (el, type, fn, opts) => el.addEventListener(type, fn, { ...(opts || {}), signal: life.signal });
  window.__atlasTeardown = () => { life.abort(); if (anim) cancelAnimationFrame(anim); };
  world.replaceChildren();
  overlay.replaceChildren();
  const NS = "http://www.w3.org/2000/svg";
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const view = { k: 0.3, x: 0, y: 0 };
  let selected = null;
  let route = [];
  let courseLine = null;
  let visited = new Set();
  try { visited = new Set(JSON.parse(localStorage.getItem("atlas:visited") || "[]")); } catch (e) {}
  function saveVisited() { try { localStorage.setItem("atlas:visited", JSON.stringify([...visited])); } catch (e) {} }

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  const depthWords = ["needs nothing first", "one step in", "two steps in", "three steps in", "four steps in", "five steps in", "six steps in", "seven steps in", "eight steps in"];

  // ---------- the drawing
  const [bx, by, bw, bh] = data.bounds;
  el("rect", { x: bx - 4000, y: by - 4000, width: bw + 8000, height: bh + 8000, fill: "var(--sea)" }, world);
  for (const [x, y] of data.waves || []) {
    el("path", { d: `M${x - 60} ${y}q30 -22 60 0t60 0`, class: "wave", "vector-effect": "non-scaling-stroke" }, world);
  }
  const defs = el("defs", {}, world);
  // a mountain country is drawn with small peaks and a forest with trees
  const TERRAIN = {
    mountains: [120, 100, "M14 70L34 38L54 70M62 96L78 70L94 96"],
    forest: [100, 100, "M16 40a10 10 0 1 0 20 0a10 10 0 1 0 -20 0M26 50V60M64 80a8 8 0 1 0 16 0a8 8 0 1 0 -16 0M72 88V96"],
  };
  for (const [name, [w, h, d]] of Object.entries(TERRAIN)) {
    const pat = el("pattern", { id: `terrain-${name}`, width: w, height: h, patternUnits: "userSpaceOnUse" }, defs);
    el("path", { d, class: "terrain-mark" }, pat);
  }
  el("path", { d: data.coast, class: "coast-fill" }, world);
  if (data.plains) el("path", { d: data.plains.land, class: "plains" }, world);
  for (const r of data.regions) el("path", { d: r.land, class: "land", style: `fill:${landColour(r, 0)}` }, world);
  for (const d of data.districts) {
    if (d.land) el("path", { d: d.land, class: "county", style: `fill:${landColour(regionById.get(d.region), d.shade)}`, "vector-effect": "non-scaling-stroke" }, world);
  }
  for (const r of data.regions) {
    if (TERRAIN[r.terrain]) el("path", { d: r.land, fill: `url(#terrain-${r.terrain})`, "fill-rule": "evenodd" }, world);
  }
  for (const r of data.regions) el("path", { d: r.land, class: "border", "vector-effect": "non-scaling-stroke" }, world);
  el("path", { d: data.coast, class: "coast", "vector-effect": "non-scaling-stroke" }, world);

  // A road between two continents crosses the sea by a bridge. Where two
  // continents have no bridge of their own, the road goes by way of the
  // starting island.
  const bridgeEnds = new Map();
  for (const b of data.bridges || []) {
    bridgeEnds.set(b.a + "|" + b.b, b.ends);
    bridgeEnds.set(b.b + "|" + b.a, [b.ends[1], b.ends[0]]);
  }
  function via(a, b) {
    const la = byCode.get(a).land, lb = byCode.get(b).land;
    if (la === lb) return [];
    const direct = bridgeEnds.get(la + "|" + lb);
    if (direct) return direct;
    const one = bridgeEnds.get(la + "|" + startLand), two = bridgeEnds.get(startLand + "|" + lb);
    return one && two ? [...one, ...two] : [];
  }
  function pathThrough(codes) {
    return codes.map((c, i) => {
      const t = byCode.get(c);
      const bridge = i ? via(codes[i - 1], c).map(([x, y]) => `L${x} ${y}`).join("") : "";
      return `${bridge}${i ? "L" : "M"}${t.x} ${t.y}`;
    }).join("");
  }
  const bridgeLayer = el("g", {}, world);
  for (const b of data.bridges || []) {
    const [[x1, y1], [x2, y2]] = b.ends;
    const d = `M${x1} ${y1}L${x2} ${y2}`;
    const g = el("g", {}, bridgeLayer);
    for (const cls of ["bridge-casing", "bridge-deck", "bridge-planks"]) el("path", { d, class: cls, "vector-effect": "non-scaling-stroke" }, g);
    const name = (id) => { const c = contById.get(id); return c ? c.fancy || c.name : id; };
    el("title", {}, g).textContent = `A bridge between ${name(b.a)} and ${name(b.b)}. ${b.count} road${b.count === 1 ? " crosses" : "s cross"} it.`;
  }

  const roadLayer = el("g", {}, world);
  const roads = [];
  for (const t of towns) {
    for (const n of t.needs) {
      const a = byCode.get(n);
      const mx = (a.x + t.x) / 2, my = (a.y + t.y) / 2;
      // bow each road a little, away from the centre, so parallel roads separate
      const len = Math.hypot(t.x - a.x, t.y - a.y) || 1;
      const nx = -(t.y - a.y) / len, ny = (t.x - a.x) / len;
      const side = (mx * nx + my * ny) > 0 ? 1 : -1;
      const bow = Math.min(60, len * 0.12) * side;
      const p = el("path", {
        d: via(n, t.code).length ? pathThrough([n, t.code]) : `M${a.x} ${a.y} Q${mx + nx * bow} ${my + ny * bow} ${t.x} ${t.y}`,
        class: "road" + (a.region !== t.region ? " bridge" : ""),
        "vector-effect": "non-scaling-stroke",
      }, roadLayer);
      roads.push({ from: n, to: t.code, node: p });
    }
  }
  const lineLayer = el("g", {}, world);
  const routeLayer = el("g", {}, world);

  // ---------- towns, region names, the start
  const regionLabels = data.regions.map((r) => {
    const d = document.createElement("div");
    d.className = "region-label";
    d.innerHTML = r.fancy ? `${esc(r.fancy)}<small>${esc(r.name)}</small>` : esc(r.name);
    overlay.appendChild(d);
    return { r, node: d };
  });
  if (data.plains) {
    const n = document.createElement("div");
    n.className = "region-label plains-label";
    n.textContent = "The Prerequisite Plains";
    overlay.appendChild(n);
    regionLabels.push({ r: { label: data.plains.label }, node: n });
  }
  const districtLabels = data.districts.map((d) => {
    const n = document.createElement("div");
    n.className = "district-label";
    n.textContent = d.name;
    overlay.appendChild(n);
    return { d, node: n };
  });
  const contLabels = continents.map((c) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "continent-label";
    b.innerHTML = c.fancy ? `${esc(c.fancy)}<small>${esc(c.name)}</small>` : esc(c.name);
    b.addEventListener("click", () => { if (!moved) showContinent(c); });
    overlay.appendChild(b);
    return { c, node: b };
  });
  const TOWER_SVG = '<svg viewBox="0 0 18 22" aria-hidden="true"><path d="M1 21V9h2V3h3v3h2V3h2v3h2V3h3v6h2v12z" fill="currentColor" stroke="var(--paper)" stroke-width="1.2" stroke-linejoin="round"/><path d="M7.5 21v-4.5a1.5 1.5 0 0 1 3 0V21z" fill="var(--paper)"/></svg>';
  const tower = data.tower || {};
  const start = document.createElement("button");
  start.type = "button";
  start.className = "start-mark";
  start.innerHTML = `${TOWER_SVG}<span>Tower of<br>Unknowing</span>`;
  start.setAttribute("aria-label", "The Tower of Unknowing, where every traveller starts");
  start.addEventListener("click", () => { if (!moved) showTower(); });
  overlay.appendChild(start);
  const landmarkNodes = data.landmarks.filter((lm) => !lm.tower).map((lm) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "landmark";
    b.innerHTML = `<span class="glyph"></span><span class="name">${esc(lm.title)}</span>`;
    b.setAttribute("aria-label", `${lm.title}, a ${lm.kind}`);
    b.addEventListener("click", () => { if (!moved) showLandmark(lm); });
    overlay.appendChild(b);
    return { lm, b };
  });
  const streets = document.createElement("ol");
  streets.className = "streets";
  streets.setAttribute("aria-label", "Pages in this topic");
  overlay.appendChild(streets);

  const maxW = Math.max(...towns.map((t) => t.weight));
  const townNodes = towns.map((t) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "town";
    b.dataset.code = t.code;
    b.dataset.state = t.state;
    b.dataset.agreement = t.agreement || "";
    const d = 7 + Math.sqrt(t.weight / maxW) * 11;
    b.style.setProperty("--d", d.toFixed(1) + "px");
    b.innerHTML = `<span class="dot"></span><span class="name">${esc(t.name)}</span>`;
    b.setAttribute("aria-label", `${t.name}. ${districtById.get(t.district).name}, ${regionById.get(t.region).full}, ${depthWords[t.tier]}.`);
    b.addEventListener("click", (ev) => { if (moved) { ev.preventDefault(); return; } select(t.code, true); });
    overlay.appendChild(b);
    return { t, b, d, w: 0 };
  });
  requestAnimationFrame(() => { for (const n of townNodes) n.w = n.b.querySelector(".name").offsetWidth; render(); });

  // ---------- view
  // five levels: continents, countries, districts, towns, and a town's own
  // streets. The levels are set against the scale that shows the whole map,
  // so the first view is always continent names alone, whatever its size.
  let baseK = null;
  function lodFor(k) {
    const b = baseK || 0.2;
    return k < b * 1.4 ? 0 : k < b * 2.5 ? 1 : k < b * 4.4 ? 2 : k < b * 8 ? 3 : 4;
  }
  // At the widest view each continent's name goes in the sea beside its coast.
  // How big a name is depends on the screen, so the place is chosen here: of
  // the places round the coast, take the one that covers the fewest towns,
  // bridges, other names and controls, and stays inside the view.
  const bridgeDots = [];
  for (const b of data.bridges || []) {
    const [[x1, y1], [x2, y2]] = b.ends;
    for (let i = 0; i <= 8; i++) bridgeDots.push([x1 + (x2 - x1) * i / 8, y1 + (y2 - y1) * i / 8]);
  }
  const landSize = new Map(continents.map((c) => [c.id, towns.filter((t) => t.land === c.id).length]));
  function placeContinentNames(at) {
    const vb = viewportBox();
    const grow = (r, m) => [r[0] - m, r[1] - m, r[2] + m, r[3] + m];
    const inside = (r, [x, y]) => x > r[0] && x < r[2] && y > r[1] && y < r[3];
    const area = (a, b) => Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])) * Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
    const boxOf = (id) => { const r = document.getElementById(id).getBoundingClientRect(), o = stage.getBoundingClientRect(); return [r.left - o.left, r.top - o.top, r.right - o.left, r.bottom - o.top]; };
    const chrome = [boxOf("top"), boxOf("controls")];
    const townDots = towns.map((t) => at(t.x, t.y));
    const barDots = bridgeDots.map(([x, y]) => at(x, y));
    const shores = continents.map((c) => c.shore.map(([x, y]) => at(x, y)));
    const centres = continents.map((c) => {
      const mine = towns.filter((t) => t.land === c.id).map((t) => at(t.x, t.y));
      return [mine.reduce((a, q) => a + q[0], 0) / mine.length, mine.reduce((a, q) => a + q[1], 0) / mine.length];
    });
    const mid = [centres.reduce((a, q) => a + q[0], 0) / centres.length, centres.reduce((a, q) => a + q[1], 0) / centres.length];
    const placed = [], out = [];
    const order = continents.map((c, i) => i).sort((a, b) => landSize.get(continents[a].id) - landSize.get(continents[b].id));
    for (const i of order) {
      const node = contLabels[i].node, w = node.offsetWidth, h = node.offsetHeight;
      const away = [centres[i][0] - mid[0], centres[i][1] - mid[1]];
      const awayLen = Math.hypot(away[0], away[1]) || 1;
      let best = null;
      shores[i].forEach((s0, k) => {
        const a = 2 * Math.PI * k / shores[i].length, dx = Math.cos(a), dy = Math.sin(a);
        const reach = Math.min(w / 2 / Math.max(1e-6, Math.abs(dx)), h / 2 / Math.max(1e-6, Math.abs(dy)));
        const x = s0[0] + dx * (reach + 8), y = s0[1] + dy * (reach + 8);
        const r = [x - w / 2, y - h / 2, x + w / 2, y + h / 2], pad = grow(r, 6);
        let cost = 4 * (1 - (dx * away[0] + dy * away[1]) / awayLen);
        cost += 40 * townDots.filter((q) => inside(pad, q)).length;
        cost += 25 * barDots.filter((q) => inside(pad, q)).length;
        shores.forEach((sh, j) => { if (j !== i) cost += 30 * sh.filter((q) => inside(pad, q)).length; });
        for (const c of chrome) cost += area(r, c) > 0 ? 60 : 0;
        for (const q of placed) { const o = area(r, q); if (o > 0) cost += 150 + o / 40; }
        // a name cut off by the edge or the panel is worse than one over a town
        cost += 2 * (Math.max(0, vb.left + 6 - r[0]) + Math.max(0, r[2] - (vb.right - 6)) + Math.max(0, vb.top + 6 - r[1]) + Math.max(0, r[3] - (vb.bottom - 6)));
        if (!best || cost < best.cost) best = { cost, x, y, r };
      });
      placed.push(best.r);
      node.style.transform = `translate(${best.x}px, ${best.y}px) translate(-50%, -50%)`;
      out.push({ node, x: best.x, y: best.y, w, h });
    }
    return out;
  }
  function render() {
    world.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`);
    const lod = lodFor(view.k);
    app.dataset.lod = lod;
    const W = stage.clientWidth, H = stage.clientHeight;
    const at = (x, y) => [x * view.k + view.x, y * view.k + view.y];
    // Region names are wide, and two narrow countries side by side can put
    // one name over the other. Names that overlap push each other apart.
    const relax = (list) => {
      for (let pass = 0; pass < 8; pass++) {
        for (let i = 0; i < list.length; i++) {
          for (let j = i + 1; j < list.length; j++) {
            const a = list[i], b = list[j];
            const ox = (a.w + b.w) / 2 + 8 - Math.abs(a.x - b.x);
            const oy = (a.h + b.h) / 2 + 4 - Math.abs(a.y - b.y);
            if (ox > 0 && oy > 0) {
              const dir = a.y <= b.y ? -1 : 1;
              a.y += dir * oy / 2;
              b.y -= dir * oy / 2;
            }
          }
        }
      }
      for (const l of list) l.node.style.transform = `translate(${l.x}px, ${l.y}px) translate(-50%, -50%)`;
      return list;
    };
    const measure = (node, [x, y]) => { const [sx, sy] = at(x, y); return { node, x: sx, y: sy, w: node.offsetWidth, h: node.offsetHeight }; };
    const rl = relax(regionLabels.map(({ r, node }) => measure(node, r.label)));
    // continent names are only placed while they show, at the widest view
    const cl = lod === 0 ? placeContinentNames(at) : [];
    for (const { d, node } of districtLabels) {
      const [sx, sy] = at(d.label[0], d.label[1]);
      node.style.transform = `translate(${sx}px, ${sy}px) translate(-50%, -50%)`;
    }
    for (const { lm, b } of landmarkNodes) {
      const [sx, sy] = at(lm.x, lm.y);
      b.style.transform = `translate(${sx}px, ${sy}px)`;
      b.classList.toggle("lit", selected != null && lm.at.includes(selected));
    }
    start.style.transform = `translate(${view.x}px, ${view.y}px) translate(-50%, -50%)`;
    // labels: most important first, skip any that would collide (as a street map does)
    const placed = [];
    const obstacle = (node, sx, sy) => {
      const w = node.offsetWidth, h = node.offsetHeight;
      placed.push([sx - w / 2 - 4, sy - h / 2 - 2, sx + w / 2 + 4, sy + h / 2 + 2]);
    };
    // continent names go down first at the widest view, then country names,
    // then district names
    if (lod === 0) for (const l of cl) obstacle(l.node, l.x, l.y);
    if (lod === 1) for (const l of rl) obstacle(l.node, l.x, l.y);
    if (lod === 2) for (const { d, node } of districtLabels) obstacle(node, ...at(d.label[0], d.label[1]));
    if (lod >= 3 && selected) {
      const t = byCode.get(selected);
      const [sx, sy] = at(t.x, t.y);
      streets.style.transform = `translate(${sx + 10}px, ${sy + 30}px)`;
      placed.push([sx, sy + 20, sx + streets.offsetWidth + 20, sy + 30 + streets.offsetHeight]);
    }
    const order = townNodes.slice().sort((a, b) => prio(b) - prio(a));
    const minWeight = lod <= 1 ? 1e9 : lod === 2 ? 4 : 0;
    for (const n of order) {
      const sx = n.t.x * view.k + view.x, sy = n.t.y * view.k + view.y;
      n.b.style.transform = `translate(${sx}px, ${sy}px)`;
      const off = sx < -200 || sy < -100 || sx > W + 200 || sy > H + 100;
      n.b.style.visibility = off ? "hidden" : "";
      if (off) continue;
      const forced = n.t.code === selected || route.includes(n.t.code);
      let show = forced || n.t.weight >= minWeight || (lod >= 2 && courseLine && courseLine.includes(n.t.code));
      const rect = [sx - n.w / 2 - 3, sy + n.d / 2 + 2, sx + n.w / 2 + 3, sy + n.d / 2 + 20];
      if (show && !forced) {
        for (const p of placed) if (rect[0] < p[2] && rect[2] > p[0] && rect[1] < p[3] && rect[3] > p[1]) { show = false; break; }
      }
      if (show) placed.push(rect);
      n.b.classList.toggle("hide-label", !show);
    }
  }
  function prio(n) {
    let p = n.t.weight;
    if (n.t.code === selected) p += 1000;
    if (route.includes(n.t.code)) p += 500;
    if (visited.has(n.t.code)) p += 3;
    return p;
  }
  function viewportBox() {
    const W = stage.clientWidth, H = stage.clientHeight;
    const wide = W > 760;
    // on a phone the panel opens over the lower half, or shrinks to a bar
    const shut = panel.classList.contains("collapsed");
    return { left: wide ? 16 : 0, top: wide ? 0 : 110, right: wide ? W - 412 : W, bottom: wide ? H : shut ? H - 160 : H * 0.5 };

  });
  document.getElementById("grab").onclick = () => panel.classList.toggle("collapsed");
  const lt = document.getElementById("ltoggle");
  lt.onclick = () => { const c = document.getElementById("controls"); c.classList.toggle("open"); lt.setAttribute("aria-expanded", c.classList.contains("open")); };

  // ---------- layers
  document.getElementById("roads").onchange = (e) => app.classList.toggle("no-roads", !e.target.checked);
  const courseSel = document.getElementById("course");
  for (const c of data.courses) {
    const o = document.createElement("option");
    o.value = c.id;
    o.textContent = c.path.length ? `${c.title} (${c.path.length} towns)` : c.title;
    courseSel.appendChild(o);
  }
  courseSel.onchange = () => {
    drawCourse(courseSel.value);
    const c = data.courses.find((x) => x.id === courseSel.value);
    if (c && !c.path.length) {
      select(null);
      pbody.insertAdjacentHTML("afterbegin", `<p class="note">The road for <b>${esc(c.title)}</b> is not on the map yet.</p>`);
    } else if (c) {
      const xs = c.path.map((x) => byCode.get(x).x), ys = c.path.map((x) => byCode.get(x).y);
      fitTo(Math.min(...xs) - 60, Math.min(...ys) - 60, Math.max(...xs) + 60, Math.max(...ys) + 60, true, (baseK || 0.2) * 5);
    }
    render();
  };

  // ---------- search
  const q = document.getElementById("q");
  const results = document.getElementById("results");
  listen(q, "input", () => {
    const s = q.value.trim().toLowerCase();
    if (!s) { results.replaceChildren(); return; }
    const words = s.split(/\s+/);
    const hits = towns.map((t) => {
      const name = t.name.toLowerCase();
      const hay = [t.name, t.plain, districtById.get(t.district).name, ...t.steps.map((x) => x.title + " " + (x.section || ""))].join(" ").toLowerCase();
      if (!words.every((w) => hay.includes(w))) return null;
      return { t, score: (name.startsWith(s) ? 3 : 0) + (name.includes(s) ? 2 : 0) + t.weight / 100 };
    }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 8);
    results.innerHTML = hits.length
      ? hits.map(({ t }) => `<li><button type="button" data-go="${esc(t.code)}">${esc(t.name)}<small>${esc(districtById.get(t.district).name)}</small></button></li>`).join("")
      : `<li style="padding:6px 4px;font-size:14px;color:var(--muted)">Nothing called that yet.</li>`;
  });
  listen(q, "keydown", (e) => { if (e.key === "Enter") { const b = results.querySelector("button"); if (b) b.click(); } });
  listen(results, "click", (e) => {
    const b = e.target.closest("[data-go]");
    if (b) { select(b.dataset.go, true); results.replaceChildren(); q.value = ""; }
  });

  // ---------- open
  paintVisited();
  showHome();
  // On a phone the map comes first. The panel starts as a bar at the bottom
  // that opens with a tap.
  if (stage.clientWidth <= 760) panel.classList.add("collapsed");
  fitAll(false);
  const hash = decodeURIComponent(location.hash.slice(1));
  if (byCode.has(hash)) select(hash, true);
})();
</script>
