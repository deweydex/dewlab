# Weekly: asks YouTube about every video linked from a page students read,
# and opens, updates or closes one `video-link` issue listing any that have
# gone or gone private. See dev/check_video_links.py for what each answer
# means. It runs on a schedule rather than in the tests because a video
# going private is nobody's pull request to fix.
name: video-links

on:
  schedule:
    - cron: "30 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python3 dev/check_video_links.py --issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
