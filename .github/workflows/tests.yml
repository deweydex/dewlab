# Unit tests, plus the handful of browser files the `browser` job at the end
# names. The rest of the e2e suite needs a 30 MB Pyodide download and a
# browser for every cell it runs (DECISIONS_LOG 0.17, 0.20); running all of
# it here would dominate the workflow for a suite that mostly guards the
# runtime, so it stays a local and manual step.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets a human re-run the checks without inventing a commit to do it with.
  # A push made by a GitHub App does not start a workflow, so a branch updated
  # that way — a merge conflict resolved through the web interface, say — can
  # otherwise sit with no checks at all on the commit that would actually land.
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-xdist numpy pandas matplotlib
          python -m pip install -r requirements-build.txt

      # Everything under tests/ except the browser suite, rather than a list of
      # files — a named list quietly stops covering each new test module.
      # Most of these build a small site of their own, about 0.4 seconds
      # each and no one test slower than four, so the time is in the number
      # of them rather than in any one: spread over the runner's cores the
      # run takes a little over half as long. Each test builds into its own
      # temporary folder, which is what makes them safe to run side by side.
      - name: Run unit tests
        run: python -m pytest tests --ignore=tests/e2e -n auto

      - name: Build the tutorials
        run: python build.py --clean

      # The curriculum map is generated from the outcome data and the tutorials'
      # own `covers:` frontmatter. A map that cannot be made at all (a `covers:`
      # code or section that does not exist) exits 2, and fails here. One that
      # is only out of date exits 1 and passes here: the map also counts the
      # italic words in every tutorial's prose, so any new sentence can make it
      # stale, and a stale planning document breaks no page. The house-style
      # job below reports it (DECISIONS_LOG 7.291).
      - name: Fail if the curriculum map cannot be made
        run: python3 dev/curriculum_map.py --check || [ $? -eq 1 ]

      # The pair game carries the topics as a JSON blob, because it is one file
      # a phone opens with no build step. A copy drifts: after thirteen topics
      # were split it still offered fourteen that no longer existed.
      - name: Fail if the pair game's topics are out of date
        run: python3 dev/build_topic_game.py --check

      # The pair reports are generated from the judgement files and checked in,
      # so a run that reported different loops each time would show up as noise
      # in every diff.
      - name: Fail if the topic editor's graph is out of date
        run: python3 dev/build_topic_editor.py --check

      - name: Fail if a pair report is out of date
        run: |
          python3 dev/pair_results.py
          python3 dev/pair_results.py --from blind
          python3 dev/pair_results.py --from sighted
          git diff --exit-code planning/curriculum/review/pair-results*.md


  # Checks that look after the project rather than any page, reported and
  # never blocking (DECISIONS_LOG 7.291): the tests marked `advisory` (a
  # house preference about tutorial prose, the tidiness of planning files),
  # the curriculum map being current, and the links inside the documents
  # about the project. Each step turns a failure into a warning on the pull
  # request, with the log saying what it found; a maintainer tidies up, and
  # a contributor is welcome to, but nobody has to before merging.
  house-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements-build.txt

      - name: Report the advisory tests
        run: |
          python -m pytest tests --ignore=tests/e2e -m advisory -rf \
            || echo "::warning title=Advisory tests::Some advisory tests failed. They do not block this pull request; the log names each one and what it found."

      - name: Report whether the curriculum map is current
        run: |
          python3 dev/curriculum_map.py --check \
            || echo "::warning title=Curriculum map::planning/CURRICULUM_MAP.md is out of date. Run python3 dev/curriculum_map.py and commit the result, or leave it for a maintainer."

      # The build already refuses to publish a tutorial whose `tutorial:` link
      # goes nowhere. This holds the documents about the project to a similar
      # standard, which they had drifted from: renamed files still cited by
      # their old paths, an index that had fallen behind the directory it
      # indexes. It is a report because no page a reader opens depends on it.
      - name: Report a document that points at a file that is not there
        run: |
          python3 dev/check_doc_links.py \
            || echo "::warning title=Document links::A document about the project names a file or a style-guide anchor that is not there. The log above lists each one."

  # The reference shows each Python name's signature as Python itself gives
  # it (dev/glossary_python.py), and a signature depends on the Python
  # version. This job runs the one Pyodide does, 3.13 for Pyodide 0.28.3, so
  # a signature file written under anything else fails here. numpy and pandas
  # are pinned to the versions that Pyodide ships; matplotlib is not, since
  # its Pyodide version has no wheel for this Python, and only its names are
  # checked, never its signatures.
  glossary-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml numpy==2.2.5 pandas==2.3.1 matplotlib

      - name: Fail if a glossary entry's Python is wrong or a signature is stale
        run: python dev/glossary_python.py --check

  # The standalone bundle is the runtime rebuilt in the older script format and
  # committed, so that build.py needs no Node. That means it can go stale the
  # moment anyone edits the runtime — and a stale copy would make downloaded
  # tutorials quietly behave like an older version of the tool. Rebuilding it
  # here and failing on any difference turns that into a caught mistake.
  standalone-bundle-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild the vendor bundles
        working-directory: vendor-src
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Fail if the committed bundle differs from a fresh build
        run: |
          if ! git diff --exit-code --stat assets/vendor/; then
            echo
            echo "assets/vendor/ is out of date with vendor-src/."
            echo "Run 'npm ci && npm run build' in vendor-src/ and commit the result."
            echo "If you meant to change a dependency, run 'npm install' instead and"
            echo "commit the updated package-lock.json alongside the rebuilt bundles."
            exit 1
          fi

  # A few browser files, not the whole e2e suite (which still stays a local
  # step, per the note at the top): the ones that prove the page's chrome
  # and the layout, and never run a cell — the reference panel, the phone
  # layout, link contrast, the course chooser, the remembered course, the
  # saved-work key migration and an old address, a panel's edge-resize
  # drag, and the topic map's names, towns and phone panel (7.293). The
  # phone identity-row regression in #230 reached main with CI
  # green because none of these ran here (DECISIONS_LOG 7.173) — the same
  # reasoning added the resize-drag file after a live-sync bug (7.197)
  # shipped with nothing here to have caught it either. Pyodide is fetched
  # once and cached: the fixture site serves it, and a page with cells
  # boots it even when no test presses Run.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest playwright
          python -m pip install -r requirements-build.txt
          python -m playwright install --with-deps chromium

      - name: Cache the self-hosted Pyodide
        id: pyodide
        uses: actions/cache@v4
        with:
          path: dev/pyodide
          key: pyodide-${{ hashFiles('dev/fetch_pyodide.py') }}

      - name: Fetch the self-hosted Pyodide
        if: steps.pyodide.outputs.cache-hit != 'true'
        run: python3 dev/fetch_pyodide.py

      - name: Run the browser tests that never run a cell
        run: |
          python -m pytest \
            tests/e2e/test_reference_panel.py \
            tests/e2e/test_page_smoke.py \
            tests/e2e/test_multi_course_pages.py \
            tests/e2e/test_panel_resize_drag.py \
            tests/e2e/test_map.py
