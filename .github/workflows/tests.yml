# Unit tests only. The e2e suite needs a 30 MB Pyodide download and a browser
# (DECISIONS_LOG 0.17, 0.20); running it here would dominate the workflow for a
# suite that mostly guards the runtime, so it stays a local and manual step
# until Phase 4 sets up hosting and there is a reason to pay for it.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets a human re-run the checks without inventing a commit to do it with.
  # A push made by a GitHub App does not start a workflow, so a branch updated
  # that way — a merge conflict resolved through the web interface, say — can
  # otherwise sit with no checks at all on the commit that would actually land.
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pandas matplotlib
          python -m pip install -r requirements-build.txt

      # Everything under tests/ except the browser suite, rather than a list of
      # files — a named list quietly stops covering each new test module.
      - name: Run unit tests
        run: python -m pytest tests --ignore=tests/e2e

      - name: Build the tutorials
        run: python build.py --clean

      # The curriculum map is generated from the outcome data and the tutorials'
      # own `covers:` frontmatter. A stale map is worse than none: it links to
      # sections that may have moved and reports coverage that may have changed.
      - name: Fail if the curriculum map is out of date
        run: python3 dev/curriculum_map.py --check

      # The pair game carries the topics as a JSON blob, because it is one file
      # a phone opens with no build step. A copy drifts: after thirteen topics
      # were split it still offered fourteen that no longer existed.
      - name: Fail if the pair game's topics are out of date
        run: python3 dev/build_topic_game.py --check

      # The build already refuses to publish a tutorial whose `tutorial:` link
      # goes nowhere. This holds the documentation about the project to the same
      # standard, which it had drifted from: renamed files still cited by their
      # old paths, an index that had fallen behind the directory it indexes.
      - name: Fail if a document points at a file that is not there
        run: python3 dev/check_doc_links.py

  # dewmark lives in its own folder with its own dependencies and tests, so it
  # gets its own job: a dewmark change cannot break the tutorials' job and a
  # tutorials change cannot break this one. The browser rehearsals
  # (dev/smoke_pages.py, dev/smoke_python_page.py) stay local and manual for
  # the same reason the e2e suite does.
  dewmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest markdown pyyaml latex2mathml

      - name: Run the exam builder's tests
        run: python -m pytest dewmark/tests -q

      - name: Build every sample exam
        run: |
          for exam in dewmark/samples/*.exam.md; do
            python dewmark/build_exam.py "$exam" --output /tmp/dewmark-out
          done

  # The standalone bundle is the runtime rebuilt in the older script format and
  # committed, so that build.py needs no Node. That means it can go stale the
  # moment anyone edits the runtime — and a stale copy would make downloaded
  # tutorials quietly behave like an older version of the tool. Rebuilding it
  # here and failing on any difference turns that into a caught mistake.
  standalone-bundle-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild the vendor bundles
        working-directory: vendor-src
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Fail if the committed bundle differs from a fresh build
        run: |
          if ! git diff --exit-code --stat assets/vendor/; then
            echo
            echo "assets/vendor/ is out of date with vendor-src/."
            echo "Run 'npm ci && npm run build' in vendor-src/ and commit the result."
            echo "If you meant to change a dependency, run 'npm install' instead and"
            echo "commit the updated package-lock.json alongside the rebuilt bundles."
            exit 1
          fi
