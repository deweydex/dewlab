# Weekly: the whole browser suite, every file in tests/e2e/. A pull request
# runs six of them (the `browser` job in tests.yml), the ones that never run a
# cell, because the rest take about ten minutes and need Python loaded in the
# browser for every page. They used to run only on whoever's laptop remembered,
# so a regression in them could sit for weeks. This is the net under that.
#
# When it fails it opens one `browser-suite` issue, or adds a comment to the one
# that is open; when it passes again it closes it. Nobody has to watch it.
#
# It also runs on a pull request that changes this file, so a change here is
# tried before it is merged.
name: browser-suite

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/browser-suite.yml
      - requirements-e2e.txt

permissions:
  contents: read
  issues: write

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-e2e.txt
          python -m playwright install --with-deps chromium

      - name: Cache the self-hosted Pyodide
        id: pyodide
        uses: actions/cache@v6
        with:
          path: dev/pyodide
          key: pyodide-${{ hashFiles('dev/fetch_pyodide.py') }}

      - name: Fetch the self-hosted Pyodide
        if: steps.pyodide.outputs.cache-hit != 'true'
        run: python3 dev/fetch_pyodide.py

      # One test at a time: they share a machine with two cores, and a test
      # that measures a page is the first to fail when that machine is busy.
      - name: Run every browser test
        run: python -m pytest tests/e2e

      - name: Open or update the issue when it failed
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create browser-suite --color B60205 \
            --description "The weekly run of the whole browser suite failed" 2>/dev/null || true
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          number=$(gh issue list --label browser-suite --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing: $run_url"
          else
            gh issue create --label browser-suite \
              --title "The whole browser suite is failing" \
              --body "The weekly run of every file in tests/e2e failed: $run_url

          The log names the tests. If one fails only on this machine and passes on yours, run it again before assuming it is flaky: the tests that measure a page are the first to fail when the machine is busy."
          fi

      - name: Close the issue when it passes again
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for number in $(gh issue list --label browser-suite --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Passing again: $run_url"
          done
