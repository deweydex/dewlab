<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <rect x="1" y="1" width="398" height="278" fill="#ffffff"/>
  <!-- cell wall (outer) and cell membrane (inner) -->
  <rect x="30" y="30" width="250" height="220" rx="28" fill="#eef4ea" stroke="#4a6741" stroke-width="7"/>
  <rect x="43" y="43" width="224" height="194" rx="22" fill="#f6faf3" stroke="#7a9a6d" stroke-width="2.5"/>
  <!-- large central vacuole -->
  <ellipse cx="160" cy="160" rx="78" ry="56" fill="#e4eef7" stroke="#8aa8c4" stroke-width="2"/>
  <!-- nucleus -->
  <circle cx="110" cy="82" r="26" fill="#dce8f5" stroke="#3d5a80" stroke-width="2.5"/>
  <circle cx="110" cy="82" r="8" fill="#a9c3de" stroke="#3d5a80" stroke-width="1.5"/>
  <!-- chloroplasts -->
  <ellipse cx="212" cy="72" rx="16" ry="9" fill="#cde3b8" stroke="#4a6741" stroke-width="1.8"/>
  <ellipse cx="238" cy="102" rx="16" ry="9" fill="#cde3b8" stroke="#4a6741" stroke-width="1.8"/>
  <ellipse cx="70" cy="196" rx="16" ry="9" fill="#cde3b8" stroke="#4a6741" stroke-width="1.8"/>
  <!-- pointer 1: cell wall -->
  <line x1="330" y1="44" x2="278" y2="36" stroke="#1a1a1a" stroke-width="1.8"/>
  <circle cx="342" cy="48" r="11" fill="#1b2a4a"/>
  <text x="342" y="53" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <!-- pointer 2: cell membrane -->
  <line x1="330" y1="128" x2="266" y2="120" stroke="#1a1a1a" stroke-width="1.8"/>
  <circle cx="342" cy="130" r="11" fill="#1b2a4a"/>
  <text x="342" y="135" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <!-- pointer 3: nucleus -->
  <line x1="60" y1="26" x2="98" y2="62" stroke="#1a1a1a" stroke-width="1.8"/>
  <circle cx="52" cy="20" r="11" fill="#1b2a4a"/>
  <text x="52" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <!-- pointer 4: chloroplast -->
  <line x1="330" y1="80" x2="228" y2="73" stroke="#1a1a1a" stroke-width="1.8"/>
  <circle cx="342" cy="82" r="11" fill="#1b2a4a"/>
  <text x="342" y="87" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <!-- pointer 5: vacuole -->
  <line x1="330" y1="204" x2="212" y2="176" stroke="#1a1a1a" stroke-width="1.8"/>
  <circle cx="342" cy="208" r="11" fill="#1b2a4a"/>
  <text x="342" y="213" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
</svg>
