<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" font-family="system-ui, sans-serif">
  <rect width="380" height="240" fill="#fdfcfa"/>
  <!-- gridlines and y-axis labels: 0 to 9, a line every 2 -->
  <g stroke="#e2ddd5" stroke-width="1">
    <line x1="45" y1="200" x2="360" y2="200"/>
    <line x1="45" y1="160" x2="360" y2="160"/>
    <line x1="45" y1="120" x2="360" y2="120"/>
    <line x1="45" y1="80"  x2="360" y2="80"/>
    <line x1="45" y1="40"  x2="360" y2="40"/>
  </g>
  <g fill="#5f6b7a" font-size="12" text-anchor="end">
    <text x="38" y="204">0</text>
    <text x="38" y="164">2</text>
    <text x="38" y="124">4</text>
    <text x="38" y="84">6</text>
    <text x="38" y="44">8</text>
  </g>
  <!-- bars: 20 pixels per unit; A=5 B=8 C=3 D=7 E=2 -->
  <g fill="#1b2a4a">
    <rect x="60"  y="100" width="44" height="100"/>
    <rect x="121" y="40"  width="44" height="160"/>
    <rect x="182" y="140" width="44" height="60"/>
    <rect x="243" y="60"  width="44" height="140"/>
    <rect x="304" y="160" width="44" height="40"/>
  </g>
  <g fill="#1a1a1a" font-size="14" text-anchor="middle">
    <text x="82"  y="222">A</text>
    <text x="143" y="222">B</text>
    <text x="204" y="222">C</text>
    <text x="265" y="222">D</text>
    <text x="326" y="222">E</text>
  </g>
  <line x1="45" y1="20" x2="45" y2="200" stroke="#5f6b7a" stroke-width="1.5"/>
  <line x1="45" y1="200" x2="360" y2="200" stroke="#5f6b7a" stroke-width="1.5"/>
</svg>
