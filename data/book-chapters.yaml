# Attribution for data/book-chapters.csv.
# Shown in the reference sidebar of any tutorial that declares this dataset,
# so a reader can trace the numbers they are working with back to their source.

source: >
  Counted from six novels already in this site's data folder, each a
  Project Gutenberg edition: Pride and Prejudice, Frankenstein, The Time
  Machine, The War of the Worlds, A Princess of Mars and The Lost World.

url: https://www.gutenberg.org

license: >
  Public domain in the United States, as the novels are. The counts are
  this site's own, and it places them in the public domain too.

snapshot: 2026-09-26

trimmed: >
  Made by dev/book_counts.py, which says how to make it again. A chapter
  is whatever the book marks as one, Frankenstein's four opening letters
  included; a table of contents is not counted. It has no live source:
  the counts come from the files in data/, which do not change.

description: >
  One row for each chapter of six novels: book, the novel's file name
  here; chapter, numbered from 1 through the whole novel; and words, how
  many words it has, where a word is a run of letters, with an
  apostrophe inside it allowed ("don't" is one word).
