<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topic editor</title>
<style>
:root{
  --ink:#1b1b1f; --dim:#6b6b76; --line:#cfcfd8; --paper:#fbfbfd;
  --box:#fff; --mark:#1b5cff; --soft:#eef2ff; --panel:#fff; --bad:#c0392b; --badsoft:#fdecea;
  --req:#5b5b66; --help:#7b8fb5; --tool:#4f9a6e; --inter:#b8860b; --inv:#c9a85a;
  --c0:#e8eef9; --c1:#f6e9e3; --c2:#e6f3ea; --c3:#f4ecf7; --c4:#fbf3dc; --c5:#e6f3f5; --c6:#ededed;
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#e9e9ef; --dim:#9a9aa6; --line:#3a3a44; --paper:#141418;
         --box:#1e1e25; --mark:#7aa2ff; --soft:#22283a; --panel:#1a1a20; --bad:#ff6b5e;
         --badsoft:#3a2220; --req:#a3a3ae; --help:#8fa4cf; --tool:#7fc59a; --inter:#e0b552; --inv:#b39a5a;
         --c0:#22283a; --c1:#3a2a24; --c2:#213328; --c3:#31263a; --c4:#3a3320; --c5:#203236; --c6:#2a2a2e; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{padding:.5rem .8rem;border-bottom:1px solid var(--line);flex:none}
.bar{display:flex;gap:.4rem;align-items:center}
h1{margin:0 .5rem 0 0;font-size:.95rem;font-weight:600;white-space:nowrap}
input,select,textarea{font:inherit;color:inherit;background:var(--box);
  border:1px solid var(--line);border-radius:7px;padding:.4rem .55rem}
input[type=search]{flex:1;min-width:0}
textarea{width:100%;resize:vertical;min-height:4.5rem}
button{font:inherit;padding:.4rem .6rem;border:1px solid var(--line);
  border-radius:7px;background:var(--box);color:inherit;cursor:pointer;white-space:nowrap}
button:disabled{opacity:.4;cursor:default}
button.act{border-color:var(--mark);color:var(--mark)}
button.warn{border-color:var(--bad);color:var(--bad)}
button[aria-pressed=true]{background:var(--soft);border-color:var(--mark);color:var(--mark)}
button.tiny{padding:.1rem .4rem;font-size:.75rem;border-radius:5px}
.hits{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem}
.hits:empty{display:none}
.cols{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem;align-items:center}
.cols small{color:var(--dim);font-size:.75rem}
.cols button{padding:.15rem .5rem;font-size:.78rem;border-radius:999px}
.cols button[aria-pressed=false]{opacity:.45}
.status{font-size:.75rem;color:var(--dim);white-space:nowrap}
.status.unsaved{color:var(--bad)}
#stage{cursor:grab}
#stage.panning{cursor:grabbing}
.node.hush rect,.node.hush text{opacity:.18}
.link.hush{opacity:.08}
.count{font-size:9.5px;fill:var(--dim)}
.hits button{padding:.2rem .5rem;font-size:.8rem;border-radius:999px}
#mode{margin-top:.4rem;padding:.45rem .7rem;border-radius:7px;background:var(--soft);
  color:var(--mark);font-weight:600;display:none;align-items:center;gap:.6rem}
#mode.on{display:flex}
#mode button{margin-left:auto}
#warn{margin-top:.4rem;padding:.45rem .7rem;border-radius:7px;background:var(--badsoft);
  color:var(--bad);display:none}
#warn.on{display:block}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;min-width:0;overflow:auto;position:relative;
  background:radial-gradient(var(--line) 1px, transparent 1px);background-size:24px 24px}
aside{width:360px;flex:none;border-left:1px solid var(--line);background:var(--panel);
  overflow:auto;padding:.8rem}
aside h2{margin:0 0 .1rem;font-size:1.05rem}
aside .code{color:var(--dim);font-size:.78rem;margin:0 0 .6rem}
aside h3{margin:.8rem 0 .25rem;font-size:.7rem;text-transform:uppercase;
  letter-spacing:.05em;color:var(--dim);display:flex;align-items:center;gap:.4rem}
aside h3 button{margin-left:auto}
aside ul{margin:0;padding:0;list-style:none}
aside li{display:flex;align-items:center;gap:.4rem;padding:.2rem 0;
  border-bottom:1px solid var(--line);font-size:.85rem}
aside li:last-child{border-bottom:0}
aside li a{flex:1;cursor:pointer;color:inherit;text-decoration:none}
aside li a:hover{color:var(--mark)}
aside li select{padding:.1rem .3rem;font-size:.75rem}
aside .none{color:var(--dim);font-size:.8rem;margin:.1rem 0}
aside label{display:block;font-size:.72rem;color:var(--dim);margin:.6rem 0 .15rem}
aside .field{width:100%}
aside .row{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.7rem}
aside p{margin:.3rem 0 .6rem}
aside kbd{font:inherit;font-size:.8em;padding:0 .3em;border:1px solid var(--line);border-radius:4px}
.log{font-size:.78rem;color:var(--dim)}
.log li{border:0;padding:.1rem 0;display:block}
.swatch{display:inline-block;width:.8em;height:.8em;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:.3em}
svg#map{display:block;user-select:none}
.node rect{stroke:var(--line);stroke-width:1.2}
.node text{font-size:11.5px;fill:var(--ink);text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.node{cursor:grab}
.node.here rect{stroke:var(--mark);stroke-width:3}
.node.pinned rect{stroke-dasharray:0;stroke:var(--dim);stroke-width:1.8}
.node.focus rect{stroke:var(--inter);stroke-width:3.5}
.node.found rect{stroke:var(--inter);stroke-width:2.4}
.node.dim rect,.node.dim text{opacity:.3}
.link{fill:none;stroke-width:1.6;cursor:pointer}
.link.hit{stroke:transparent;stroke-width:14}
.link.requires{stroke:var(--req)}
.link.helps{stroke:var(--help);stroke-dasharray:7 4}
.link.applied{stroke:var(--tool);stroke-dasharray:2 4}
.link.inter{stroke:var(--inter);stroke-width:2.2}
.link.involves{stroke:var(--inv);stroke-dasharray:3 5}
.link.on{stroke-width:3}
.link.dim{opacity:.15}
.tag{font-size:10px;fill:var(--dim)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);
  color:inherit;padding:1rem 1.1rem;max-width:32rem}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{margin:0 0 .5rem;font-size:1rem}
dialog label{display:block;font-size:.75rem;color:var(--dim);margin:.6rem 0 .15rem}
dialog input{width:100%}
dialog .row{display:flex;gap:.4rem;justify-content:flex-end;margin-top:1rem}
.key{display:flex;flex-wrap:wrap;gap:.2rem .9rem;margin-top:.35rem;font-size:.75rem;color:var(--dim)}
.key b{font-weight:400;display:flex;align-items:center;gap:.3rem}
.key path{fill:none;stroke-width:1.8}
</style></head><body>
<header>
  <div class="bar">
    <h1>Topic editor</h1>
    <input type="search" id="find" placeholder="Find a topic  ( / ) — with one chosen, a hit links to it" autocomplete="off">
    <span id="status" class="status"></span>
    <button id="undo" title="Ctrl+Z">Undo</button>
    <button id="redo" title="Ctrl+Shift+Z">Redo</button>
    <button id="out" title="Smaller">−</button>
    <button id="in" title="Bigger">+</button>
    <button id="fit">Fit</button>
    <button id="flow" aria-pressed="true" title="One-way links lean downward, so an order can appear">Flow down</button>
    <button id="tidy" title="Let go of every topic you dragged, so the links arrange them again">Let go</button>
    <button id="loadGraph" title="Add every link the repo's graph has, keeping yours">Bring in repo links</button>
    <button id="export" class="act">Export</button>
    <label><input type="file" id="import" accept=".json" hidden><button id="importBtn">Import</button></label>
    <button id="reset" class="warn">Start again</button>
  </div>
  <div class="hits" id="hits"></div>
  <div class="cols" id="cols"></div>
  <div id="mode"><span id="modeText"></span><button id="cancel">Cancel (Esc)</button></div>
  <div id="warn"></div>
  <p class="key">
    <b><svg width="26" height="11"><path d="M1 6 L25 6" style="stroke:var(--req)"/></svg> requires</b>
    <b><svg width="26" height="11"><path d="M1 6 L25 6" style="stroke:var(--help);stroke-dasharray:7 4"/></svg> helps</b>
    <b><svg width="26" height="11"><path d="M1 6 L25 6" style="stroke:var(--tool);stroke-dasharray:2 4"/></svg> applied in</b>
    <b><svg width="26" height="11"><path d="M1 6 L25 6" style="stroke:var(--inter);stroke-width:2.4"/></svg> interdependent</b>
    <b><svg width="26" height="11"><path d="M1 6 L25 6" style="stroke:var(--inv);stroke-dasharray:3 5"/></svg> involves</b>
    <b>Tap one topic, then another, to link them. Tap the second again, or press 1–5, to change the kind. Drag empty space to move around; Ctrl+wheel zooms.</b>
  </p>
</header>
<main>
  <div id="stage"><svg id="map"></svg></div>
  <aside id="panel"></aside>
</main>
<dialog id="dlg"></dialog>

// ------------------------------------------------------------------ kinds

const KINDS = ["requires", "helps", "applied", "inter", "involves"];
const TWO_WAY = new Set(["inter", "involves"]);
const SAY = {requires: "requires", helps: "helps", applied: "applied in",
             inter: "interdependent", involves: "involves"};

// ------------------------------------------------------------------ state
const STORE = "dewlab-topic-editor";

function fresh(withLinks){
  const s = {topics: clone(DATA.topics), links: [], columns: clone(DATA.columns),
             pos: {}, pinned: {}, gone: {}, log: [], flow: true};
  if(withLinks){
    for(const [a, b] of DATA.requires) s.links.push({a, b, k: "requires"});
    for(const [a, b] of DATA.level) s.links.push({a: a < b ? a : b, b: a < b ? b : a, k: "inter"});
    for(const [a, b] of DATA.helps || []) s.links.push({a, b, k: "helps"});
    for(const [a, b] of DATA.applied || []) s.links.push({a, b, k: "applied"});
  }
  s.pos = scatter(s);
  if(DATA.pos && DATA.pos.pos){ for(const c in DATA.pos.pos) if(s.topics[c]) s.pos[c] = clone(DATA.pos.pos[c]); s.pinned = clone(DATA.pos.pinned || {}); }
  return s;
}

  state = JSON.parse(past.pop()); save(); render(); showPanel(); heat(); }

  state = JSON.parse(future.pop()); save(); render(); showPanel(); heat(); }

const T = () => state.topics;
const name = c => T()[c] ? T()[c].n : c;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function anyLink(a, b){ return state.links.find(l => (l.a === a && l.b === b) || (l.a === b && l.b === a)); }
function setLink(a, b, k){
  state.links = state.links.filter(l => !((l.a === a && l.b === b) || (l.a === b && l.b === a)));
  if(k) state.links.push(TWO_WAY.has(k) ? {a: a < b ? a : b, b: a < b ? b : a, k} : {a, b, k});
}
function path(from, to){
  const nxt = {}; for(const c in T()) nxt[c] = [];
  for(const l of state.links) if(l.k === "requires" && nxt[l.a] && nxt[l.b]) nxt[l.a].push(l.b);
  const prev = {[from]: null}, q = [from];
  while(q.length){ const c = q.shift();
    if(c === to){ const p = []; for(let x = to; x !== null; x = prev[x]) p.unshift(x); return p; }
    for(const d of nxt[c]) if(!(d in prev)){ prev[d] = c; q.push(d); } }
  return null;
}

// ------------------------------------------------------------------ the field
// No order is assumed. Topics start scattered near a spot for their column,
// then the links do the arranging: every topic pushes every other away, a
// link pulls its two ends together, and a one-way link nudges its far end a
// little lower than its near end, so that an order can appear as you draw
// it without a row ever being imposed. A topic you have dragged stays put.
const NODE_W = 150, NODE_H = 46, PAD = 40;
function seat(colId){
  const i = Math.max(0, state.columns.findIndex(c => c.id === colId)), n = Math.max(1, state.columns.length);
  const cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n / cols);
  return {x: FIELD.w * ((i % cols) + 0.5) / cols, y: FIELD.h * (Math.floor(i / cols) + 0.5) / rows};
}
function scatter(s){
  const pos = {}; let seed = 7;
  const rnd = () => { seed = (seed * 48271) % 2147483647; return seed / 2147483647; };
  for(const c of Object.keys(s.topics).sort()){
    const at = (function(){ const i = Math.max(0, s.columns.findIndex(x => x.id === s.topics[c].c)), n = Math.max(1, s.columns.length);
      const cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n / cols);
      return {x: FIELD.w * ((i % cols) + 0.5) / cols, y: FIELD.h * (Math.floor(i / cols) + 0.5) / rows}; })();
    pos[c] = {x: Math.round(at.x + (rnd() - 0.5) * 520), y: Math.round(at.y + (rnd() - 0.5) * 420)};
  }
  return pos;
}
let vel = {}, alpha = 0, ticking = false, drag = null;
function ringSlots(){
  const linked = new Set(); for(const l of state.links){ linked.add(l.a); linked.add(l.b); }
  const waiting = Object.keys(T()).filter(c => !linked.has(c) && c !== state.focus)
    .sort((a, b) => (state.columns.findIndex(x => x.id === T()[a].c) - state.columns.findIndex(x => x.id === T()[b].c)) || name(a).localeCompare(name(b)));
  const slots = {}; let i = 0, k = 1;
  const cx = FIELD.w / 2 - NODE_W / 2, cy = FIELD.h / 2 - NODE_H / 2;
  while(i < waiting.length){
    const r = 300 + 205 * k, n = Math.max(6, Math.round(2 * Math.PI * r / 215));
    for(let j = 0; j < n && i < waiting.length; j++, i++){
      const th = -Math.PI / 2 + 2 * Math.PI * j / n + (k % 2 ? 0 : Math.PI / n);
      slots[waiting[i]] = {x: Math.round(cx + r * Math.cos(th)), y: Math.round(cy + r * 0.6 * Math.sin(th))};
    }
    k++;
  }
  return slots;
}
function heat(){ alpha = Math.max(alpha, 0.6); if(!ticking){ ticking = true; requestAnimationFrame(tick); } }
function tick(){
  const codes = Object.keys(T()), P = state.pos;
  for(const c of codes){ if(!P[c]) P[c] = {x: FIELD.w / 2, y: FIELD.h / 2}; if(!vel[c]) vel[c] = {x: 0, y: 0}; }
  const f = {}; for(const c of codes) f[c] = {x: 0, y: 0};
  // push apart
  for(let i = 0; i < codes.length; i++) for(let j = i + 1; j < codes.length; j++){
    const a = codes[i], b = codes[j];
    let dx = (P[a].x - P[b].x), dy = (P[a].y - P[b].y) * 1.6;
    let d2 = dx * dx + dy * dy; if(d2 < 1) { dx = 1; d2 = 1; }
    if(d2 > 700 * 700) continue;
    const k = 58000 / d2; const d = Math.sqrt(d2);
    f[a].x += k * dx / d; f[a].y += k * dy / d; f[b].x -= k * dx / d; f[b].y -= k * dy / d;
  }
  // pull together, and lean one-way links downward
  for(const l of state.links){ if(!P[l.a] || !P[l.b]) continue;
    const rest = l.k === "inter" ? 150 : l.k === "involves" ? 210 : 220;
    const dx = P[l.b].x - P[l.a].x, dy = P[l.b].y - P[l.a].y, d = Math.max(1, Math.hypot(dx, dy));
    const pull = (d - rest) * (l.k === "inter" ? 0.09 : l.k === "requires" ? 0.06 : 0.03);
    f[l.a].x += pull * dx / d; f[l.a].y += pull * dy / d; f[l.b].x -= pull * dx / d; f[l.b].y -= pull * dy / d;
    if(state.flow && !TWO_WAY.has(l.k)){ const want = 110, lean = (want - dy) * 0.05; f[l.a].y -= lean; f[l.b].y += lean; }
  }

  for(const c of codes){ const s = seat(T()[c].c); f[c].x += (s.x - P[c].x) * 0.004; f[c].y += (s.y - P[c].y) * 0.004; }
  // Building out: the focus sits in the centre, everything with no links yet
  // waits in rings around it, and everything linked is left to the springs.
  const ring = state.focus && T()[state.focus] ? ringSlots() : null;
  if(ring){ P[state.focus].x = FIELD.w / 2 - NODE_W / 2; P[state.focus].y = FIELD.h / 2 - NODE_H / 2; vel[state.focus] = {x: 0, y: 0};
    for(const c in ring){ P[c].x += (ring[c].x - P[c].x) * 0.25; P[c].y += (ring[c].y - P[c].y) * 0.25; vel[c] = {x: 0, y: 0}; } }
  let moving = 0;
  for(const c of codes){
    if(state.pinned[c] || (drag && drag.u === c) || (ring && (ring[c] || c === state.focus))){ vel[c] = {x: 0, y: 0}; continue; }
    vel[c].x = (vel[c].x + f[c].x * alpha) * 0.6; vel[c].y = (vel[c].y + f[c].y * alpha) * 0.6;
    P[c].x = Math.min(FIELD.w - NODE_W, Math.max(0, P[c].x + vel[c].x));
    P[c].y = Math.min(FIELD.h - NODE_H, Math.max(0, P[c].y + vel[c].y));
    moving += Math.abs(vel[c].x) + Math.abs(vel[c].y);
  }
  place();
  alpha *= 0.985;
  if(alpha > 0.005 && moving > 0.5) requestAnimationFrame(tick);
  else { ticking = false; for(const c of codes){ P[c].x = Math.round(P[c].x); P[c].y = Math.round(P[c].y); } save(); }
}

// ------------------------------------------------------------------ drawing
const map = document.getElementById("map"), stage = document.getElementById("stage");
let scale = 1;
function wrap(text, chars = 21, lines = 2){
  const out = []; let line = "";
  for(const w of String(text).split(/\s+/)){ const n = (line + " " + w).trim();
    if(n.length > chars && line){ out.push(line); line = w; } else line = n; }
  out.push(line);
  if(out.length > lines){ out.length = lines; out[lines - 1] = out[lines - 1].slice(0, chars - 1) + "…"; }
  return out;
}
const colourOf = c => "var(--c" + Math.min(6, Math.max(0, state.columns.findIndex(x => x.id === c))) + ")";
function anchor(a, b){
  const pa = state.pos[a], pb = state.pos[b];
  const ax = pa.x + NODE_W / 2, ay = pa.y + NODE_H / 2, bx = pb.x + NODE_W / 2, by = pb.y + NODE_H / 2;
  const dx = bx - ax, dy = by - ay;
  if(Math.abs(dx) * NODE_H > Math.abs(dy) * NODE_W){ const s = Math.sign(dx) || 1; return [ax + s * NODE_W / 2, ay, bx - s * NODE_W / 2, by]; }
  const s = Math.sign(dy) || 1; return [ax, ay + s * NODE_H / 2, bx, by - s * NODE_H / 2];
}
const wire = (a, b) => { const [x1, y1, x2, y2] = anchor(a, b), mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  return Math.abs(x2 - x1) > Math.abs(y2 - y1) ? `M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}` : `M${x1} ${y1} C${x1} ${my} ${x2} ${my} ${x2} ${y2}`; };
function render(){
  let html = `<defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--req)"/></marker>
    <marker id="head-help" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--help)"/></marker>
    <marker id="head-tool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--tool)"/></marker>
  </defs>`;
  for(const l of state.links){
    if(!T()[l.a] || !T()[l.b]) continue;
    const head = l.k === "requires" ? ' marker-end="url(#head)"' : l.k === "helps" ? ' marker-end="url(#head-help)"' : l.k === "applied" ? ' marker-end="url(#head-tool)"' : "";
    html += `<path class="link hit" data-a="${l.a}" data-b="${l.b}"><title>${esc(name(l.a))} ${SAY[l.k]} ${esc(name(l.b))}</title></path><path class="link ${l.k}" data-a="${l.a}" data-b="${l.b}"${head}/>`;
  }
  const inn = {}, out = {}; for(const c in T()){ inn[c] = 0; out[c] = 0; }
  for(const l of state.links){ if(!T()[l.a] || !T()[l.b]) continue;
    if(TWO_WAY.has(l.k)){ inn[l.a]++; inn[l.b]++; } else { out[l.a]++; inn[l.b]++; } }
  for(const c of Object.keys(T()).sort()){
    const t = T()[c], ls = wrap(t.n), top = NODE_H / 2 - (ls.length - 1) * 6.5;
    html += `<g class="node${state.pinned[c] ? " pinned" : ""}" data-u="${c}"><title>${esc(t.n)}\n${esc(t.p)}</title><rect width="${NODE_W}" height="${NODE_H}" rx="8" style="fill:${colourOf(t.c)}"/><text>` +
      ls.map((l, i) => `<tspan x="${NODE_W / 2}" y="${(top + i * 13).toFixed(1)}">${esc(l)}</tspan>`).join("") + "</text>" +

function place(){

function applyScale(){ map.setAttribute("width", Math.round(FIELD.w * scale)); map.setAttribute("height", Math.round(FIELD.h * scale)); }
function fit(){ scale = Math.min(1.3, (stage.clientWidth - 8) / FIELD.w, (stage.clientHeight - 8) / FIELD.h); applyScale(); }
let shownCols = null;   // null means every column
function light(){

const panel = document.getElementById("panel");
function kindSelect(l, other){

// ------------------------------------------------------------------ actions
const warn = msg => { const w = document.getElementById("warn"); w.textContent = msg || ""; w.classList.toggle("on", Boolean(msg)); if(msg) setTimeout(() => w.classList.remove("on"), 7000); };
let lastLink = null;
function crowded(){
  // Nine links in or nine out is about as many as a student can hold, and
  // the map's close-up stops being readable past it.
  for(const c of [lastLink.a, lastLink.b]){ let inn = 0, out = 0;
    for(const l of state.links){ if(TWO_WAY.has(l.k)){ if(l.a === c || l.b === c) inn++; } else if(l.a === c) out++; else if(l.b === c) inn++; }
    if(inn >= 9 || out >= 9) warn(`${name(c)} now has ${inn} links in and ${out} out. Nine either way is about the most a student can hold.`); }
}
function tapLink(a, b){
  lastLink = {a, b};
  const l = anyLink(a, b);
  if(!l){
    const p = path(b, a);
    if(p){ warn("Requires would make a loop: " + p.map(name).join(" → ") + " → " + name(a) + ". Made it “helps” instead.");
      commit(`${name(a)} helps ${name(b)}`, () => setLink(a, b, "helps")); return; }
    commit(`${name(a)} requires-before ${name(b)}`, () => setLink(a, b, "requires")); return;
  }
  const i = KINDS.indexOf(l.k), next = KINDS[i + 1];
  if(!next){ commit(`unlink ${name(a)} / ${name(b)}`, () => setLink(a, b, null)); return; }
  if(next === "requires"){ const p = path(b, a); if(p){ warn("Requires would make a loop; skipped it."); commit(`${name(a)} helps ${name(b)}`, () => setLink(a, b, "helps")); return; } }
  const x = TWO_WAY.has(next) ? a : l.a, y = TWO_WAY.has(next) ? b : l.b;
  commit(`${name(x)} ${SAY[next]} ${name(y)}`, () => setLink(x, y, next));
}
function changeKind(other, k){
  const l = anyLink(here, other); if(!l) return;
  if(k === "requires"){ const p = path(l.b, l.a); if(p){ warn("That would make a loop: " + p.map(name).join(" → ")); showPanel(); return; } }
  commit(`${name(l.a)} ${SAY[k]} ${name(l.b)}`, () => setLink(l.a, l.b, k));
}
function merge(keep, gone){
  commit(`merge ${name(gone)} into ${name(keep)}`, () => {
    const k = T()[keep], g = T()[gone];
    for(const o of g.o) if(!k.o.includes(o)) k.o.push(o);
    for(const w of g.w) if(!k.w.includes(w)) k.w.push(w);
    for(const x of g.t) if(!k.t.includes(x)) k.t.push(x);
    const out = [];
    for(const l of state.links){ const a = l.a === gone ? keep : l.a, b = l.b === gone ? keep : l.b;
      if(a === b || out.some(m => (m.a === a && m.b === b) || (m.a === b && m.b === a))) continue;
      out.push(TWO_WAY.has(l.k) ? {a: a < b ? a : b, b: a < b ? b : a, k: l.k} : {a, b, k: l.k}); }
    state.links = out;
    delete T()[gone]; delete state.pos[gone];
    for(const c in state.gone) if(state.gone[c] === gone) state.gone[c] = keep;
    state.gone[gone] = keep;
  });
}
function cutBefore(){ commit(`cut everything before ${name(here)}`, () => { state.links = state.links.filter(l => TWO_WAY.has(l.k) || l.b !== here); }); }
function split(){
  const t = T()[here], old = here;
  const suggest = n => /[a-z]$/.test(old) ? old + n : old + "ab"[n - 1];
  const dlg = document.getElementById("dlg");
  dlg.innerHTML = `<h2>Split “${esc(t.n)}”</h2>
    <p class="none">Both halves keep every link this topic has; remove what does not belong afterwards. The first half takes over the old code's saved work and judgements.</p>
    <label>First half — name</label><input id="s1n" value="${esc(t.n)} (part 1)">
    <label>First half — code</label><input id="s1c" value="${esc(suggest(1))}">
    <label>Second half — name</label><input id="s2n" value="${esc(t.n)} (part 2)">
    <label>Second half — code</label><input id="s2c" value="${esc(suggest(2))}">
    <div class="row"><button id="sNo">Cancel</button><button id="sOk" class="act">Split</button></div>`;
  dlg.showModal();
  dlg.querySelector("#sNo").onclick = () => dlg.close();
  dlg.querySelector("#sOk").onclick = () => {
    const c1 = dlg.querySelector("#s1c").value.trim(), c2 = dlg.querySelector("#s2c").value.trim();
    const n1 = dlg.querySelector("#s1n").value.trim(), n2 = dlg.querySelector("#s2n").value.trim();
    if(!c1 || !c2 || c1 === c2 || T()[c1] || T()[c2]){ warn("Each half needs its own new code."); return; }
    dlg.close();
    commit(`split ${name(old)} into ${n1} and ${n2}`, () => {
      T()[c1] = Object.assign(clone(t), {n: n1}); T()[c2] = Object.assign(clone(t), {n: n2, o: []});
      const p = state.pos[old]; state.pos[c1] = {x: p.x - NODE_W / 2 - 8, y: p.y}; state.pos[c2] = {x: p.x + NODE_W / 2 + 8, y: p.y};
      const out = [];
      for(const l of state.links){ const xs = l.a === old ? [c1, c2] : [l.a], ys = l.b === old ? [c1, c2] : [l.b];
        for(const a of xs) for(const b of ys){ if(a === b || out.some(m => (m.a === a && m.b === b) || (m.a === b && m.b === a))) continue;
          out.push(TWO_WAY.has(l.k) ? {a: a < b ? a : b, b: a < b ? b : a, k: l.k} : {a, b, k: l.k}); } }
      state.links = out;
      delete T()[old]; delete state.pos[old]; state.gone[old] = c1;
      for(const c in state.gone) if(state.gone[c] === old) state.gone[c] = c1;
    });

  };
}
function edit(field, value){
  const t = T()[here];
  if(field === "c" && value === "__new"){
    const nm = prompt("Name of the new column"); if(!nm){ showPanel(); return; }
    const id = nm.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    commit(`new column ${nm}`, () => { if(!state.columns.some(c => c.id === id)) state.columns.push({id, name: nm}); t.c = id; });
    return;
  }
  const v = field === "t" ? value.split(",").map(s => s.trim()).filter(Boolean) : value;
  if(JSON.stringify(t[field]) === JSON.stringify(v)) return;
  commit(`${field === "n" ? "rename" : "edit " + field} ${name(here)}`, () => { t[field] = v; });
}
function startPick(kind){
  pick = kind;
  document.getElementById("modeText").textContent = `Tap the topic to merge into “${name(here)}” — or search for it.`;
  document.getElementById("mode").classList.add("on");
}
function endPick(){ pick = null; document.getElementById("mode").classList.remove("on"); }

// ------------------------------------------------------------------ wiring
function choose(code, plain){
  if(pick){ const k = pick; endPick(); if(k === "merge" && code !== here) merge(here, code); return; }
  if(state.focus && T()[state.focus] && !plain && code !== state.focus && !anyLink(state.focus, code)
     && !state.links.some(l => l.a === code || l.b === code)){
    // A topic still waiting in the ring: the first tap links it straight to
    // the centre, centre first, and lets it come in.
    here = state.focus; tapLink(state.focus, code); return; }
  if(here && here !== code && !plain && T()[here]){ tapLink(here, code); return; }
  here = code; light(); showPanel();
}
map.addEventListener("pointerdown", e => {
  const n = e.target.closest(".node"); if(!n) return;
  const p = state.pos[n.dataset.u];
  drag = {u: n.dataset.u, x0: e.clientX, y0: e.clientY, px: p.x, py: p.y, moved: false};
  n.setPointerCapture(e.pointerId);
});
map.addEventListener("pointermove", e => {
  if(!drag) return;
  const dx = (e.clientX - drag.x0) / scale, dy = (e.clientY - drag.y0) / scale;
  if(!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true;
  const p = state.pos[drag.u];
  p.x = Math.min(FIELD.w - NODE_W, Math.max(0, Math.round(drag.px + dx)));
  p.y = Math.min(FIELD.h - NODE_H, Math.max(0, Math.round(drag.py + dy)));
  place(); heat();
});
map.addEventListener("pointerup", e => {
  if(!drag) return;
  const d = drag; drag = null;
  if(d.moved){ const p = state.pos[d.u]; const nx = p.x, ny = p.y; p.x = d.px; p.y = d.py;
    commit(`move ${name(d.u)}`, () => { state.pos[d.u] = {x: nx, y: ny}; state.pinned[d.u] = true; }); return; }
  choose(d.u, e.shiftKey);
});
let pan = null;
stage.addEventListener("pointerdown", e => {
  if(e.target.closest(".node") || e.target.closest(".link")) return;
  pan = {x: e.clientX, y: e.clientY, l: stage.scrollLeft, t: stage.scrollTop, moved: false};
  stage.classList.add("panning");
});
stage.addEventListener("pointermove", e => {
  if(!pan) return;
  const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
  if(Math.hypot(dx, dy) > 3) pan.moved = true;
  stage.scrollLeft = pan.l - dx; stage.scrollTop = pan.t - dy;
});
addEventListener("pointerup", e => {
  if(!pan) return;
  const moved = pan.moved; pan = null; stage.classList.remove("panning");
  if(moved || e.target.closest(".node")) return;
  const l = e.target.closest(".link"); if(l){ here = l.dataset.a; light(); showPanel(); return; }
  if(!pick){ here = null; light(); showPanel(); }
});
stage.addEventListener("wheel", e => {
  if(!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  const r = stage.getBoundingClientRect(), fx = (stage.scrollLeft + e.clientX - r.left) / scale, fy = (stage.scrollTop + e.clientY - r.top) / scale;
  scale = Math.min(3, Math.max(0.15, scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15))); applyScale();
  stage.scrollLeft = fx * scale - (e.clientX - r.left); stage.scrollTop = fy * scale - (e.clientY - r.top);
}, {passive: false});
panel.addEventListener("click", e => {
  const go = e.target.closest("[data-go]"); if(go){ here = go.dataset.go; light(); showPanel(); return; }
  const un = e.target.closest("[data-unlink]"); if(un){ const o = un.dataset.unlink; commit(`unlink ${name(here)} / ${name(o)}`, () => setLink(here, o, null)); return; }
  const pk = e.target.closest("[data-pick]"); if(pk){ startPick(pk.dataset.pick); return; }
  const flip = e.target.closest("[data-flip]"); if(flip){ const o = flip.dataset.flip, l = anyLink(here, o);
    if(l){ if(l.k === "requires"){ const p = path(l.a, l.b); if(p && p.length > 2){ warn("Turning it round would make a loop: " + p.map(name).join(" → ")); return; } }
      commit(`turn round ${name(l.a)} / ${name(l.b)}`, () => setLink(l.b, l.a, l.k)); } return; }
  const act = e.target.closest("[data-do]"); if(act){
    if(act.dataset.do === "cut") cutBefore();

    if(act.dataset.do === "focus"){ const on = state.focus !== here;
      commit(on ? `build out from ${name(here)}` : "stop building out", () => { state.focus = on ? here : null; if(on) state.pinned[here] = true; });
      alpha = 1; heat(); if(on){ const el = map.querySelector(`.node[data-u="${CSS.escape(here)}"]`); setTimeout(() => el && el.scrollIntoView({block: "center", inline: "center"}), 400); } }

const find = document.getElementById("find"), hits = document.getElementById("hits");

function jump(code, plain){

    commit(`${name(l.a)} ${SAY[k]} ${name(l.b)}`, () => setLink(l.a, l.b, k));
  }

document.getElementById("cols").addEventListener("click", e => {

  if(b.dataset.c === "*") shownCols = null;

    shownCols.has(b.dataset.c) ? shownCols.delete(b.dataset.c) : shownCols.add(b.dataset.c);
    if(shownCols.size === state.columns.length) shownCols = null; }
  drawCols(); light();
});
